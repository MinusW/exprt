      - id: ref-q1cd-keys-and-overlap
        block_type: reflection_rubric
        title: "Q1(c) & Q1(d) (11 pts) — Inventaire des identifiants & Vétérinaire-Propriétaire"
        answer_mode: text
        prompt: |
          * **(c) (7 pts)** Spécifier les identifiants de **toutes les entités** de votre schéma final (après (a) et (b)), en précisant clairement quelles entités sont **fortes** ou **faibles** et leurs clés.
          * **(d) (4 pts)** Supposons maintenant qu'un **vétérinaire puisse également être propriétaire d'animaux**, avec un **`Rabais` personnalisé** (variable selon le vétérinaire-propriétaire). Proposer une modification du modèle permettant ce scénario.
        self_check_criteria:
          - "(c) Listé toutes les entités en distinguant explicitement fortes (`Propriétaire`, `Clinique`, `Animal` + sous-classes, `TypeAnimal`, `Consultation`) et faibles (`Vétérinaire` avec `(IdClinique, NoInterne)`, `HistoriqueCommission` avec `(NomType, DateMaj)`)."
          - "(d) Introduit une association `0..1 — 0..1` (avec attribut `Rabais`) entre `Vétérinaire` et `Propriétaire` OU une super-classe `Personne` avec spécialisation `{total, overlapping}`."
        model_answer: |
          ### (c) Entités fortes vs. faibles et leurs clés (7 pts)
          | Entité | Type | Clé primaire (et clé partielle si faible) |
          | :--- | :--- | :--- |
          | `Clinique` | Forte | `IdClinique` |
          | `Vétérinaire` | **Faible** (dépend de `Clinique`) | `(IdClinique, NoInterne)` (`NoInterne` = clé partielle) |
          | `Propriétaire` | Forte | `NoClient` |
          | `Animal` | Forte | `IdAnimal` |
          | `Chien`, `Chat`, `Oiseau` | Sous-classes d'`Animal` | `IdAnimal` (héritée d'`Animal`) |
          | `Consultation` | Forte *(ou faible de `Animal`)* | `IdConsultation` *(ou `(IdAnimal, Date)`)* |
          | `TypeAnimal` | Forte | `NomType` |
          | `HistoriqueCommission` | **Faible** (dépend de `TypeAnimal`) | `(NomType, DateMaj)` (`DateMaj` = clé partielle) |

          ### (d) Vétérinaire pouvant être Propriétaire avec `Rabais` (4 pts)
          * **Option 1 (Association `0..1 — 0..1`)** : Ajouter une association `Est_aussi` entre `Vétérinaire` (`0..1`) et `Propriétaire` (`0..1`) portant l'attribut **`Rabais`**.
          * **Option 2 (Généralisation `{total, overlapping}`)** : Créer une super-classe `Personne(IdPersonne, Nom, Prenom)` spécialisée en `{total, overlapping}` vers `Vétérinaire` et `Propriétaire`, et placer `Rabais` (optionnel) ou une association sur le chevauchement.

