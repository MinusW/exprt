      - id: ref-q2b-mapping
        block_type: reflection_rubric
        title: "Q2(b) (18 pts) — Traduction de Q2(b)"
        answer_mode: text
        prompt: |
          Lister les relations obtenues lors du passage du modèle EA **Q2(b)** au modèle relationnel (`R(att1, ...)` avec PK, FK, `UNIQUE`, `NOT NULL`).
        self_check_criteria:
          - "`H(h1, h2)` (`PK: h1`), `I(i1, i2)` (`PK: i1`), `J(j1, j2)` (`PK: j1`)."
          - "`F(f1, f2, h1, fh1)` : fusion de l'association `1..* : 1` et de la classe d'association `FH` dans `F`, avec `FK: h1 -> H(h1) NOT NULL` et `fh1 NOT NULL`."
          - "`G(i1, g1, g2)` : entité faible qualifiée par `g1` sur `I`, `PK: (i1, g1)`, `FK: i1 -> I(i1)`."
          - "`HIJ(h1, i1, j1)` : ternaire avec `PK: (h1, i1)` (grâce au `1` sur `J`), FKs vers `H, I, J`, et `j1 NOT NULL`."
        model_answer: |
          ### Relations pour Q2(b) (18 pts)
          1. **`H(h1, h2)`** — **PK** : `h1`
          2. **`I(i1, i2)`** — **PK** : `i1`
          3. **`J(j1, j2)`** — **PK** : `j1`
          4. **`F(f1, f2, h1, fh1)`** *(chaque `F` est lié à `1` `H`)*
             * **PK** : `f1`
             * **FK** : `h1` référence `H(h1)`, **`NOT NULL`**
             * **`fh1 NOT NULL`**
          5. **`G(i1, g1, g2)`** *(entité faible qualifiée par `g1` sur `I`)*
             * **PK** : `(i1, g1)`
             * **FK** : `i1` référence `I(i1)`
          6. **`HIJ(h1, i1, j1)`** *(ternaire avec multiplicité `1` côté `J`)*
             * **PK** : `(h1, i1)`
             * **FK** : `h1` référence `H(h1)`
             * **FK** : `i1` référence `I(i1)`
             * **FK** : `j1` référence `J(j1)`, **`NOT NULL`**

