      - id: ref-q2a-mapping
        block_type: reflection_rubric
        title: "Q2(a) (12 pts) — Traduction de Q2(a) & alternatives d'héritage"
        answer_mode: text
        prompt: |
          * **i. (10 pts)** Lister les relations obtenues pour le schéma **Q2(a)** (avec PK, FK, `UNIQUE`, `NOT NULL`).
          * **ii. (2 pts)** Mentionner les alternatives possibles en fonction du type d'héritage (`partiel/total`, `disjoint/chevauchant`). Pas besoin de les développer.
        self_check_criteria:
          - "i. `A(a1)` (`PK: a1`), `B(a1, b1)` (`PK: a1`, `FK: a1 -> A(a1)`), `C(a1, c1, parent_a1)` (`PK: a1`, `FK: a1 -> A(a1)`, `FK: parent_a1 -> C(a1) NOT NULL`)."
          - "ii. Mentionné les 3 stratégies (super-classe + sous-classes, descente vers sous-classes si `total`, table unique avec attributs nullables) et quand chacune s'applique."
        model_answer: |
          ### i. Relations pour Q2(a) (10 pts)
          1. **`A(a1)`**
             * **PK** : `a1`
          2. **`B(a1, b1)`**
             * **PK** : `a1`
             * **FK** : `a1` référence `A(a1)`
          3. **`C(a1, c1, c_parent)`** *(l'association récursive `1 : *` `CC` sur `C` place la FK du côté `*` vers le côté `1`)*
             * **PK** : `a1`
             * **FK** : `a1` référence `A(a1)`
             * **FK** : `c_parent` référence `C(a1)`, **`NOT NULL`** *(chaque `C` est lié à exactement `1` `C`)*

          ### ii. Alternatives selon le type d'héritage (2 pts)
          * **Super-classe + sous-classes** : Valable pour les 4 combinaisons (`partiel/total`, `disjoint/chevauchant`).
          * **Sous-classes uniquement (pas de table `A`)** : Uniquement possible si l'héritage est **`total`** (sans perte si `disjoint`, avec redondance si `chevauchant`).
          * **Table unique (`A` regroupant tous les attributs)** : Possible pour les 4 combinaisons avec des attributs nullables (une colonne `type` si `disjoint`, des booléens `est_B, est_C` si `chevauchant`).

