id: bdr-2025-te1-exam
title: "Mock Exam: BDR TE1 (Nov 2025)"
description: "Full 90-minute BDR TE1 past exam (4 November 2025, 100 pts): Veterinary clinic ER modeling with weak entities, recursive constraint, specialization, and commission history (40 pts), ER-to-relational mapping with inheritance alternatives and ternary constraints (30 pts), Relational Algebra evaluation and θ-join rewriting (10 pts), and Factory RA queries including division (20 pts)."
category: "Database Systems"
track: "Relational Database Fundamentals (BDR)"
track_order: 9
estimated_minutes: 90
tags: ["mock-exam", "exam", "bdr", "te1"]
prerequisites:
  - "bdr-ch1-dbms-concepts"
  - "bdr-ch2-entity-relationship-modeling"
  - "bdr-ch3-relational-model-constraints"
  - "bdr-ch4-er-to-relational-mapping"
  - "bdr-ch5-relational-algebra"
sources:
  - title: "BDR TE1 — Travail Écrit du 4 Novembre 2025 (Fatemi & Tischhauser)"
    url_or_path: "sources/BDR-TE1/tests/BDR25_TE1.pdf"
    notes: "Official 90-minute TE1 exam paper (100 points total)"

sections:
  - id: sec-exam-overview
    title: "Exam Overview & Strategy"
    blocks:
      - id: md-exam-briefing
        block_type: markdown
        title: "TE1 Format & Time Budget (90 Minutes — 100 Points)"
        content: |
          | Question | Topic | Points | Suggested Time |
          | :--- | :--- | :---: | :---: |
          | **Q1 (a–d)** | Modèle Entité-Association (Cliniques vétérinaires) | 40 | 35 min |
          | **Q2 (a–b)** | Passage EA $\to$ Modèle Relationnel + Alternatives d'héritage | 30 | 25 min |
          | **Q3 (a–e)** | Évaluation d'expressions d'Algèbre Relationnelle + Réécriture | 10 | 10 min |
          | **Q4 (a–d)** | Requêtes en Algèbre Relationnelle (Usines & Production) | 20 | 20 min |

          > [!TIP]
          > **Key Traps in This Paper:**
          > * **Q1:** `Vétérinaire` is a **weak entity** of `Clinique` (`NoInterne` is unique only within a clinic). Also watch out for the **commission history** requirement (storing historical rates with update dates).
          > * **Q2(a):** Watch out for the **recursive `1 : *` association** `CC` on `C`.
          > * **Q4(b):** Both `LigneProduction` and `Piece` have an attribute named `Nom` — projecting `IdLigne` before intersecting avoids natural-join name collisions!

  - id: sec-q1-er-modeling
    title: "Question 1 — Modèle EA : Cliniques vétérinaires (40 points)"
    blocks:
      - id: ref-q1ab-vet-er
        block_type: reflection_rubric
        title: "Q1(a) & Q1(b) (29 pts) — Schéma EA complet (Cliniques, Animaux & Historique des commissions)"
        answer_mode: paper
        prompt: |
          **Partie (a) (21 pts)** — Compléter le schéma EA (`Clinique`, `Vétérinaire`, `Propriétaire`, `Animal`) :
          * **Propriétaire** : `NoClient` unique, `Nom`, `Prenom`, `Adresse` composée (`Ville`, `Rue`, `CodePostal`), et un ou plusieurs numéros de téléphone (`Tel`).
          * **Clinique & Vétérinaire** : Chaque vétérinaire travaille dans une seule clinique, et chaque clinique emploie un ou plusieurs vétérinaires. Une clinique a un `IdClinique` unique et un `Nom`. Un vétérinaire a un `Nom` et un `NoInterne` unique *dans sa clinique* (deux vétérinaires de cliniques différentes peuvent avoir le même numéro).
          * **Hiérarchie** : Un vétérinaire peut avoir un responsable hiérarchique qui est lui-même un vétérinaire de la **même clinique**.
          * **Animal** : `IdAnimal` unique, `Nom`, `DateNaiss`. Un propriétaire possède au moins un animal, et chaque animal appartient à un seul propriétaire.
          * **Consultation** : Concerne un seul animal, est effectuée par un seul vétérinaire, possède une `Date` et un `Prix`. Un animal peut avoir plusieurs consultations, un vétérinaire peut en effectuer plusieurs. On doit pouvoir accéder à toutes les consultations de chaque clinique, et chaque vétérinaire ne fait des consultations que dans la clinique où il travaille.

          **Partie (b) (8 pts)** — Étendre le schéma :
          * Les cliniques traitent des **chiens** (`Race`, `Poids`), des **chats** (`CouleurPelage`), et des **oiseaux** (`Espèce`, `TailleAiles`), *parmi d'autres types d'animaux*.
          * Les vétérinaires reçoivent une **commission** par consultation selon le type d'animal (`5%` chien, `3%` chat, `2%` oiseau). On doit pouvoir mettre à jour ces taux et **conserver l'historique des dates de mise à jour** pour calculer le total des commissions sur un intervalle donné.
        self_check_criteria:
          - "`Propriétaire` avec `NoClient` (PK), attribut composé `Adresse(Ville, Rue, CodePostal)` et attribut multivalué `Tel [1..*]`."
          - "`Vétérinaire` modélisé comme **entité faible** de `Clinique` (`NoInterne` = clé partielle / qualificateur), cardinalités `1` côté `Clinique` et `1..*` côté `Vétérinaire`."
          - "Association récursive sur `Vétérinaire` (`0..1` côté responsable, `*` côté subordonné) + **contrainte sémantique** : le responsable appartient à la même clinique."
          - "`Consultation` reliée à `Animal` (`1` côté `Animal`, `*` côté `Consultation`) et `Vétérinaire` (`1` côté `Vétérinaire`, `*` côté `Consultation`). L'accès par clinique et la contrainte de clinique découlent de la dépendance `Vétérinaire -> Clinique` (ou via contrainte explicite)."
          - "Spécialisation `{partial, disjoint}` de `Animal` vers `Chien`, `Chat`, `Oiseau`."
          - "Entité `TypeAnimal` + entité faible `HistoriqueCommission(DateMiseAJour [PK partielle], Taux)` (ou entité/association datée) permettant de retrouver le taux en vigueur à la date d'une consultation."
        model_answer: |
          ### Points clés du schéma Q1(a) + Q1(b)

          1. **`Propriétaire`** : `NoClient` (PK), `Nom`, `Prenom`, attribut composé `Adresse {Ville, Rue, CodePostal}`, attribut multivalué `Tel [1..*]`.
          2. **`Clinique`** (`IdClinique` [PK], `Nom`) $\xleftarrow{1 \quad \text{Emploie} \quad 1..*}$ **`Vétérinaire`** (entité faible, clé partielle `NoInterne`, `Nom`).
          3. **Récursive `Supervise` sur `Vétérinaire`** : `0..1` côté responsable, `*` côté subordonné, avec **contrainte d'intégrité sémantique** : `vétérinaire.IdClinique = responsable.IdClinique`.
          4. **`Animal`** (`IdAnimal` [PK], `Nom`, `DateNaiss`) $\xrightarrow{1 \quad \text{Possède} \quad 1..*}$ **`Propriétaire`**.
          5. **`Consultation`** (`IdConsultation` [PK] ou entité faible `(IdAnimal, Date)`, `Prix`) reliée à `Animal` (`1` côté `Animal`, `*` côté `Consultation`) et `Vétérinaire` (`1` côté `Vétérinaire`, `*` côté `Consultation`). Comme `Vétérinaire` dépend de `Clinique`, toute consultation est automatiquement rattachée à la clinique du vétérinaire.
          6. **Spécialisation d'`Animal`** : **`{partial, disjoint}`** ("parmi d'autres types d'animaux") vers `Chien(Race, Poids)`, `Chat(CouleurPelage)`, `Oiseau(Espèce, TailleAiles)`.
          7. **Historique des commissions** : Entité `TypeAnimal(NomType [PK])` associée à une entité faible **`HistoriqueCommission(DateMiseAJour [PK partielle], Taux)`** (`1` côté `TypeAnimal`, `1..*` côté `HistoriqueCommission`). On relie `Animal` à `TypeAnimal` (`1` côté `TypeAnimal`, `*` côté `Animal`) — ou `Consultation` au `HistoriqueCommission` en vigueur à `Consultation.Date`.
