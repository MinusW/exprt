        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: md-q3-tables
        question: "What is the result of **Q3(c)**: $\\pi_{B, C, D}(R) \\div T$?"
        options:
          - "Schema (B): {(5)}"
          - "Schema (B): {(4), (5), (7)}"
          - "Schema (A, B): {(4, 5)}"
          - "Empty relation ∅"
        correct_answer: "Schema (B): {(5)}"
        explanation: "$T(C, D) = \\{(4,c), (8,d), (4,b)\\}$. In $\\pi_{B,C,D}(R)$, only `B = 5` is paired with all three tuples `(4,c)`, `(8,d)`, and `(4,b)`. `B = 4` only has `(6,e)` and `B = 7` only has `(5,c)`."
        hints:
          - "First project `R` onto `(B, C, D)` — note that `A` is removed, leaving only `B` as the quotient attribute."
          - "Check which `B` values appear with ALL 3 pairs in `T`: `(4,c)`, `(8,d)`, and `(4,b)`."

      - id: ref-q3-all-solutions
        block_type: reflection_rubric
        title: "Q3(a–e) (10 pts) — Évaluation & réécriture"
        answer_mode: text
        prompt: |
          Évaluer les expressions suivantes (étapes intermédiaires conseillées) :
          * **(a) (2 pts)** $\pi_{A, D}(R) - \rho_{A, D}(T)$
          * **(b) (3 pts)** $\pi_{E, G}(\sigma_{F < 90}(S)) \times \pi_A(R)$
          * **(c) (2 pts)** $\pi_{B, C, D}(R) \div T$
          * **(d) (2 pts)** $S \otimes \rho_{E, G}(T)$
          * **(e) (1 pt)** Exprimer $M \otimes_{X < Y} N$ sans faire usage de $\otimes$.
        self_check_criteria:
          - "(a) `(A, D): {(8, e), (8, c)}`."
          - "(b) `(E, G, A): {(4, c, 4), (4, c, 8), (2, d, 4), (2, d, 8)}` (doublons éliminés par $\\pi$)."
          - "(c) `(B): {(5)}`."
          - "(d) `(E, F, G): {(4, 85, c), (4, 80, c)}`."
          - "(e) $\\sigma_{X < Y}(M \\times N)$."
        model_answer: |
          * **(a) Résultat `(A, D)`** : `{(8, e), (8, c)}`
            * $\pi_{A,D}(R) = \{(4,c), (8,e), (8,d), (8,c), (4,b)\}$ ; $\rho_{A,D}(T) = \{(4,c), (8,d), (4,b)\}$.
          * **(b) Résultat `(E, G, A)`** : `{(4, c, 4), (4, c, 8), (2, d, 4), (2, d, 8)}`
            * $\pi_{E,G}(\sigma_{F<90}(S)) = \{(4, c), (2, d)\}$ (doublon `(4, c)` éliminé par $\pi$) ; $\pi_A(R) = \{(4), (8)\}$.
          * **(c) Résultat `(B)`** : `{(5)}`
            * Seul `B = 5` est associé à tous les couples `(4, c)`, `(8, d)` et `(4, b)` de `T`.
          * **(d) Résultat `(E, F, G)`** : `{(4, 85, c), (4, 80, c)}`
            * Jointure naturelle sur `(E, G)` avec $\rho_{E,G}(T) = \{(4,c), (8,d), (4,b)\}$.
          * **(e)** $\sigma_{X < Y}(M \times N)$

  - id: sec-q4-ra-queries
    title: "Question 4 — Requêtes en algèbre relationnelle (20 points)"
    blocks:
      - id: md-q4-schema
        block_type: markdown
        title: "Schéma relationnel — Usines & Production"
        content: |
          * `Usine(IdUsine, NomUsine, VilleUsine, Pays)`
          * `Employe(IdEmploye, Nom, Prenom, Ville, IdUsine)` (`IdUsine` $\to$ `Usine.IdUsine`)
          * `LigneProduction(IdLigne, IdUsine, Nom, NombreEtapes)` (`IdUsine` $\to$ `Usine.IdUsine`)
          * `Timesheet(IdEmploye, IdLigne, NombreHeures)` (`IdEmploye` $\to$ `Employe`, `IdLigne` $\to$ `LigneProduction`)
          * `Piece(IdPiece, Nom, Couleur, Matiere)`
          * `Production(NumSerie, IdPiece, IdLigne, Date)` (`IdPiece` $\to$ `Piece`, `IdLigne` $\to$ `LigneProduction`)

      - id: ref-q4-queries
        block_type: reflection_rubric
        title: "Q4(a–d) (20 pts) — Exprimer les 4 requêtes en algèbre relationnelle"
        answer_mode: text
        prompt: |
          Exprimer les requêtes suivantes à l'aide de l'algèbre relationnelle :

          * **(a) (3 pts)** Lister `IdEmploye` et `Prenom` des employés qui s'appellent `'Lantier'` et qui habitent dans la même ville que l'usine où ils travaillent.
          * **(b) (6 pts)** Lister `IdLigne` et `Nom` des lignes de production qui produisent des pièces **en bois et en métal** (`Matiere` des pièces).
          * **(c) (5 pts)** Lister `IdLigne` des lignes de production qui **n'ont aucune pièce de couleur `'Orange'`** dans leur production.
          * **(d) (6 pts)** Lister `IdEmploye` et `Nom` des employés qui ont travaillé sur **toutes les lignes de production de l'usine `'LEGO-1'`**.
        self_check_criteria:
          - "(a) Jointure `Employe ⋈ Usine` (sur `IdUsine`) + sélection `Nom = 'Lantier' ∧ Ville = VilleUsine` + projection."
          - "(b) Intersection `∩` de deux projections sur `IdLigne` (avant de joindre avec `LigneProduction` pour éviter la collision d'attribut `Nom` avec `Piece.Nom`)."
          - "(c) Différence partant de `π_{IdLigne}(LigneProduction)` (et NON de `Production`) moins les lignes ayant produit du `'Orange'`."
          - "(d) Division `π_{IdEmploye, IdLigne}(Timesheet) ÷ π_{IdLigne}(σ_{IdUsine='LEGO-1'}(LigneProduction))`, puis jointure avec `Employe` pour `Nom`."
        model_answer: |
          * **(a)** (3 pts)
          $$\pi_{\text{IdEmploye}, \text{Prenom}}\Big(\sigma_{\text{Nom} = \text{'Lantier'} \land \text{Ville} = \text{VilleUsine}}(\text{Employe} \otimes \text{Usine})\Big)$$

          * **(b)** (6 pts) — *Projeter sur `IdLigne` avant d'intersecter pour éviter la collision sur `Nom` (`Piece.Nom` vs `LigneProduction.Nom`) !*
          $$\text{Bois} \leftarrow \pi_{\text{IdLigne}}\Big(\text{Production} \otimes \sigma_{\text{Matiere} = \text{'bois'}}(\text{Piece})\Big)$$
          $$\text{Metal} \leftarrow \pi_{\text{IdLigne}}\Big(\text{Production} \otimes \sigma_{\text{Matiere} = \text{'métal'}}(\text{Piece})\Big)$$
          $$\pi_{\text{IdLigne}, \text{Nom}}\Big((\text{Bois} \cap \text{Metal}) \otimes \text{LigneProduction}\Big)$$

          * **(c)** (5 pts) — *Partir de `LigneProduction` pour inclure les lignes sans aucune production !*
          $$\pi_{\text{IdLigne}}(\text{LigneProduction}) - \pi_{\text{IdLigne}}\Big(\text{Production} \otimes \sigma_{\text{Couleur} = \text{'Orange'}}(\text{Piece})\Big)$$

          * **(d)** (6 pts) — *Division relationnelle*
          $$\text{Ids} \leftarrow \pi_{\text{IdEmploye}, \text{IdLigne}}(\text{Timesheet}) \div \pi_{\text{IdLigne}}\Big(\sigma_{\text{IdUsine} = \text{'LEGO-1'}}(\text{LigneProduction})\Big)$$
          $$\pi_{\text{IdEmploye}, \text{Nom}}(\text{Ids} \otimes \text{Employe})$$
