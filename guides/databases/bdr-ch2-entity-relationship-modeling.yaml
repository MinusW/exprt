      - id: th-eer-inheritance
        block_type: markdown
        title: "Extended ER (EER): Specialization, Type Entities & Lattices"
        content: |
          The **Extended ER (EAE)** model adds **superclass / subclass (`Is-A`)** hierarchies with **attribute and association inheritance**:
          * **Specialization** (top-down): Partitioning a superclass (`Employé`) into subclasses (`Secrétaire`, `Technicien`, `Ingénieur`) by a defining characteristic.
          * **Generalization** (bottom-up): Factoring common attributes of `Crédit`, `Cash`, `CarteCadeau` into a superclass `Paiement(Montant, Devise)`. (Usually **total**.)

          Two orthogonal constraints govern every specialization/generalization:
          1. **Disjointness:** **Disjoint** (an entity belongs to *at most one* subclass) vs. **Overlapping (*Chevauchante*)** (can belong to *multiple* subclasses).
          2. **Completeness:** **Total** (every superclass entity must belong to at least one subclass) vs. **Partial** (some superclass entities belong to none).

          This yields 4 combinations: `{Disjoint, Total}`, `{Disjoint, Partial}`, `{Overlapping, Total}`, `{Overlapping, Partial}`.

          **Three Essential EER Design Patterns:**
          * **Type-Level Entity vs. Subclass:** A subclass is only justified when subtypes have distinct *instance* attributes or distinct *associations*. If every instance of a category shares the exact same type-level value (e.g., `tarif` for `Simple`/`Double`/`Suite` rooms across all hotels, or commission rates per `TypeAnimal`), model a separate **Type entity** (`TypeChambre(nom, tarif)`) linked to `Chambre` instead of empty subclasses with duplicated values.
          * **Orthogonal Hierarchies (Selective Overlap):** If `Médecin` and `Infirmier` are mutually exclusive, yet either can also be a `Patient`, do **not** turn `{Médecin, Infirmier, Patient}` into `{Overlapping}`—that would allow someone to be both `Médecin` and `Infirmier`. Instead, use **two separate specializations** from `Personne` (e.g., `{Disjoint, Partial}` for `{Médecin, Infirmier}` and an independent `Patient` subclass, or `{Employé, Patient}` `{Overlapping, Total}` with `Employé` `{Disjoint, Total}` $\to$ `{Médecin, Infirmier}`).
          * **Shared Subclasses (Multiple Inheritance / Lattice):** When the *intersection* of two overlapping subclasses carries its own attributes or associations (e.g., a `Vétérinaire` who is also a `Propriétaire` receives a personalized `rabais`), introduce a **shared subclass** (`VétérinairePropriétaire`) inheriting from both superclasses, forming a **lattice (*treillis*)**.

