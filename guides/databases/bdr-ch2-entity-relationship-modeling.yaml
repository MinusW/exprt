      - id: fc-er-pros-cons
        block_type: flashcard
        title: "ER Modeling Decision: Entity vs. Attribute vs. Weak Entity"
        front: "How do you decide whether a concept should be a **simple/composite attribute**, a **Type entity**, a **strong entity**, or a **weak entity**?"
        back: |
          * **Attribute:** Depends on a single owner instance and has no own associations or shared type-level metadata (e.g., `Adresse`, `Téléphone [1..*]`).
          * **Type Entity:** Holds shared metadata common to a whole category rather than individual instances (e.g., `TypeChambre(nom, tarif)`).
          * **Strong Entity:** Has its own standalone primary key and independent existence.
          * **Weak Entity:** Cannot be uniquely identified without combining its **partial key** with its owner's PK (e.g., `Chambre` inside `Hôtel`), or is a **reified association** needed so a third entity can link to it.
        hint: "Ask: Does it have its own global key? Does it carry type-level data? Must another entity link to it?"
        tags: ["bdr", "er-model", "design-decisions"]

      - id: ref-eer-design-rubric
        block_type: reflection_rubric
        title: "Apply: Designing a Ternary Reification & EER Constraint"
        answer_mode: text
        prompt: |
          1. In the `Projection(Salle, Séance, Film)` example, `Salle` and `Séance` have `*` multiplicity toward `Projection`, while `Film` has `1` (meaning a given room + timeslot screens at most one film). What is the key of the weak entity `Projection`?
          2. In `COMPANY`, an employee can be categorized by job role (`{Secrétaire, Technicien, Ingénieur}`) and by pay type (`{Salarié, Payé_par_heure}`), while some employees are `Directeur`. Which specialization is `{Disjointe, Totale}` and which is `{Disjointe, Partielle}`?
        self_check_criteria:
          - "Identified `(Salle.Nom, Séance.Date, Séance.HeureDébut)` as the key of `Projection` (the `*`-side owners), excluding `Film`."
          - "Classified `{Salarié, Payé_par_heure}` as `{Disjointe, Totale}` (every employee is paid one way or the other)."
          - "Classified `{Secrétaire, Technicien, Ingénieur}` as `{Disjointe, Partielle}` (e.g., a Directeur might not be any of these three)."
        model_answer: |
          1. **Key of `Projection`:** `(Salle.Nom, Séance.Date, Séance.HeureDébut)`. Because a room (`Salle`) at a specific timeslot (`Séance`) uniquely determines the `Film` being screened, `Film` is on the `1` side and is a non-key attribute/reference rather than part of the identifier.
          2. **EER constraints:**
             * `{Salarié, Payé_par_heure}` is **`{Disjointe, Totale}`**: every employee has exactly one payment method.
             * `{Secrétaire, Technicien, Ingénieur}` is **`{Disjointe, Partielle}`**: an employee has at most one of those job titles, but some employees (such as `Directeur`) belong to none of them.

  - id: sec-ch2-quiz
    title: "4. Knowledge Retrieval & Check"
    blocks:
      - id: qz-ch2-derived-attr
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 2
        related_block_id: th-attribute-taxonomy
        title: "Derived vs. Stored Attributes in ER"
        question: "Which statement regarding **derived attributes** (e.g., `Age` from `DateNaissance`, or `NombreEmployés` of a `Département`) is **correct**?"
        options:
          - "Only stored attributes are included in the ER schema; derived attributes are computed on demand."
          - "Derived attributes must always be stored in the ER schema with a `[0..1]` marker."
          - "An attribute can only be derived from attributes of the same entity, never from associated entities."
          - "Derived attributes are represented identically to multivalued attributes (`[1..*]`)."
        correct_answer: "Only stored attributes are included in the ER schema; derived attributes are computed on demand."
        explanation: |
          In this course's ER methodology, **only stored attributes** are placed in the schema (`DateNaissance` is stored; `Age` is computed from `DateNaissance` and the current date).
          * Attributes *can* be derived across associations (e.g., `NombreEmployés` counts associated `Employé` entities).
          * `[0..1]` denotes optionality (`NULL` allowed), and `[1..*]` denotes a multivalued attribute.
        hints:
          - "Think about redundancy: if `DateNaissance` is stored, why avoid storing `Age`?"
          - "Recall the rule from the slides: 'Le schéma contiendra seulement les attributs stockés'."

      - id: qz-ch2-redundant-assoc
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 4
        related_block_id: th-nary-and-redundant
        title: "Detecting Truly Redundant Associations"
        question: "Suppose `Employé` `Travaille` (`*` — `1..*`) in `Département`, and `Département` `A_lieu` (`*` — `1..*`) in `Local`. Can we eliminate a direct `Lieu_Travail` association between `Employé` and `Local`?"
        options:
          - "No—the path through Département only gives all potential locations of the department, not the specific location(s) where that employee actually works."
          - "Yes—any triangle of associations in an ER diagram is automatically redundant and must be removed."
          - "Yes—because every Employé belongs to at least one Département, and every Département has at least one Local."
          - "No—associations between entities can never be derived from other associations."
        correct_answer: "No—the path through Département only gives all potential locations of the department, not the specific location(s) where that employee actually works."
        explanation: |
          When a `Département` has **multiple** `Local`s (`1..*`) and an `Employé` works in **multiple** `Département`s (`1..*`), the join path `Employé -> Département -> Local` only tells us *all possible* locations associated with those departments—not which specific `Local` the employee actually works at!
          * By contrast, if `Employé` worked for `1..1` `Company` and `Company` was in `1..1` `Ville`, then `Employé -> Ville` *would* be uniquely determined and redundant.
        hints:
          - "Check the `1..*` cardinalities: if a department is spread across 3 buildings, do you know which building Bob sits in?"
          - "Contrast a `1..1` chain (deterministic) with a `1..*` chain (ambiguous)."

      - id: qz-ch2-weak-entity
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: th-weak-entities
        title: "Identifying a Weak Entity"
        question: "How is an instance of a **weak entity** (such as `Dépendant` with partial key `Prénom_dép`, owned by `Employé` with primary key `NoSS`) uniquely identified?"
        options:
          - "By combining its partial key (`Prénom_dép`) with the primary key of its owner entity (`NoSS`)."
          - "By its partial key (`Prénom_dép`) alone, since `Prénom_dép` is unique across the entire company."
          - "By generating a mandatory surrogate key inside the weak entity so it no longer depends on `Employé`."
          - "By storing all attributes of `Dépendant` as a composite attribute inside `Employé`."
        correct_answer: "By combining its partial key (`Prénom_dép`) with the primary key of its owner entity (`NoSS`)."
        explanation: |
          A weak entity has no standalone primary key; two different employees can both have a dependent named `"Alice"`. Its identifier is the **combination** of the owner's primary key (`NoSS`) and the weak entity's **partial key / discriminator** (`Prénom_dép`).
        hints:
          - "Could two different employees have children with the same first name?"
          - "What does 'identifying association' mean for a weak entity?"

      - id: qz-ch2-eer-constraints
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: th-eer-inheritance
        title: "EER Overlapping vs. Total Constraints"
        question: "In an EER schema, a superclass `Personne` is specialized into `{Étudiant, Employé}` where some people are both students and employees, and every `Personne` in the database must be at least one of the two. Which constraint pair applies?"
        options:
          - "{Chevauchante (Overlapping), Totale}"
          - "{Disjointe, Totale}"
          - "{Chevauchante (Overlapping), Partielle}"
          - "{Disjointe, Partielle}"
        correct_answer: "{Chevauchante (Overlapping), Totale}"
        explanation: |
          * Because a `Personne` can be **both** an `Étudiant` and an `Employé` simultaneously, the subclasses are **overlapping (*chevauchante*)**, not disjoint.
          * Because **every** `Personne` must belong to at least one subclass, the specialization is **total**, not partial.
        hints:
          - "Evaluate the two axes independently: (1) Can one entity be in >1 subclass? (2) Can an entity be in 0 subclasses?"
          - "'At least one' = Total; 'can be both' = Overlapping."
