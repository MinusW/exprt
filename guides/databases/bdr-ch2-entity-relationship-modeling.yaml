  - id: sec-associations-cardinalities
    title: "2. Associations, Roles & Cardinalities"
    blocks:
      - id: th-associations-roles
        block_type: markdown
        title: "Associations, Association Classes, Degree & Roles"
        content: |
          An **association** links two or more entities with a specific meaning (e.g., `Travaille_pour`, `Dirige`, `Travaille_sur`).
          * **Degree:** Number of participating entity types (**binary** = 2, **ternary** = 3, **n-ary** = $n$).
          * **Association Classes (*Classes d'association*):** When an attribute belongs to the *link itself* rather than either entity—such as `Heures` on `Travaille_sur(Employé, Projet)` or `(dateArrivée, dateDépart, nbPersonnes)` on `Occupation(Chambre, Réservation)`—UML-ER attaches an **association class** via a dashed line.
            * **Structural Rule:** An association class is *still a relationship*, not an independent entity with its own identity—therefore **another entity cannot associate directly with an association class**. If a third entity must reference a specific link (e.g., `ServiceDeChambre` linked to a specific room `Occupation`), **reify** the association into a **weak entity** owned by both participating entities (`Chambre` and `Réservation`).
          * **Roles:** Clarify the function of each participating entity (e.g., `employeur` vs. `employé`). Roles are **mandatory** in **recursive associations** (where the same entity type participates twice, e.g., `Supervise` between `Employé` as `superviseur` and `Employé` as `supervisé`).

      - id: th-minmax-vs-uml
        block_type: markdown
        title: "Min..Max Cardinalities, Reading Rule & Temporal History"
        content: |
          In this course's UML-style ER notation, `min..max` obeys the **cross-reading rule**: read from entity $A$ *across* the association to the multiplicity written next to entity $B$ to know how many instances of $B$ can be associated with **one** instance of $A$ (default if unconstrained: `0..*`, with $\min \le \max$, $\min \ge 0$, $\max \ge 1$).

          | UML Shorthand | Meaning | Example in `COMPANY` |
          | :--- | :--- | :--- |
          | `1` | `1..1` (exactly one) | Each `Employé` works for `1..1` `Département` |
          | `0..1` | zero or one | Each `Employé` manages `0..1` `Département` |
          | `0..*` or `*` | zero or more | Each `Employé` supervises `*` other `Employé`s |
          | `1..*` | one or more | Each `Département` is on `1..*` `Site`s |
          | `4..*` | at least 4 | Each `Département` has `4..*` `Employé`s |

          The **cardinality ratio** looks at the **maximum** values of a binary association: **1:1** (`Dirige`), **1:N / N:1** (`Travaille_pour`), or **M:N** (`Travaille_sur`).

          **Modeling Temporal History (Why "One at a Time" Becomes `*`):**
          ER cardinalities govern **all instances stored in the database across time**, not merely the active snapshot at the current instant. Whenever a specification states *"at most one at a time, and we keep history"* (e.g., an event has one organizer at a time with organizer history, or a room hosts one reservation at a time over different dates):
          1. Widen the association from `0..1`/`1..1` to **`*` (`M:N`)** (or model a weak history entity with a date/timestamp partial key),
          2. Attach an association class with **`(dateDébut, dateFin)`**, and
          3. Add a **semantic integrity constraint (CI)** stating that active intervals for the same entity cannot overlap.

