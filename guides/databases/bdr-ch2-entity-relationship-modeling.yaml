id: bdr-ch2-entity-relationship-modeling
title: "Entity-Relationship (ER & EER) Modeling"
description: "Conceptual database modeling with entities, attributes (simple, composite, multivalued, derived), keys, binary and n-ary relationships, min..max cardinalities, weak entities, recursive associations, and Extended ER (EER) specialization/generalization."
category: "Database Systems"
track: "Relational Database Fundamentals (BDR)"
track_order: 2
estimated_minutes: 40
tags: ["databases", "bdr", "er-model", "eer", "conceptual-modeling", "uml"]
prerequisites: ["bdr-ch1-dbms-concepts"]
sources:
  - title: "BDR Chapter 2 (Part 1) — Modèle Entité-Association"
    url_or_path: "sources/BDR-TE1/BDR-02-ModeleEA-partie1.pdf"
    notes: "Entities, attributes, keys, binary associations, roles, and min..max / UML cardinalities"
  - title: "BDR Chapter 2 (Part 2) — Modèle EA avancé & EAE"
    url_or_path: "sources/BDR-TE1/BDR-02-ModeleEA-partie2.pdf"
    notes: "Weak entities, recursive associations, n-ary associations, redundant associations, semantic constraints, and EER inheritance"

sections:
  - id: sec-er-foundations
    title: "1. Conceptual Design, Entities & Attributes"
    blocks:
      - id: th-conceptual-vs-logical
        block_type: markdown
        title: "Where ER Modeling Sits in Database Design"
        content: |
          Database design proceeds in three phases after requirements gathering:
          1. **Conceptual Modeling (ER / EA):** Formalizes the *mini-world* **independently of any DBMS or implementation choices**. It produces a **Conceptual Data Model (MCD)**.
          2. **Logical Modeling:** Translates the conceptual schema into a DBMS-specific logical model (e.g., Relational Model / **MLD**).
          3. **Physical Modeling:** Tunes indexes, storage, and access paths (**Internal Schema**).

          > [!IMPORTANT]
          > **Conceptual Boundary Rules:**
          > * The ER model is a **conceptual** model (MCD), **not** a logical model (MLD)—never add foreign keys (`clientEmail`, `numChambre`) to an ER diagram; associations express links directly.
          > * **Never model the system itself as a singleton entity:** An organization or application being modeled (e.g., `Hôpital`, `Chaîne Ibis`, `HEIG-VD`) defines the *boundary* of the mini-world, not a set of distinguishable instances. Only create an entity type when multiple distinct instances exist (e.g., individual `Hôtel` branches or `Clinique`s).

      - id: th-attribute-taxonomy
        block_type: markdown
        title: "Entities & Attribute Classification"
        content: |
          An **entity** represents a real-world object (e.g., an employee or department). An **entity type** (*type d'entité*) defines the schema shared by an **entity set** (*ensemble d'entités*). Attributes describe properties along four axes:

          | Dimension | Type | Meaning & Course Notation |
          | :--- | :--- | :--- |
          | **Structure** | **Simple (Atomic)** vs. **Composite** | Composite attributes decompose into sub-parts, e.g., `Adresse(Numéro, Rue, Ville, Département, CodePostal)` |
          | **Multiplicity** | **Single-valued** vs. **Multivalued** | Multivalued attributes hold multiple values per entity, e.g., `Prénom [1..*]` or `DiplômesUniversitaires` |
          | **Persistence** | **Stored** vs. **Derived** | `Age` is derived from stored `DateNaissance` + current date; `NombreEmployés` is derived by counting. **Only stored attributes appear in the schema.** |
          | **Optionality** | **Mandatory** vs. **Optional (`NULL`)** | Unknown or inapplicable values use `NULL`, denoted `[0..1]`, e.g., `Adresse [0..1]`. |

      - id: th-keys-natural-surrogate
        block_type: markdown
        title: "Candidate Keys, Primary Keys & Natural vs. Surrogate Keys"
        content: |
          A **key (identifier)** of an entity type $E$ is a **minimal subset** of attributes that uniquely identifies every instance of $E$.
          * **Candidate keys:** All minimal identifying attribute sets.
          * **Primary key:** The chosen candidate key. A good primary key is **unambiguous**, **immutable** (never needs changing), and **compact** (small storage size).
          * **Natural key:** Belongs naturally to the domain (e.g., `NoSS`). Advantage: already exists. Drawback: tied to business rules—if business rules change, the key may break.
          * **Surrogate (artificial) key:** Non-intelligent generated ID independent of business logic. Advantage: stable. Drawback: harder for humans to read/use directly.

      - id: th-er-visual-conventions
        block_type: markdown
        title: "Course ER / EER Visual Conventions (UML-Style Notation)"
        content: |
          Throughout this course, ER and EER schemas follow a **UML-style class diagram notation** (drawn with UMLet):

          | Concept | Visual Convention | Example |
          | :--- | :--- | :--- |
          | **Strong Entity** | Solid rectangle with entity name at top, separator `--`, and attributes below | `Employe`, `Departement` |
          | **Primary Key (PK)** | `_Underlined_` attribute name | `_NoSS_`, `_Numero_` |
          | **Partial Key (Discriminator)** | `[partielle]` marker (or UML qualifier box on the identifying link) | `Prenom_dep [partielle]` |
          | **Derived Attribute** | `/Italic/` (omitted from final stored schema) | `/Age/` |
          | **Multivalued Attribute** | `[1..*]` (or `[0..*]`) multiplicity suffix | `Prenom [1..*]` |
          | **Optional Attribute (`NULL`)** | `[0..1]` multiplicity suffix | `Email [0..1]` |
          | **Composite Attribute** | Parent attribute with indented sub-attributes underneath | `Adresse` $\to$ `Numero`, `Rue`, `Ville`, `CodePostal` |
          | **Binary Association & Cardinalities** | Solid line labeled with association name; **cross-reading `min..max`** placed near the opposite entity | `Employe` `4..*` — `1..1` `Departement` |
          | **Roles** | Role names placed near each end of the line (**mandatory** for recursive associations) | `superviseur` / `supervise` |
          | **Association Class** | Rectangle attached to the association line via a **dashed line** (`..`) | `Travaille_sur` $\cdots$ `Heures` |
          | **Weak Entity & Identifying Link** | Filled diamond composition (`<<<<<-`) / `1..1` identifying link from owner entity | `Employe` $\blacklozenge$— `Dependant` |
          | **N-ary Association ($n \ge 3$)** | Central **diamond** connected to all participating entities (or reified weak entity) | `Projection` diamond (`Salle`, `Seance`, `Film`) |
          | **EER Inheritance (`Is-A`)** | Hollow-triangle arrow (`<<-`) from subclass to superclass + `{Disjointe/Chevauchante, Totale/Partielle}` | `Employe` $\triangleleft$— `{Secretaire, Technicien, Ingenieur}` |

