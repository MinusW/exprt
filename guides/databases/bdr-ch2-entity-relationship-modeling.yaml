  - id: sec-advanced-er-eer
    title: "3. Weak Entities, N-ary Associations & Extended ER (EER)"
    blocks:
      - id: th-weak-entities
        block_type: markdown
        title: "Weak Entities & Identifying Associations"
        content: |
          A **weak entity** (*entité faible*, e.g., `Dépendant`) cannot exist or be uniquely identified without a **strong (owner / identifying) entity** (`Employé`).
          * It participates in an **identifying association** (`A_la_charge_de`) with `1..1` (or `1`) multiplicity on the owner side.
          * It is identified by combining its **partial key / discriminator** (`Prénom_dép`) with the owner's primary key (`NoSS`).
          * A weak entity can even have **multiple owners**—for example, when converting a ternary association into a weak entity!

      - id: th-nary-and-redundant
        block_type: markdown
        title: "N-ary Associations, Redundancy & Semantic Constraints (CI)"
        content: |
          A **ternary (or n-ary) association** (e.g., `Projection` linking `Film`, `Séance`, and `Salle`) is **not** equivalent to three separate binary associations—splitting it loses which specific film is shown in which room at which time:
          * Suppose `Salle 1` screens `Dune` at `20:00` and `Matrix` at `22:00`, while `Salle 2` screens `Matrix` at `20:00`. Three binary links (`(Salle 1, 20:00)`, `(Salle 1, Dune)`, `(20:00, Matrix)`) falsely imply `Salle 1` might be showing `Matrix` at `20:00`!
          * In UML, n-ary associations ($n \ge 2$) are drawn as a diamond, or equivalently **reified into a weak entity** (`Projection`) with binary `1..1` links to the participating entities (`Salle`, `Séance`, `Film`).
          * **Redundant (derived) associations:** If an association can be *unambiguously deduced* from a path of other associations, remove it. **Watch out:** only remove it if the path actually determines the exact link! Knowing which `Département` an `Employé` works in and which `Local`s a `Département` occupies (`1..*`) only gives *potential* locations, **not** the specific `Local` where the employee actually works (`Lieu_Travail`).

          **Semantic Integrity Constraints (CI):** Cardinalities only bound local link counts; they cannot express **cross-tuple** or **path-consistency** rules. Document these as explicit **CI comments** on the ER diagram (enforced later via triggers/assertions):
          1. **Temporal exclusivity:** No two `Occupation` or `Organize` intervals for the same `Chambre` or `Événement` may overlap.
          2. **Path / cycle consistency:** All `Infirmier`s assigned to a `Patient` must assist the *same* `Médecin`; a `Vétérinaire`'s supervisor must work in the *same* `Clinique`; a `Vétérinaire` only performs `Consultation`s in their own `Clinique`.
          3. **Aggregate business rules:** Total weekly hours of an `Employé` across all `Projet`s $\le 40$.

