id: bdr-ch4-er-to-relational-mapping
title: "ER-to-Relational Schema Mapping"
description: "The complete 8-step algorithm for translating ER and Extended ER (EER) diagrams into normalized relational schemas: strong/weak entities, 1:1/1:N/M:N/n-ary associations, multivalued attributes, and inheritance strategies (8A, 8B, 8C)."
category: "Database Systems"
track: "Relational Database Fundamentals (BDR)"
track_order: 4
estimated_minutes: 35
tags: ["databases", "bdr", "er-to-relational", "schema-mapping", "inheritance"]
prerequisites: ["bdr-ch3-relational-model-constraints"]
sources:
  - title: "BDR Chapter 4 — Passage d'un modèle EA à un modèle relationnel"
    url_or_path: "sources/BDR-TE1/04-Passage_EA_vers_relationnel_avec_correction.pdf"
    notes: "8-step ER-to-relational mapping algorithm and comparison of inheritance strategies 8A, 8B, 8C"

sections:
  - id: sec-steps-1-to-5
    title: "1. Entities & Binary Associations (Steps 1–5)"
    blocks:
      - id: th-steps-1-2-entities
        block_type: markdown
        title: "Handwritten Exam Syntax & Steps 1–2 (Strong and Weak Entities)"
        content: |
          ### Handwritten Relational Notation (What You Write on the Exam)

          On paper, each relation is written with its **primary key attributes underlined**, followed underneath by every **foreign key (`référence`)**, **`NOT NULL`**, and **`UNIQUE`** constraint needed on non-PK attributes:

          > **Relation**(<u>pk1</u>, <u>pk2</u>, attr1, fk1, fk2)
          > fk1 référence AutreRelation.pk
          > fk1 NOT NULL
          > fk1 UNIQUE
          > (fk_a, fk_b) référence EntitéFaible(pk_a, pk_b)

          > [!NOTE]
          > Primary key attributes are **implicitly `NOT NULL` and unique as a tuple**, so you do not need to repeat `NOT NULL` on PK columns. Always write `NOT NULL` on mandatory non-PK foreign keys, and `UNIQUE` on 1:1 foreign keys (or alternate candidate keys).

          ---

          ### Step 1 — Strong (Normal) Entity Types

          For each strong entity $E$:
          * Create a relation $R$ with all **simple** attributes of $E$.
          * Flatten **composite** attributes into their simple sub-components (`Adresse` $\to$ Numéro, Rue, Ville, CodePostal).
          * Omit **derived** attributes (`Age`); defer **multivalued** attributes (`Lieu [1..*]`) to Step 6.
          * Underline one candidate key as the **primary key** (mark any other candidate key `UNIQUE NOT NULL`).

          **Example (`Employé` with composite `Adresse` and alternate key `Email`):**

          > **Employé**(<u>NoSS</u>, Prénom, Nom, Email, DateNaissance, Numéro, Rue, Ville, CodePostal, Salaire)
          > Email UNIQUE
          > Email NOT NULL

          ---

          ### Step 2 — Weak Entity Types

          For each weak entity $F$ owned by strong entity/entities $E_i$:
          * Create relation $R$ with all simple attributes of $F$ **plus its partial key (discriminator)** from the qualifier box.
          * Import the **primary key** of each owner $E_i$ as a foreign key in $R$.
          * Underline **`(owner PK(s), partial key)`** together as the composite primary key.

          **Example (`Dépendant` weak of `Employé` with discriminator `Prénom_dep`):**

          > **Dépendant**(<u>NoSS</u>, <u>Prénom_dep</u>, LienFamilial, Sex, DateNaissance)
          > NoSS référence Employé.NoSS

          **Downstream Associations on Weak Entities:** Because a weak entity's identity *is* its composite PK, any downstream `1:N` or `M:N` association involving that weak entity must import the **entire composite key** as a **composite foreign key** (never just the partial key alone).

          **Example (`B` weak of `A` with discriminator `i`, participating in `M:N` `BC` with `C`):**

          > **A**(<u>a1</u>)
          >
          > **B**(<u>a1</u>, <u>i</u>, b1)
          > a1 référence A.a1
          >
          > **C**(<u>c1</u>)
          >
          > **BC**(<u>a1</u>, <u>i</u>, <u>c1</u>, s1)
          > (a1, i) référence B(a1, i)
          > c1 référence C.c1

      - id: th-steps-3-4-5-binary
        block_type: markdown
        title: "Steps 3, 4 & 5: Binary Associations (1:1, 1:N, M:N) & Recursive Renaming"
        content: |
          ### Step 3 — Binary 1:1 Associations

          | Participation | Where to Place the FK | Constraints on FK |
          | :--- | :--- | :--- |
          | **Mandatory $\leftrightarrow$ Mandatory** (`1..1` — `1..1`) | Either side $R_1$ (plus association attributes) | `UNIQUE`, `NOT NULL` |
          | **Optional $\leftrightarrow$ Mandatory** (`0..1` — `1..1`) | On the **mandatory-participation (`1..1` target) side**, referencing the optional side | `UNIQUE`, `NOT NULL` (avoids `NULL`s) |
          | **Optional $\leftrightarrow$ Optional** (`0..1` — `0..1`) | Either side (nullable `UNIQUE`), **or** a separate link table to avoid `NULL`s | `UNIQUE` (nullable if merged) |

          **Example 3b (`0..1` — `1..1`, `Employé` `1..1` — `Dirige(DateDébut)` — `0..1` `Département`):**
          Every `Département` has *exactly 1* manager (`1..1` next to `Employé`), while an `Employé` manages *at most 1* `Département` (`0..1` next to `Département`). Place `DirecteurSS` and `DateDébut` inside `Département`:

          > **Département**(<u>Numéro</u>, Nom, DirecteurSS, DateDébut)
          > DirecteurSS référence Employé.NoSS
          > DirecteurSS NOT NULL
          > DirecteurSS UNIQUE

          **Example 3c (`0..1` — `0..1`, `Employé` — `Utilise(DateAttribution)` — `Voiture`):**
          Merged on `Voiture` (nullable FK):

          > **Voiture**(<u>Immat</u>, Modèle, NoSS, DateAttribution)
          > NoSS référence Employé.NoSS
          > NoSS UNIQUE

          ---

          ### Step 4 — Binary 1:N / N:1 Associations

          * Place the PK of the **`1`-side** relation as a **foreign key in the `N`-side (`*`) relation**, along with any association attributes.
          * If participation on the `N`-side is mandatory (`1..1` on the opposite end), write **`NOT NULL`**. Never write `UNIQUE` (that would turn 1:N into 1:1).

          **Example (`Employé` `4..*` — `Travaille_pour` — `1..1` `Département`):**

          > **Employé**(<u>NoSS</u>, Prénom, Nom, Salaire, NumDép)
          > NumDép référence Département.Numéro
          > NumDép NOT NULL

          ---

          ### Step 5 — Binary M:N Associations

          * Always create a **new associative relation** containing the PKs of both participating entities as foreign keys + any association attributes.
          * Underline **both PKs together** as the composite primary key.

          **Example (`Employé` `*` — `Travaille_sur(Heures)` — `*` `Projet`):**

          > **Travaille_sur**(<u>NoSS</u>, <u>NumProj</u>, Heures)
          > NoSS référence Employé.NoSS
          > NumProj référence Projet.NumProj

          ---

          ### Recursive Associations & FK Name Collisions

          A relation cannot have two columns with the same name. Whenever an association is **recursive** or links **sibling subclasses** that inherit the same superclass PK name, **rename** the imported FK column(s):

          * **Recursive `1:N` (`0..1` — `*`, `Supervise` on `Employé`):** `0..1` on the supervisor side $\to$ nullable FK (top-level managers have `NULL`):

            > **Employé**(<u>NoSS</u>, Prénom, Nom, SuperviseurSS)
            > SuperviseurSS référence Employé.NoSS

          * **Recursive `1:N` (`0..1` — `*`) on a weak entity `A(e1, i)`:** Rename *both* columns of the composite self-FK (and add `NOT NULL` if `1..1` instead of `0..1`):

            > **A**(<u>e1</u>, <u>i</u>, a1, e12, i2)
            > e1 référence E.e1
            > (e12, i2) référence A(e1, i)

          * **Recursive `M:N` (`Prérequis` on `Cours`):**

            > **Prérequis**(<u>CodeCours</u>, <u>CodePrérequis</u>)
            > CodeCours référence Cours.CodeCours
            > CodePrérequis référence Cours.CodeCours

          * **Sibling subclasses `F` and `G` both inheriting PK `c1` from `C`, linked `F * — 1..1 G` with attributes `r1, r2`:**

            > **F**(<u>c1</u>, f1, f2, c1g, r1, r2)
            > c1 référence C.c1
            > c1g référence G.c1
            > c1g NOT NULL

  - id: sec-steps-6-to-8
    title: "2. Multivalued, N-ary & Inheritance Mapping (Steps 6–8)"
    blocks:
      - id: th-steps-6-7
        block_type: markdown
        title: "Steps 6 & 7: Multivalued Attributes, N-ary Associations & Full Trace"
        content: |
          ### Step 6 — Multivalued Attributes

          For each multivalued attribute $A$ of entity $E$ (e.g., `Lieu [1..*]` of `Département`), create a **separate relation** containing the entity's PK + the attribute value, with **both underlined** as the composite primary key:

          > **Dép_Lieu**(<u>NumDép</u>, <u>Lieu</u>)
          > NumDép référence Département.Numéro

          ---

          ### Step 7 — N-ary Associations ($n > 2$)

          Reify the n-ary association into a relation $R_{\text{assoc}}$:
          * **Key rule:** Underline the PKs of all entities on the **`*` side** (owner entities). Any entity on a **`1` side** is **not** underlined—it becomes a regular `NOT NULL` foreign key.

          **Example (`Projection` with `Salle *`, `Séance *`, `Film 1`):**

          > **Salle**(<u>Nom</u>, Capacité)
          >
          > **Séance**(<u>Date</u>, <u>HeureDébut</u>)
          >
          > **Film**(<u>Titre</u>, Durée)
          >
          > **Projection**(<u>NomSalle</u>, <u>DateSéance</u>, <u>HeureSéance</u>, TitreFilm)
          > NomSalle référence Salle.Nom
          > (DateSéance, HeureSéance) référence Séance(Date, HeureDébut)
          > TitreFilm référence Film.Titre
          > TitreFilm NOT NULL

          ---

          ### Complete Worked Schema (Steps 1–6 on `COMPANY`)

          Putting all steps together in exact handwritten exam format:

          > **Employé**(<u>NoSS</u>, Prénom, Nom, Salaire, NumDép, SuperviseurSS)
          > NumDép référence Département.Numéro
          > NumDép NOT NULL
          > SuperviseurSS référence Employé.NoSS
          >
          > **Département**(<u>Numéro</u>, Nom, DirecteurSS, DateDébut)
          > DirecteurSS référence Employé.NoSS
          > DirecteurSS NOT NULL
          > DirecteurSS UNIQUE
          >
          > **Dép_Lieu**(<u>NumDép</u>, <u>Lieu</u>)
          > NumDép référence Département.Numéro
          >
          > **Projet**(<u>NumProj</u>, Nom, NumDép)
          > NumDép référence Département.Numéro
          > NumDép NOT NULL
          >
          > **Travaille_sur**(<u>NoSS</u>, <u>NumProj</u>, Heures)
          > NoSS référence Employé.NoSS
          > NumProj référence Projet.NumProj
          >
          > **Dépendant**(<u>NoSS</u>, <u>Prénom_dep</u>, LienFamilial, DateNaissance)
          > NoSS référence Employé.NoSS

      - id: diag-inheritance-strategies
        block_type: kroki
        diagram_type: mermaid
        title: "Step 8: Choosing an Inheritance Mapping Strategy (8A vs. 8B vs. 8C)"
        caption: "Summary of the three relational strategies for mapping superclass/subclass hierarchies."
        source: |
          flowchart TD
            Root["EER Inheritance Hierarchy (E1 -> E2, E3)"] --> Q1{"Is specialization PARTIAL or OVERLAPPING?"}
            Q1 -->|"Yes"| S8A["8A: One table per class (Superclass + each Subclass)"]
            Q1 -->|"No (Disjoint & Total)"| Q2{"Few nulls & single table preferred?"}
            Q2 -->|"Yes"| S8C["8C: Single table with type discriminator + CHECKs"]
            Q2 -->|"No (Separate subclass tables)"| S8B["8B: Tables for subclasses only (push down E1 attrs)"]

            classDef strat fill:#ede9fe,stroke:#4f46e5,stroke-width:1.5px;
            class S8A,S8B,S8C strat;

      - id: th-step-8-comparison
        block_type: markdown
        title: "Step 8: Comparing Strategies 8A, 8B, and 8C"
        content: |
          | Criterion | 8A: Table per Class | 8B: Subclass Tables Only | 8C: Single Table |
          | :--- | :--- | :--- | :--- |
          | **Partial specialization** | Supported | **Not applicable** (loses non-subclass entities!) | Supported (`type` can be `NULL`) |
          | **Overlapping specialization** | Supported | **Avoid** (duplicates inherited attributes!) | Supported (use boolean flags `estE2`, `estE3`) |
          | **NULL values** | Few | Few | **Many** (unused subclass columns are `NULL`) |
          | **Read full subclass** | Requires `JOIN` with superclass | Direct (1 table) | Direct (1 table) |
          | **Read all instances** | Direct (query superclass) | Requires `UNION` | Direct (1 table) |
          | **Other pitfalls** | Disjoint/total constraints need extra checks | Cannot FK to superclass; PK uniqueness across $R_2, R_3$ not enforced by schema | Requires `CHECK (type <> 'E2' OR (c1 IS NULL AND c2 IS NULL))` |

          > [!NOTE]
          > **In practice, Strategy 8A** is the most general and widely applicable default because it works cleanly for **all** four combinations (partial/total, disjoint/overlapping) without duplicating inherited attributes.

          ### Concrete Handwritten Schemas (`Employé` $\to$ `Secrétaire`, `Technicien`)

          **Strategy 8A — Table per class (3 relations, works for all 4 EER combinations):**

          > **Employé**(<u>NoSS</u>, Nom)
          >
          > **Secrétaire**(<u>NoSS</u>, VitesseFrappe)
          > NoSS référence Employé.NoSS
          >
          > **Technicien**(<u>NoSS</u>, Grade)
          > NoSS référence Employé.NoSS

          **Strategy 8B — Subclass tables only (2 relations, valid only for `{Disjoint, Total}`):**

          > **Secrétaire**(<u>NoSS</u>, Nom, VitesseFrappe)
          >
          > **Technicien**(<u>NoSS</u>, Nom, Grade)

          **Strategy 8C — Single table (1 relation):**

          > **Employé**(<u>NoSS</u>, Nom, TypeEmp, VitesseFrappe, Grade)
          > *(If overlapping, replace `TypeEmp` with boolean flags `estSecrétaire`, `estTechnicien`.)*

      - id: ref-ch4-mapping-rubric
        block_type: reflection_rubric
        title: "Apply: Mapping Weak Entities, Recursive Links & EER"
        answer_mode: text
        prompt: |
          Map the following ER/EER fragment to handwritten relational schemas (underline PKs, list `référence`, `UNIQUE`, and `NOT NULL`):
          * `Clinique(idC, nom)` — `1..1` — `Emploie` — `1..*` — `Vétérinaire` (weak entity with partial key `numInt`, attribute `nomV`).
          * `Vétérinaire` has a recursive `Supervise` association (`0..1` supervisor — `*` subordinate).
          * `Personne(idP, nom)` has `{Disjoint, Partial}` subclasses `Médecin(spécialité)` and `Infirmier(service)`.
        self_check_criteria:
          - "Mapped Vétérinaire(idC, numInt, nomV, idC_sup, numInt_sup) with composite PK (idC, numInt) and renamed nullable composite FK (idC_sup, numInt_sup) referencing Vétérinaire(idC, numInt)."
          - "Chose Strategy 8A or 8C (and rejected 8B because the specialization is partial)."
        model_answer: |
          > **Clinique**(<u>idC</u>, nom)
          >
          > **Vétérinaire**(<u>idC</u>, <u>numInt</u>, nomV, idC_sup, numInt_sup)
          > idC référence Clinique.idC
          > (idC_sup, numInt_sup) référence Vétérinaire(idC, numInt)
          > *(nullable because supervisor is `0..1`; renamed to avoid colliding with `(idC, numInt)`)*

          **EER (`Personne` — Strategy 8A, since `{Disjoint, Partial}` cannot use 8B):**

          > **Personne**(<u>idP</u>, nom)
          >
          > **Médecin**(<u>idP</u>, spécialité)
          > idP référence Personne.idP
          >
          > **Infirmier**(<u>idP</u>, service)
          > idP référence Personne.idP

      - id: fc-mapping-cheatsheet
        block_type: flashcard
        title: "ER-to-Relational Quick Mapping Table"
        front: "How do **1:N**, **M:N**, **Weak Entity**, and **Multivalued Attribute** map to relational tables?"
        back: |
          * **1:N:** FK on the `N` (`*`) side referencing the `1` side (`NOT NULL` if mandatory).
          * **M:N:** New associative table with `(PK_1, PK_2)` as composite PK + FKs.
          * **Weak Entity:** Table with `(owner_PK, partial_key)` as composite PK + FK (`ON DELETE CASCADE`).
          * **Multivalued Attribute:** Separate table `(entity_PK, attribute_value)` as composite PK + FK.
        hint: "Only 1:1 and 1:N avoid creating a new table."
        tags: ["bdr", "mapping", "cheatsheet"]

  - id: sec-ch4-quiz
    title: "3. Knowledge Retrieval & Check"
    blocks:
      - id: qz-ch4-1to1-dirige
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: th-steps-3-4-5-binary
        title: "Mapping a 1:1 Association (0..1 vs 1..1)"
        question: "In `Employé` (`1..1`) — `Dirige(DateDébut)` — (`0..1`) `Département` (each department has 1 manager; an employee manages at most 1 department), what is the best relational mapping and what constraints apply to the FK?"
        options:
          - "Add `DirecteurSS, DateDébut` to `Département`, with `DirecteurSS` referencing `Employé.NoSS`, both `UNIQUE` and `NOT NULL`."
          - "Add `DptDirigé, DateDébut` to `Employé`, with `DptDirigé` referencing `Département.Numéro`, `NOT NULL`."
          - "Add `DateDébut` to `Employé` without any foreign key."
          - "Add `DirecteurSS, DateDébut` to `Département` without `UNIQUE`, so multiple departments can share a manager."
        correct_answer: "Add `DirecteurSS, DateDébut` to `Département`, with `DirecteurSS` referencing `Employé.NoSS`, both `UNIQUE` and `NOT NULL`."
        explanation: |
          Because every `Département` has **exactly 1** manager (`1..1`), placing `DirecteurSS` and `DateDébut` inside `Département` guarantees **zero `NULL`s** (`NOT NULL`). Adding **`UNIQUE`** on `DirecteurSS` enforces the `0..1` limit so no employee can manage two departments.
        hints:
          - "Which table avoids `NULL` values for the foreign key?"
          - "Without `UNIQUE` on `DirecteurSS`, would the association still be 1:1?"

      - id: qz-ch4-strategy-8b
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 4
        related_block_id: th-step-8-comparison
        title: "When Strategy 8B Fails"
        question: "Suppose `PersonnelUni(NumPersonnel, Nom, Prénom)` has a **partial** specialization into `{Enseignant, Chercheur}`. Is **Strategy 8B** (creating only `Enseignant` and `Chercheur` tables, omitting `PersonnelUni`) appropriate?"
        options:
          - "No—because the specialization is partial, staff who are neither Enseignant nor Chercheur could not be stored, and someone who is both would have duplicated attributes."
          - "Yes—Strategy 8B works for all specializations as long as `NumPersonnel` is copied to both tables."
          - "Yes—because `Enseignant` and `Chercheur` inherit `NumPersonnel`, `Nom`, `Prénom` automatically."
          - "No—because Strategy 8B can only be used when there are at least 3 subclasses."
        correct_answer: "No—because the specialization is partial, staff who are neither Enseignant nor Chercheur could not be stored, and someone who is both would have duplicated attributes."
        explanation: |
          Strategy 8B eliminates the superclass table, which **fails for partial specializations** (there is nowhere to store superclass-only instances) and is ill-suited for overlapping specializations (duplicating superclass attributes and breaking global key uniqueness). Use **8A** or **8C** instead.
        hints:
          - "Where would an administrative staff member who is neither a teacher nor a researcher be stored if there is no `PersonnelUni` table?"
          - "Check the compatibility table for 8B under 'Partial specialization'."

      - id: qz-ch4-nary-key
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 4
        related_block_id: th-steps-6-7
        title: "Primary Key of a Reified Ternary Association"
        question: "When `Projection` links `Salle` (`*`), `Séance` (`*`), and `Film` (`1`), what is the `PRIMARY KEY` of the `Projection` relation?"
        options:
          - "`(NomSalle, DateSéance, HeureSéance)` — the PKs of the `*`-side entities; `TitreFilm` is a `NOT NULL` FK."
          - "`(NomSalle, DateSéance, HeureSéance, TitreFilm)` — all three participating entities' PKs."
          - "`(TitreFilm)` alone, since `Film` is on the `1` side."
          - "`(NomSalle, TitreFilm)` only."
        correct_answer: "`(NomSalle, DateSéance, HeureSéance)` — the PKs of the `*`-side entities; `TitreFilm` is a `NOT NULL` FK."
        explanation: |
          In Step 7, the PK of the reified weak entity is formed **only from the PKs of the `*`-side (owner) entities** (`Salle` and `Séance`). Because each `(Salle, Séance)` pair screens at most `1` `Film`, `TitreFilm` is functionally determined by `(NomSalle, DateSéance, HeureSéance)` and is a non-key `NOT NULL` foreign key.
        hints:
          - "If `TitreFilm` were in the PK, could two different films be scheduled in the same room at the same time?"
          - "Check the Step 7 rule: `*` side vs. `1` side."

      - id: qz-ch4-1n-fk-side
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 2
        related_block_id: th-steps-3-4-5-binary
        title: "Placing the Foreign Key in a 1:N Association"
        question: "In `Employé` (`4..*`) — `Travaille_pour` — (`1..1`) `Département` (each employee works for 1 department; each department has 4+ employees), where does the foreign key go?"
        options:
          - "In `Employé`, referencing `Département.Numéro`, with `NOT NULL`."
          - "In `Département`, referencing `Employé.NoSS`, with `NOT NULL`."
          - "In a new associative table `Travaille_pour(NoSS, Numéro)`."
          - "In `Employé`, with both `UNIQUE` and `NOT NULL`."
        correct_answer: "In `Employé`, referencing `Département.Numéro`, with `NOT NULL`."
        explanation: |
          In a 1:N association, the FK always goes on the **`N` (`*`) side** (`Employé`), referencing the `1` side (`Département`). It is `NOT NULL` (since every employee must have a department), and **must NOT be `UNIQUE`** (otherwise only one employee could work in each department!).
        hints:
          - "Can a single column in `Département` hold 4 or more `NoSS` values?"
          - "Check whether `UNIQUE` on `DepNum` would allow multiple employees in the same department."
