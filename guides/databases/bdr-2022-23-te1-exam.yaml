description: "Full 90-minute BDR TE1 past exam (25 Nov 2022, 100 pts): debugging & correcting an HEIG-VD annual events ER model (35 pts), ER-to-relational mapping with weak entities, recursive roles & overlapping specialization (30 pts), relational algebra evaluation (10 pts), and COMPETITION RA queries (25 pts)."
category: "Database Systems"
