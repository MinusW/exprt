      - id: q1-rubric
        block_type: reflection_rubric
        title: "Your Diagnosis & Corrected ER Schema (35 pts)"
        answer_mode: text
        prompt: |
          1. List **all errors and omissions** in the engineer's diagram relative to the *cahier des charges*.
          2. Describe the **corrected ER model** (entities, weak entities, keys/partial keys, associations, association classes, specialization constraints, multiplicities, and integrity constraints `CI`).
        self_check_criteria:
          - "Removed the single-instance entity `HEIG-VD` (and its `propose` association)."
          - "Added association class `Organize(dateStart, dateEnd)` between `Evenement` and `Organisateur` to store organizer history, and changed multiplicities to `1..*` (Evenement) and `*` (Organisateur)."
          - "Added an integrity constraint (CI): an event has only one organizer at a time (no overlapping `[dateStart, dateEnd]` intervals)."
          - "Made `Edition` a weak entity of `Evenement` with `année` as its partial key (qualifier `année` on `Evenement` with `1` to `*`)."
          - "Removed the redundant `Travaille pour` association between `Edition` and `Bénévole` (inherited from `Staff`)."
          - "Moved `role` out of `Staff` into an association class on `Travaille pour` between `Edition` (`*`) and `Staff` (`*`)."
          - "Changed `Personne` specialization from `{disjointe, totale}` to `{chevauchante, totale}` (overlapping, because an `Organisateur` can be `Staff`)."
          - "Changed `Bénévole` generalization to `{partielle}` (or replaced `Bénévole` with a boolean attribute on `Staff`)."
          - "Replaced the binary `Visite` setup with a ternary association `Visite` connecting `Edition` (`*`), `Site` (`1..*`), and `Participant` (`*`)."
        model_answer: |
          ### Errors Found & Required Corrections (10 Points)
          1. **Remove `HEIG-VD`:** Single-row/single-instance entities representing the system owner itself do not belong in the ER schema.
          2. **Association class `Organize(dateStart, dateEnd)`:** To track organizer change history, attach `Organize` with `dateStart` (and `dateEnd`) to the `organise` association.
          3. **Integrity Constraint (`CI`):** Add `CI: Un événement a un seul organisateur à la fois` (no overlapping periods for the same event).
          4. **Multiplicities on `organise`:** Change from `1..*` — `1` to `1..*` (on `Evenement`) — `*` (on `Organisateur`) because an event can have multiple organizers over time.
          5. **`Edition` as weak entity:** `Edition` is a weak entity of `Evenement` with `année` as its **partial key** (qualified association with `année` on `Evenement`, `1` to `*`), since each event has one edition per year.
          6. **Remove redundant `Travaille pour` to `Bénévole`:** `Bénévole` inherits `Travaille pour` from `Staff`.
          7. **`role` as association class:** `role` depends on both the `Staff` member and the `Edition`, so it must be an association class on `Travaille pour` between `Edition` (`*`) and `Staff` (`*`), not an attribute of `Staff`.
          8. **`Personne` specialization is `{chevauchante, totale}`:** An `Organisateur` can also be `Staff`, so the specialization cannot be disjoint.
          9. **`Bénévole` generalization is `{partielle}`:** Not all `Staff` are `Bénévole` (alternatively, model `estBénévole` as a boolean attribute on `Staff`).
          10. **`Visite` is a ternary association:** A participant visits a specific site *for a given edition*, so `Visite` must be a ternary association linking `Edition` (`*`), `Site` (`1..*`), and `Participant` (`*`).
