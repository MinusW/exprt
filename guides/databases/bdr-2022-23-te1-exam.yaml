      - id: q2a-rubric
        block_type: reflection_rubric
        title: "Relational Schema for 2(a)"
        answer_mode: text
        prompt: |
          Write the relational schema for diagram **2(a)**, specifying all primary keys, foreign keys, `NOT NULL`, and `UNIQUE` constraints.
        self_check_criteria:
          - "`E(e1, e2)` with `e1` as PK."
          - "`A(e1, i, a1, e12, i2)` with composite PK `(e1, i)`, FK `(e12, i2)` referencing `A(e1, i)` (nullable because `role1` is `0..1`), and FK `e1` referencing `E(e1)`."
          - "`B(b1, b2)` with `b1` as PK."
          - "`AB(b1, e1, i, s1)` with composite PK `(b1, e1, i)`, FK `b1` referencing `B(b1)`, and FK `(e1, i)` referencing `A(e1, i)`."
        model_answer: |
          ```text
          E(e1, e2)                  -- PK: e1

          A(e1, i, a1, e12, i2)      -- PK: (e1, i)
            (e12, i2) référence A(e1, i)
            e1 référence E(e1)

          B(b1, b2)                  -- PK: b1

          AB(b1, e1, i, s1)          -- PK: (b1, e1, i)
            b1 référence B.b1
            (e1, i) référence A.(e1, i)
          ```

          **Key Notes:**
          * `A` is a weak entity of `E`, so its PK is `(e1, i)`.
          * `AA` is `0..1` on `role1` and `*` on `role2`, so the `*` side (`A`) absorbs the FK `(e12, i2)` referencing `A(e1, i)` (nullable because of `0..1`).
          * `AB` is a `*` to `1..*` association with attribute `s1`, so it becomes its own relation with PK `(b1, e1, i)`.

