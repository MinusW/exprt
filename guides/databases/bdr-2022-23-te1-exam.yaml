      - id: q2b-rubric
        block_type: reflection_rubric
        title: "Relational Schema for 2(b)"
        answer_mode: text
        prompt: |
          Write the relational schema for diagram **2(b)**, specifying all primary keys, foreign keys, `NOT NULL`, and `UNIQUE` constraints.
        self_check_criteria:
          - "`C(c1, c2)` with PK `c1`."
          - "`D(d1, d2, c1)` with PK `d1`, FK `c1` ref `C.c1`, and `c1 NOT NULL` (because `D` has `1..1` participation in `CD`? Wait: `C` is `1..1` and `D` is `1..*` in `CD`, so every `D` has 1 `C`)."
          - "`F(c1, f1, f2, c1g, r1, r2)` with PK `c1`, FK `c1` ref `C.c1`, FK `c1g` ref `G.c1`, and `c1g NOT NULL`."
          - "`G(c1, g1)` with PK `c1`, FK `c1` ref `C.c1`."
          - "`H(h1, h2, c1)` with PK `h1`, FK `c1` ref `G.c1`, `c1 NOT NULL`, and `c1 UNIQUE`."
          - "`H3(h1, h3)` with composite PK `(h1, h3)` and FK `h1` ref `H.h1`."
        model_answer: |
          ```text
          C(c1, c2)                       -- PK: c1

          D(d1, d2, c1)                   -- PK: d1
            c1 référence C.c1
            c1 NOT NULL

          F(c1, f1, f2, c1g, r1, r2)      -- PK: c1
            c1 référence C.c1
            c1g référence G.c1
            c1g NOT NULL

          G(c1, g1)                       -- PK: c1
            c1 référence C.c1

          H(h1, h2, c1)                   -- PK: h1
            c1 référence G.c1
            c1 NOT NULL
            c1 UNIQUE

          H3(h1, h3)                      -- PK: (h1, h3)
            h1 référence H.h1
          ```

          **Key Notes:**
          * `{overlapping, partial}` specialization maps to separate tables for `C`, `F`, and `G`, with `F` and `G` inheriting `c1` as PK+FK.
          * `F` (`*`) — `G` (`1..1`) with association class `FG(r1, r2)` is absorbed into `F` (`c1g`, `r1`, `r2`) with `c1g NOT NULL`.
          * `G` (`1..1`) — `H` (`0..1`): `H` is the optional (`0..1`) side and every `H` maps to 1 `G` (`1..1`), so `H` absorbs `c1` with both `NOT NULL` and `UNIQUE`.
          * Multivalued attribute `h3 [1..*]` on `H` becomes `H3(h1, h3)`.

  - id: sec-q3-ra-evaluation
    title: "Q3. Relational Algebra Expression Evaluation (10 pts)"
    blocks:
      - id: q3-tables
        block_type: markdown
        title: "Given Relations T, S, and R"
        content: |
          Soient $T$, $S$, $R$ les trois relations suivantes :

          | $T(A, B, C, D)$ | | | | | $S(A, B, C)$ | | | | $R(C)$ |
          | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
          | **A** | **B** | **C** | **D** | | **A** | **B** | **C** | | **C** |
          | 1 | 2 | 3 | 1 | | 3 | 4 | 2 | | 3 |
          | 1 | 8 | 3 | 2 | | 6 | 2 | 6 | | 4 |
          | 4 | 8 | 5 | 5 | | | | | | 6 |
          | 5 | 2 | 3 | 2 | | | | | | |
          | 3 | 4 | 2 | 7 | | | | | | |
          | 3 | 5 | 2 | 3 | | | | | | |
          | 4 | 2 | 4 | 4 | | | | | | |
          | 4 | 2 | 6 | 6 | | | | | | |
          | 6 | 2 | 6 | 9 | | | | | | |

      - id: q3a-rubric
        block_type: reflection_rubric
        title: "3(a) Evaluate σ_{B=C}(π_{A,B}(S) × R)"
        answer_mode: text
        prompt: |
          Compute the result of:
          $$\sigma_{B=C}(\pi_{A,B}(S) \times R)$$
          Show the intermediate Projection and Cross Product relations, then the final Selection result.
        self_check_criteria:
          - "Projection $\\pi_{A,B}(S)$ yields `(3, 4)` and `(6, 2)`."
          - "Cartesian product $\\pi_{A,B}(S) \\times R$ yields 6 tuples `(A, B, C)`."
          - "Selection $\\sigma_{B=C}$ keeps only `(3, 4, 4)`."
        model_answer: |
          1. **Projection** $\pi_{A,B}(S)$:
             `{(3, 4), (6, 2)}`
          2. **Cross Product** $\pi_{A,B}(S) \times R$:
             `{(3, 4, 3), (3, 4, 4), (3, 4, 6), (6, 2, 3), (6, 2, 4), (6, 2, 6)}`
          3. **Selection** $\sigma_{B=C}$:
             Only `(3, 4, 4)` satisfies $B = C$ ($4 = 4$).

             | A | B | C |
             | :---: | :---: | :---: |
             | 3 | 4 | 4 |

      - id: q3b-quiz
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 2
        related_block_id: q3-tables
        title: "3(b) Evaluate T ⊗ S"
        question: |
          What is the result of the natural join $T \otimes S$?
        options:
          - "{ (3, 4, 2, 7), (6, 2, 6, 9) }"
          - "{ (3, 4, 2, 7), (3, 5, 2, 3), (6, 2, 6, 9) }"
          - "{ (1, 2, 3, 1), (4, 2, 6, 6), (6, 2, 6, 9) }"
          - "{ (3, 4, 2), (6, 2, 6) }"
        correct_answer: "{ (3, 4, 2, 7), (6, 2, 6, 9) }"
        explanation: "Natural join $T \\otimes S$ matches on all shared attributes $(A, B, C)$. Only `(3, 4, 2, 7)` and `(6, 2, 6, 9)` in $T$ match `(3, 4, 2)` and `(6, 2, 6)` in $S$, and the schema retains $D$."
        hints:
          - "Which attributes are shared between $T(A, B, C, D)$ and $S(A, B, C)$?"
          - "Check every tuple of $S$ against $T$ on all three shared columns $(A, B, C)$."

      - id: q3c-quiz
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: q3-tables
        title: "3(c) Evaluate T ÷ σ_{C=2}(S)"
        question: |
          What is the result of the division $T \div \sigma_{C=2}(S)$?
        options:
          - "D = { (7) }"
          - "D = { (7), (3) }"
          - "D = { (9) }"
          - "Empty relation"
        correct_answer: "D = { (7) }"
        explanation: "$\\sigma_{C=2}(S)$ has schema $(A, B, C)$ and contains the single tuple `(3, 4, 2)`. Dividing $T(A, B, C, D)$ by $(A, B, C)$ returns all $D$ values paired in $T$ with `(3, 4, 2)`, which is only `D = 7`."
        hints:
          - "First evaluate $\\sigma_{C=2}(S)$: which tuple(s) of $S$ have $C = 2$?"
          - "What is the resulting schema of $T(A, B, C, D) \\div R'(A, B, C)$?"

  - id: sec-q4-ra-queries
    title: "Q4. Relational Algebra Queries — COMPETITION (25 pts)"
    blocks:
      - id: q4-schema
        block_type: markdown
        title: "COMPETITION Database Schema"
        content: |
          Soit la base de données **COMPETITION** :
          * `Equipe(codeEquipe, nomEquipe, directeur)` — PK: `codeEquipe`
          * `Pays(codePays, nomPays)` — PK: `codePays`
          * `Coureur(numDossard, nomCoureur, codeEquipe, codePays)` — PK: `numDossard`
            * `codeEquipe` référence `Equipe.codeEquipe` (`NOT NULL`)
            * `codePays` référence `Pays.codePays`
          * `Etape(numEtape, kms, villeDepart, villeArrivee)` — PK: `numEtape`
          * `Temps(numDossard, numEtape, tempsRealise)` — PK: `(numDossard, numEtape)`
            * `numDossard` référence `Coureur.numDossard`
            * `numEtape` référence `Etape.numEtape`

          > **Remarque :** La table `Temps` ne stocke que les temps des coureurs qui ont participé à l'étape. Si un coureur déclare forfait pour une étape, aucun tuple correspondant n'est enregistré dans la table.

      - id: q4a-rubric
        block_type: reflection_rubric
        title: "4(a) Stages with no German runners"
        answer_mode: text
        prompt: |
          Donner le numéro des étapes auxquelles **aucun coureur allemand** n'a participé.
        self_check_criteria:
          - "Filtered `Pays` for `nomPays = 'Allemagne'`."
          - "Joined with `Coureur` and `Temps` to find stages (`numEtape`) that had at least one German runner."
          - "Subtracted those stages from $\\pi_{\\text{numEtape}}(\\text{Etape})$ using set difference ($-$)."
        model_answer: |
          $$R_1 \leftarrow \sigma_{\text{nomPays} = \text{'Allemagne'}}(\text{Pays})$$
          $$R_2 \leftarrow \text{Coureur} \otimes R_1 \otimes \text{Temps}$$
          $$R_3 \leftarrow \pi_{\text{numEtape}}(R_2)$$
          $$R \leftarrow \pi_{\text{numEtape}}(\text{Etape}) - R_3$$

          **Why set difference?** Universal negation ("no German runner participated") cannot be expressed with $\sigma_{\text{nomPays} \ne \text{'Allemagne'}}$, because a stage with both a French and a German runner would still appear. You must subtract the stages *with* a German runner from *all* stages.

      - id: q4b-rubric
        block_type: reflection_rubric
        title: "4(b) Pairs of runners with the same time on the same stage"
        answer_mode: text
        prompt: |
          Pour tous les couples de coureurs qui ont pris le même temps pour une même étape, donner le numéro de l'étape ainsi que les numéros de dossard des deux coureurs.
        self_check_criteria:
          - "Renamed `numDossard` in a copy of `Temps` (e.g., `Temps2`) while keeping `numEtape` and `tempsRealise` identical for natural join."
          - "Joined `Temps` and `Temps2` (and optionally filtered `numDossard < numDossard2` or `numDossard <> numDossard2` to avoid self-pairs if desired; note official solution writes `Temps ⊗ Temps2`)."
          - "Projected `(numEtape, numDossard, numDossard2)`."
        model_answer: |
          $$\text{Temps2} \leftarrow \rho_{(\text{numDossard2}, \text{numEtape}, \text{tempsRealise})}(\text{Temps})$$
          $$R \leftarrow \pi_{\text{numEtape}, \text{numDossard}, \text{numDossard2}}(\text{Temps} \otimes \text{Temps2})$$

          *(Note: Adding $\sigma_{\text{numDossard} < \text{numDossard2}}$ eliminates self-pairs `(x, x)` and mirrored duplicates `(x, y)` / `(y, x)` if required.)*

      - id: q4c-rubric
        block_type: reflection_rubric
        title: "4(c) Runners who participated in all the same stages as Usain Bolt"
        answer_mode: text
        prompt: |
          Donner le numéro de dossard des coureurs qui ont participé à **toutes les mêmes étapes** que le coureur `"Usain Bolt"` (un seul coureur a ce nom).
        self_check_criteria:
          - "Found the stages `UBEtapes` in which `'Usain Bolt'` participated."
          - "Projected `Temps` down to `(numDossard, numEtape)` before dividing (critical so `tempsRealise` does not break division)."
          - "Divided $\\pi_{\\text{numDossard}, \\text{numEtape}}(\\text{Temps}) \\div \\text{UBEtapes}$."
        model_answer: |
          $$\text{UB} \leftarrow \sigma_{\text{nomCoureur} = \text{'Usain Bolt'}}(\text{Coureur})$$
          $$\text{UBEtapes} \leftarrow \pi_{\text{numEtape}}(\text{Temps} \otimes \text{UB})$$
          $$R \leftarrow \pi_{\text{numDossard}, \text{numEtape}}(\text{Temps}) \div \text{UBEtapes}$$

          **Common Pitfall:** Dividing `Temps` directly without projecting out `tempsRealise` fails because `(numDossard, tempsRealise)` would be kept as the dividend's remaining attributes.

      - id: q4d-rubric
        block_type: reflection_rubric
        title: "4(d) All departure and arrival cities (single column)"
        answer_mode: text
        prompt: |
          Donner la liste de toutes les villes d'arrivée et de départ des étapes (une seule colonne).
        self_check_criteria:
          - "Projected `villeArrivee` and `villeDepart` separately from `Etape`."
          - "Renamed both projections to the same single attribute name (e.g., `ville`) so they are union-compatible."
          - "Combined them with union ($\\cup$)."
        model_answer: |
          $$R \leftarrow \rho_{\text{ville}}(\pi_{\text{villeArrivee}}(\text{Etape})) \cup \rho_{\text{ville}}(\pi_{\text{villeDepart}}(\text{Etape}))$$
