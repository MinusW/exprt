sections:
  - id: sec-exam-overview
    title: "Exam Overview & Operator Reference"
    blocks:
      - id: ov-structure
        block_type: markdown
        title: "Exam Format & Point Breakdown (90 Minutes — 100 pts)"
        content: |
          This mock exam reproduces the official **BDR Travail Écrit 1 (25 November 2022)**. Time yourself for **90 minutes** before revealing any model answers.

          | Question | Topic | Points |
          | :--- | :--- | :---: |
          | **Q1** | Entity-Relationship (ER) Modeling — Error Diagnosis & Correction | 35 |
          | **Q2** | ER-to-Relational Mapping (PK, FK, `UNIQUE`, `NOT NULL`) | 30 |
          | **Q3** | Relational Algebra — Expression Evaluation on Sample Tables | 10 |
          | **Q4** | Relational Algebra — Writing Queries (`COMPETITION` DB) | 25 |
          | **Total** | | **100** |

          ### Relational Algebra Operator Reference (from Exam Sheet)
          | Operation | Notation |
          | :--- | :--- |
          | Selection | $\sigma_{\langle\text{condition}\rangle}(R)$ |
          | Projection | $\pi_{\langle\text{attributes}\rangle}(R)$ |
          | Renaming | $\rho_{S(B_1, B_2, \dots, B_n)}(R)$ |
          | Assignment | $=$ or $\leftarrow$ |
          | Set operations (Union, Intersection, Difference) | $\cup,\ \cap,\ -$ |
          | Cartesian product | $\times$ |
          | Natural join (shared attribute names) | $R_1 \otimes R_2$ |
          | Theta join | $R_1 \otimes_{R_1.a = R_2.b} R_2$ |
          | Division | $/$ or $\div$ |

  - id: sec-q1-er-modeling
    title: "Q1. ER Modeling & Error Analysis (35 pts)"
    blocks:
      - id: q1-prompt-spec
        block_type: markdown
        title: "Problem Statement & Cahier des charges"
        content: |
          L'HEIG-VD souhaite informatiser son système d'organisation d'événements annuels. Un ingénieur a proposé le modèle entité-association ci-dessous. Ce dernier comporte plusieurs erreurs ou lacunes.

          **Tâche :** Lisez le cahier des charges ci-dessous, trouvez les erreurs de l'ingénieur et proposez un schéma corrigé complet (avec les contraintes d'intégrité si nécessaire).

          > **Cahier des charges :**
          > * Un événement a un nom (par exemple *Baleinev*, *Portes Ouvertes*) qui permet de l'identifier. Chaque année il y a une seule édition de chaque événement.
          > * Une édition d'un événement se déroule sur plusieurs sites. Plusieurs éditions peuvent se dérouler sur le même site. Un site a une adresse et est identifié par un nom.
          > * Un événement a un seul organisateur à la fois. L'organisateur peut changer à tout moment et on souhaite garder l'historique de ces changements.
          > * Un Staff peut travailler pour plusieurs éditions et pour chaque édition, il a un rôle spécifique.
          > * Des personnes bénévoles peuvent travailler en tant que Staff. Elles peuvent également travailler pour plusieurs éditions et pour chaque édition elles ont aussi un rôle spécifique.
          > * Un participant visite un ou plusieurs sites d'une édition. Pour chaque édition, on souhaite enregistrer la visite d'un participant sur un site donné.
          > * Un Organisateur peut être Staff.
          > * Un Organisateur, Staff, Bénévole ou Participant a un identifiant, un nom, un prénom et une adresse email.

