id: bdr-2024-te1-exam
title: "Mock Exam: BDR TE1 (Nov 2024)"
description: "Full 90-minute BDR TE1 past exam (4 November 2024, 121 pts): Hospital ER modeling with specialization and ternary associations (48 pts), ER-to-relational mapping with composite keys, weak entities, and ternary constraints (38 pts), Relational Algebra evaluation (10 pts), and Firefighter RA queries including division (25 pts)."
category: "Database Systems"
track: "Relational Database Fundamentals (BDR)"
track_order: 8
estimated_minutes: 90
tags: ["mock-exam", "exam", "bdr", "te1"]
prerequisites:
  - "bdr-ch1-dbms-concepts"
  - "bdr-ch2-entity-relationship-modeling"
  - "bdr-ch3-relational-model-constraints"
  - "bdr-ch4-er-to-relational-mapping"
  - "bdr-ch5-relational-algebra"
sources:
  - title: "BDR TE1 — Travail Écrit du 4 Novembre 2024 (Fatemi & Lemer)"
    url_or_path: "sources/BDR-TE1/tests/BDR2024_TE1.pdf"
    notes: "Official 90-minute TE1 exam paper (121 points total)"

sections:
  - id: sec-exam-overview
    title: "Exam Overview & Strategy"
    blocks:
      - id: md-exam-briefing
        block_type: markdown
        title: "TE1 Format & Time Budget (90 Minutes — 121 Points)"
        content: |
          | Question | Topic | Points | Suggested Time |
          | :--- | :--- | :---: | :---: |
          | **Q1 (a, b, c)** | Modèle Entité-Association (Hôpital) | 48 | 35 min |
          | **Q2** | Passage EA $\to$ Modèle Relationnel | 38 | 25 min |
          | **Q3 (a–e)** | Évaluation d'expressions d'Algèbre Relationnelle | 10 | 10 min |
          | **Q4 (a–d)** | Requêtes en Algèbre Relationnelle (Pompiers) | 25 | 20 min |

          > [!TIP]
          > **High-ROI Exam Rules:**
          > * In **Q1/Q2**, always check **weak entities** (qualifiers / partial keys), **specialization constraints** (`{total/partial, disjoint/overlapping}`), and **ternary multiplicities** (`1` on an arm means the other two entities' PKs determine it).
          > * In **Q3**, verify **union compatibility** (same arity *and* matching attribute types) before evaluating $\cup, \cap, -$.
          > * In **Q4**, for "never" queries ($\text{all} - \text{bad}$), always start from the **entity relation** (`Pompiers`), never the bridge relation (`Interventions`).

