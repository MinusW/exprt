      - id: ref-q1a-er-model
        block_type: reflection_rubric
        title: "Q1(a) (36 pts) — Compléter le modèle EA (Hôpital)"
        answer_mode: paper
        prompt: |
          Compléter le modèle EA ci-dessus pour qu'il corresponde à la description suivante (spécifier contraintes de spécialisation, cardinalités et clés primaires) :

          * Un hôpital est composé **exclusivement** de médecins, d'infirmiers et de patients, tous trois décrits par `NoSS`, `Nom`, `Prénom`, `DateNaiss`, `Tel`. Un médecin se caractérise aussi par `Spécialisation`. Une même personne **ne peut avoir qu'un de ces trois rôles à la fois**.
          * Un infirmier est responsable d'un nombre arbitraire de patients, et chaque patient doit avoir au moins un infirmier assigné.
          * Un infirmier doit aussi assister exactement un médecin, et chaque médecin peut avoir un nombre arbitraire d'infirmiers qui l'assistent.
          * Pour chaque patient, il existe également au moins un **rapport médical**, rédigé par un médecin et identifié par une `Date` et le `NoSS` du patient. Chaque rapport médical contient une `Note` rédigée par le médecin, et un même médecin peut rédiger un nombre arbitraire de rapports.
          * Enfin, un ensemble de **traitements** existe, caractérisés chacun par un `Nom` unique (ex : physiothérapie) et un **ensemble de procédures** à suivre pour exécuter le traitement (chaque procédure est une simple chaîne de caractères).
          * Un traitement peut être appliqué par un médecin à un patient, sur une période définie par `Date_début` et `Date_fin`. Un traitement appliqué à un patient doit toujours être appliqué par **un seul médecin**. En revanche, un même médecin peut appliquer le même traitement à un nombre arbitraire de patients.
        self_check_criteria:
          - "Contrainte `{total, disjoint}` spécifiée sur la spécialisation de `Personne` vers `Médecin`, `Infirmier`, `Patient`."
          - "Association `Est_responsable` entre `Infirmier` (`1..*` côté Infirmier) et `Patient` (`*` / `0..*` côté Patient)."
          - "Association `Assiste` entre `Infirmier` (`*` / `0..*` côté Infirmier) et `Médecin` (`1` côté Médecin)."
          - "`Rapport_Médical` modélisé comme **entité faible** identifiée par `Patient.NoSS` + `Date` (clé partielle), avec attribut `Note`, cardinalité `1` côté `Patient` et `1..*` côté `Rapport_Médical`."
          - "Association `Rédige` entre `Médecin` (`1` côté `Médecin`) et `Rapport_Médical` (`*` / `0..*` côté `Rapport_Médical`)."
          - "`Traitement` avec clé primaire `Nom` et attribut multivalué `Procédures [1..*]` (ou entité faible `Procédure`)."
          - "Association ternaire `Applique` (avec attributs `Date_début`, `Date_fin`) entre `Médecin` (`1`), `Patient` (`*`), et `Traitement` (`*`)."
        model_answer: |
          ### Solution complète Q1(a)

          1. **Spécialisation de `Personne`** :
             * Contrainte **`{total, disjoint}`** ("exclusivement" $\to$ total ; "un seul rôle à la fois" $\to$ disjoint).
             * `Personne` : **`NoSS`** (PK), `Nom`, `Prénom`, `DateNaiss`, `Tel`.
             * `Médecin` : `Spécialisation`.
          2. **`Infirmier` — `Patient` (`Est_responsable`)** :
             * Chaque `Infirmier` est responsable de `0..*` (`*`) `Patient`s.
             * Chaque `Patient` a `1..*` `Infirmier`s.
          3. **`Infirmier` — `Médecin` (`Assiste`)** :
             * Chaque `Infirmier` assiste `1` `Médecin`.
             * Chaque `Médecin` est assisté par `0..*` (`*`) `Infirmier`s.
          4. **`Rapport_Médical` (entité faible de `Patient`)** :
             * Clé partielle / qualificateur : `Date` (clé complète = `(Patient.NoSS, Date)`), attribut `Note`.
             * `Patient` (`1`) — (`1..*`) `Rapport_Médical` ("au moins un rapport médical par patient").
             * `Médecin` (`1`) — (`0..*`) `Rapport_Médical` (`Rédige`).
          5. **`Traitement` & `Procédures`** :
             * `Traitement` : **`Nom`** (PK), attribut multivalué `Procédures [*]` (ou `1..*`).
          6. **Association ternaire `Applique` (`Médecin`, `Patient`, `Traitement`)** :
             * Attributs d'association : `Date_début`, `Date_fin`.
             * Cardinalités UML : **`1`** sur la branche `Médecin` (un couple `(Patient, Traitement)` est toujours appliqué par un seul médecin), **`*`** sur `Patient` et **`*`** sur `Traitement`.
