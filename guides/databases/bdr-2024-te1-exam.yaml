      - id: ref-q2-relational-schema
        block_type: reflection_rubric
        title: "Q2 (38 pts) — Traduction complète en modèle relationnel"
        answer_mode: text
        prompt: |
          Lister les relations obtenues lors du passage du modèle EA ci-dessus au modèle relationnel sous la forme `R(att1, att2, ... attn)`. Mentionner les **clés primaires (PK)**, **clés étrangères (FK)**, ainsi que toute contrainte d'**unicité (`UNIQUE`)** et **`NOT NULL`**.
        self_check_criteria:
          - "Attribut composite `a` de `A` aplati en `A(a1, a2)` avec `PK: (a1, a2)`."
          - "Entité faible `B(a1, a2, b1, b2)` avec `PK: (a1, a2, b1)` et `FK: (a1, a2) -> A(a1, a2)`."
          - "Entité faible `C(a1, a2, b1, c1, c2)` avec `PK: (a1, a2, b1, c1)` et `FK: (a1, a2, b1) -> B(a1, a2, b1)`."
          - "Table de liaison `BD(a1, a2, b1, d1)` avec `PK: (a1, a2, b1, d1)` et deux FKs vers `B` et `D`."
          - "Héritage `{total, disjoint}` de `E` vers `H, J, K` traduit proprement (table `E(e1)` + tables `H(e1, h1)`, `J(e1, j1)`, `K(e1, k1)` car `E` participe à `DEF`)."
          - "Ternaire `DEF(d1, e1, f1)` avec **`PK: (d1, e1)`** (grâce à la multiplicité `1` sur `F`), FKs vers `D`, `E`, `F`, et `f1 NOT NULL`."
          - "Association `F(0..1)—G(1)` avec classe d'association `FG(fg1)` fusionnée dans `F(f1, f2, g1, fg1)` avec `g1 UNIQUE NOT NULL` et `fg1 NOT NULL`."
        model_answer: |
          ### Relations obtenues (Modèle relationnel)

          1. **`A(a1, a2)`**
             * **PK** : `(a1, a2)` *(attribut composite `a = {a1, a2}` aplati)*
          2. **`B(a1, a2, b1, b2)`** *(entité faible qualifiée par `b1` sur `A`)*
             * **PK** : `(a1, a2, b1)`
             * **FK** : `(a1, a2)` référence `A(a1, a2)`
          3. **`C(a1, a2, b1, c1, c2)`** *(entité faible qualifiée par `c1` sur `B`)*
             * **PK** : `(a1, a2, b1, c1)`
             * **FK** : `(a1, a2, b1)` référence `B(a1, a2, b1)`
          4. **`D(d1, d2)`**
             * **PK** : `d1`
          5. **`BD(a1, a2, b1, d1)`** *(association `* : *` entre `B` et `D`)*
             * **PK** : `(a1, a2, b1, d1)`
             * **FK** : `(a1, a2, b1)` référence `B(a1, a2, b1)`
             * **FK** : `d1` référence `D(d1)`
          6. **`E(e1)`** et sous-classes `{total, disjoint}` :
             * **`E(e1)`** — **PK** : `e1`
             * **`H(e1, h1)`** — **PK** : `e1`, **FK** : `e1` référence `E(e1)`
             * **`J(e1, j1)`** — **PK** : `e1`, **FK** : `e1` référence `E(e1)`
             * **`K(e1, k1)`** — **PK** : `e1`, **FK** : `e1` référence `E(e1)`
             *(Note : la contrainte `{total, disjoint}` ne peut pas être garantie uniquement par des FKs et nécessiterait un trigger/assertion.)*
          7. **`G(g1, g2)`**
             * **PK** : `g1`
          8. **`F(f1, f2, g1, fg1)`** *(chaque `F` est lié à exactement `1` `G`, et chaque `G` à `0..1` `F`)*
             * **PK** : `f1`
             * **FK** : `g1` référence `G(g1)`, **`UNIQUE`**, **`NOT NULL`**
             * **`fg1 NOT NULL`**
          9. **`DEF(d1, e1, f1)`** *(ternaire avec multiplicité `1` côté `F`)*
             * **PK** : `(d1, e1)`
             * **FK** : `d1` référence `D(d1)`
             * **FK** : `e1` référence `E(e1)`
             * **FK** : `f1` référence `F(f1)`, **`NOT NULL`**

      - id: qz-q2-def-pk
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: ref-q2-relational-schema
        question: "In the ternary association `DEF` where `D` has `*`, `E` has `*`, and `F` has `1`, what is the primary key of the resulting relation `DEF(d1, e1, f1)`?"
        options:
          - "(d1, e1)"
          - "(d1, e1, f1)"
          - "(d1, f1)"
          - "f1"
        correct_answer: "(d1, e1)"
        explanation: "In UML ternary notation, multiplicity `1` on `F`'s arm means that for any given `(D, E)` pair, there is at most one `F`. Thus `(d1, e1)` functionally determines `f1` and is the minimal primary key."
        hints:
          - "Read the `1` on `F`'s arm as a functional dependency from the other two participating entities."
          - "If `(D, E)` determines a unique `F`, including `f1` in the PK would be non-minimal (a superkey, not a candidate key)."

  - id: sec-q3-ra-evaluation
    title: "Question 3 — Algèbre relationnelle : Évaluation (10 points)"
    blocks:
      - id: md-q3-tables
        block_type: markdown
        title: "Relations R, S et T (types : entiers pour les nombres, caractères pour les lettres)"
        content: |
          | **R** (`A`, `B`, `C`) | **S** (`D`, `E`) | **T** (`A`, `B`, `C`) |
          | :--- | :--- | :--- |
          | `(1, 1, a)` | `(1, a)` | `(1, a, 100)` |
          | `(1, 1, b)` | `(1, b)` | `(2, b, 200)` |
          | `(1, 1, c)` | `(2, a)` | `(3, c, 100)` |
          | `(1, 2, a)` | `(2, b)` | `(4, d, 200)` |
          | `(2, 1, a)` | | |
          | `(2, 1, b)` | | |

      - id: qz-q3a-division
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: md-q3-tables
        question: "What is the result of **Q3(a)**: $R \\div \\rho_{(B, C)}(\\sigma_{D < 2}(S))$?"
        options:
          - "Schema (A): {(1), (2)}"
          - "Schema (A): {(1)}"
          - "Schema (A): {(2)}"
          - "Cannot be evaluated (type mismatch)"
        correct_answer: "Schema (A): {(1), (2)}"
        explanation: "$\\sigma_{D < 2}(S) = \\{(1, a), (1, b)\\}$. Renamed to `(B, C)`, both `A = 1` and `A = 2` in `R` are paired with both `(1, a)` and `(1, b)`, so the division returns `{(1), (2)}`."
        hints:
          - "First compute $\\sigma_{D < 2}(S)$ and rename its attributes to `(B, C)`."
          - "Check which `A` values in `R` appear with EVERY `(B, C)` tuple in that divisor."

      - id: qz-q3c-intersection
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: md-q3-tables
        question: "What happens when evaluating **Q3(c)**: $\\pi_{A, B}(R) \\cap \\rho_{A, B}(S)$?"
        options:
          - "Cannot be evaluated: attribute B has incompatible types (integer vs character)"
          - "Empty relation ∅ with schema (A, B)"
          - "Schema (A, B): {(1, a), (1, b), (2, a)}"
          - "Cannot be evaluated: different arities"
        correct_answer: "Cannot be evaluated: attribute B has incompatible types (integer vs character)"
        explanation: "Set operations ($\\cup, \\cap, -$) require union-compatibility: same arity AND matching domains/types per attribute. In $\\pi_{A,B}(R)$, `B` is an integer, whereas in $\\rho_{A,B}(S)$, `B` is a character."
        hints:
          - "Check the domain (type) of every attribute in both operands before intersecting."
          - "In `R`, `B` holds `{1, 2}` (integers), while in `S`, `E` (renamed to `B`) holds `{'a', 'b'}` (characters)."

      - id: ref-q3-all-solutions
        block_type: reflection_rubric
        title: "Q3(a–e) (10 pts) — Évaluation complète des 5 expressions"
        answer_mode: text
        prompt: |
          Pour chacune des 5 expressions ci-dessous, donnez la relation résultante (schéma + tuples) ou expliquez pourquoi elle ne peut pas être évaluée :

          * **(a)** $R \div \rho_{(B, C)}(\sigma_{D < 2}(S))$
          * **(b)** $\pi_D(S) \times \pi_A(\sigma_{A * 100 \le C}(T))$
          * **(c)** $\pi_{A, B}(R) \cap \rho_{A, B}(S)$
          * **(d)** $\rho_{A, B}(S) \otimes T$
          * **(e)** $T - \rho_{A, B}(S)$
        self_check_criteria:
          - "(a) Division donne `(A): {(1), (2)}`."
          - "(b) Sélection sur `T` garde `(1,a,100)` et `(2,b,200)`, produit cartésien donne `(D, A): {(1,1), (1,2), (2,1), (2,2)}`."
          - "(c) Impossible à évaluer : incompatibilité de type sur `B` (entier vs caractère)."
          - "(d) Jointure naturelle sur `(A, B)` donne `(A, B, C): {(1, a, 100), (2, b, 200)}`."
          - "(e) Impossible à évaluer : arités différentes (`T` a 3 attributs, `ρ_{A,B}(S)` en a 2)."
        model_answer: |
          * **(a) Résultat `(A)`** : `{(1), (2)}`
            * $\sigma_{D < 2}(S) = \{(1, a), (1, b)\}$, renommé en `(B, C)`. Dans `R`, `A=1` et `A=2` sont tous deux associés à `(1, a)` et `(1, b)`.
          * **(b) Résultat `(D, A)`** : `{(1, 1), (1, 2), (2, 1), (2, 2)}`
            * $\pi_D(S) = \{(1), (2)\}$.
            * $\sigma_{A*100 \le C}(T) = \{(1, a, 100), (2, b, 200)\}$ $\implies \pi_A = \{(1), (2)\}$.
          * **(c) Non évaluable** :
            * $\pi_{A,B}(R)$ a le schéma `(A: int, B: int)` alors que $\rho_{A,B}(S)$ a le schéma `(A: int, B: char)`. Les domaines de `B` sont incompatibles.
          * **(d) Résultat `(A, B, C)`** : `{(1, a, 100), (2, b, 200)}`
            * Jointure naturelle sur les attributs communs `(A, B)` dont les types concordent (`int, char`).
          * **(e) Non évaluable** :
            * `T` est d'arité **3** `(A, B, C)` tandis que $\rho_{A, B}(S)$ est d'arité **2** `(A, B)`. La différence ensembliste exige la même arité.

  - id: sec-q4-ra-queries
    title: "Question 4 — Requêtes en algèbre relationnelle (25 points)"
    blocks:
      - id: md-q4-schema
        block_type: markdown
        title: "Schéma relationnel — Pompiers & Interventions"
        content: |
          * `Pompiers(Pompier_id, Nom, Prenom, Grade, Date_naissance)`
          * `Vehicules(Vehicule_id, Type, Immatriculation, Disponibilite)`
          * `Incidents(Incident_id, Lieu, Date_incident, Type_incident)`
          * `Interventions(Pompier_id, Vehicule_id, Incident_id, Role)`
            * `Pompier_id` $\to$ `Pompiers.Pompier_id`
            * `Vehicule_id` $\to$ `Vehicules.Vehicule_id`
            * `Incident_id` $\to$ `Incidents.Incident_id`

      - id: ref-q4-queries
        block_type: reflection_rubric
        title: "Q4(a–d) (25 pts) — Exprimer les 4 requêtes en algèbre relationnelle"
        answer_mode: text
        prompt: |
          Exprimer les requêtes suivantes à l'aide de l'algèbre relationnelle :

          * **(a) (5 pts)** Pour les interventions réalisées sur un incident qui a eu lieu après le 1er janvier 2024, donner `Incident_id`, `Date_incident`, `Lieu`, et `Nom` et `Prenom` de tous les pompiers impliqués.
          * **(b) (6 pts)** Donner `Pompier_id` des pompiers qui n'ont **jamais** été impliqués dans des incidents de type `"incendie"`.
          * **(c) (7 pts)** Donner `Pompier_id`, `Nom` et `Prenom` des pompiers qui ont été impliqués dans **tous** les types d'incidents existants dans la base de données.
          * **(d) (7 pts)** Donner `Pompier_id` des pompiers qui sont intervenus dans une intervention impliquant un véhicule de type `"camion"` **ou** qui sont intervenus au moins une fois dans un incident de type `"incendie"`.
        self_check_criteria:
          - "(a) Jointure naturelle `Incidents ⋈ Interventions ⋈ Pompiers` avec sélection `Date_incident > '2024-01-01'` et projection des 5 attributs demandés."
          - "(b) Soustraction partant de `π_{Pompier_id}(Pompiers)` (et NON de `Interventions`) pour inclure les pompiers sans aucune intervention."
          - "(c) Division `π_{Pompier_id, Type_incident}(Interventions ⋈ Incidents) ÷ π_{Type_incident}(Incidents)`, suivie d'une jointure avec `Pompiers` pour récupérer `Nom` et `Prenom`."
          - "(d) Union `∪` des deux projections sur `Pompier_id` (`Vehicules` filtré sur `Type = 'camion'` et `Incidents` filtré sur `Type_incident = 'incendie'`)."
        model_answer: |
          * **(a)** (5 pts)
          $$\pi_{\text{Incident\_id}, \text{Date\_incident}, \text{Lieu}, \text{Nom}, \text{Prenom}}\Big(\sigma_{\text{Date\_incident} > \text{'2024-01-01'}}(\text{Incidents}) \otimes \text{Interventions} \otimes \text{Pompiers}\Big)$$

          * **(b)** (6 pts) — *Attention : partir de `Pompiers` pour ne pas perdre ceux qui n'ont aucune intervention !*
          $$\pi_{\text{Pompier\_id}}(\text{Pompiers}) - \pi_{\text{Pompier\_id}}\Big(\text{Interventions} \otimes \sigma_{\text{Type\_incident} = \text{'incendie'}}(\text{Incidents})\Big)$$

          * **(c)** (7 pts) — *Division relationnelle*
          $$\text{Ids} \leftarrow \pi_{\text{Pompier\_id}, \text{Type\_incident}}(\text{Interventions} \otimes \text{Incidents}) \div \pi_{\text{Type\_incident}}(\text{Incidents})$$
          $$\pi_{\text{Pompier\_id}, \text{Nom}, \text{Prenom}}(\text{Ids} \otimes \text{Pompiers})$$

          * **(d)** (7 pts)
          $$\pi_{\text{Pompier\_id}}\Big(\text{Interventions} \otimes \sigma_{\text{Type} = \text{'camion'}}(\text{Vehicules})\Big) \cup \pi_{\text{Pompier\_id}}\Big(\text{Interventions} \otimes \sigma_{\text{Type\_incident} = \text{'incendie'}}(\text{Incidents})\Big)$$
