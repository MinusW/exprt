      - id: ref-q1b-q1c-adaptations
        block_type: reflection_rubric
        title: "Q1(b) & Q1(c) (12 pts) — Contrainte d'équipe & Chevauchement de rôles"
        answer_mode: text
        prompt: |
          * **(b) (6 points)** Sur la base de votre réponse à la partie (a), quelle adaptation apporter pour garantir que **tous les infirmiers d'un même patient assistent le même médecin** ?
          * **(c) (6 points)** Supposons maintenant qu'**un médecin ou infirmier puisse également être patient** dans cet hôpital. Proposer une modification du modèle permettant ce scénario, tout en restant conforme au reste de la description initiale (un médecin ne peut toujours pas être infirmier).
        self_check_criteria:
          - "(b) Identifié qu'une contrainte d'intégrité sémantique (ou une refonte structurelle via une association `Patient`–`Médecin` + contrainte de sous-ensemble) est nécessaire."
          - "(c) Remplacé `{total, disjoint}` par `{total, overlapping}` (ou introduit une super-classe intermédiaire `Personnel_Soignant`) tout en préservant la disjonction entre `Médecin` et `Infirmier`."
        model_answer: |
          ### (b) Garantir que tous les infirmiers d'un patient assistent le même médecin (6 pts)
          Deux approches valides :
          1. **Contrainte d'intégrité sémantique explicite** ajoutée au schéma :
             > *Contrainte* : Pour tout `Patient p`, tous les `Infirmier`s liés à `p` via `Est_responsable` doivent être liés au même `Médecin` via `Assiste` ($\forall i_1, i_2 \in p.\text{infirmiers},\; i_1.\text{médecin} = i_2.\text{médecin}$).
          2. **Adaptation structurelle** : Ajouter une association directe `Est_suivi_par` entre `Patient` (`*`) et `Médecin` (`1`), et contraindre `Est_responsable` (`Infirmier`–`Patient`) par une contrainte de jointure/sous-ensemble : un infirmier `i` ne peut être responsable d'un patient `p` que si `i.Assiste.Médecin = p.Est_suivi_par.Médecin`.

          ### (c) Un médecin ou infirmier peut aussi être patient (6 pts)
          * Si on passe simplement `Personne` en `{total, overlapping}`, on autoriserait à tort qu'une personne soit à la fois `Médecin` et `Infirmier`.
          * **Solution propre (hiérarchie à 2 niveaux)** :
            * `Personne` se spécialise en **`{total, overlapping}`** vers `Personnel_Soignant` et `Patient`.
            * `Personnel_Soignant` se spécialise en **`{total, disjoint}`** vers `Médecin` et `Infirmier`.
          * *(Alternative équivalente : passer `Personne` en `{total, overlapping}` et ajouter la contrainte explicite `{disjoint}` entre `Médecin` et `Infirmier`.)*

