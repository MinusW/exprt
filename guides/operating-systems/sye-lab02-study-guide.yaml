id: sye-lab02-study-guide
title: SYE Lab 2 — Processes, Sockets & Scheduling
description: Complete study guide for Lab 2 of SO3 (adding syscalls, fork/waitpid, execve/environ, pipes/dup2, TCP sockets, SIGTSTP forfeit handling, and static priority scheduling).
category: Operating Systems
track: SYE - Operating Systems
track_order: 4
estimated_minutes: 45
difficulty_level: intermediate
tags:
  - operating-systems
  - syscalls
  - pipes
  - sockets
  - scheduling
prerequisites:
  - sye-te1-mock-exam
sources: []
sections:
  - id: sec-1-syscall-getparentpid
    title: "1. Step 1 — Adding a System Call (getparentpid)"
    blocks:
      - id: th-syscall-chain
        block_type: markdown
        title: "End-to-End Syscall Path in SO3 (ARM32)"
        content: |
          To expose kernel information to user space (such as `getparentpid` or `renice`), **4 files** must be updated consistently:

          | File | Exact Role | Example (`getparentpid`) |
          | :--- | :--- | :--- |
          | `so3/arch/arm32/syscall.h.in` | Maps the syscall name to its ABI number (`r7`) | `#define __NR_getparentpid 454` |
          | `so3/syscall.tbl` | Declares the syscall and its Kconfig dependency | `getparentpid getparentpid MMU` |
          | `so3/include/process.h` | Generates `__sys_*` and `sys_do_*` prototypes | `SYSCALL_DECLARE(getparentpid, void);` |
          | `so3/kernel/process.c` | Implements the kernel routine | `SYSCALL_DEFINE0(getparentpid) { ... }` |

          ### Generation Mechanism (`syscall_gen.sh`) & Macros
          * `syscall_gen.sh` first reads `syscall.tbl` to populate `sys_cond[name] = requirement` (e.g., `MMU`), then filters `arm32/syscall.h.in`: any `__NR_<name>` missing from `syscall.tbl` is **skipped** (`SYSCALL_<name>` is not defined and no entry is added to `syscall_table.h.in` $\rightarrow$ `-ENOSYS` at runtime). The `MMU` column wraps the table entry in `#ifdef CONFIG_MMU` (falling back to `&__sys_empty` when disabled).
          * `SYSCALL_DEFINE0(name)` generates two C symbols: the uniform wrapper `long __sys_<name>(syscall_args_t *unused)` (stored in `syscall_table[]`) and the implementation `inline long sys_do_<name>(void)`.
          * `SYSCALL_DECLARE(name, ...)` in `process.h` declares `__sys_<name>` so the generated `syscall_table.h.in` can take its address `&__sys_<name>`.

          ### Classic Exam Traps
          * **Naming without the `sys_` prefix:** `SYSCALL_DECLARE(name)` and `SYSCALL_DEFINE0(name)` already prepend `__sys_` and `sys_do_`. Putting `sys_getparentpid` in `syscall.tbl` generates `__sys_sys_getparentpid`.
          * **`current()` and `NULL`-pointer dereference:** `current()` returns the `tcb_t *` of the currently executing thread (`tcb->pcb` points to its `pcb_t`). `fork()` initializes `pcb->parent`, whereas `new_process()` zeroes the PCB (`memset`): the root process (`PID 1`, `create_root_process()`) has **`pcb->parent == NULL`**, and kernel threads have **`tcb->pcb == NULL`**. Without a guard, `current()->pcb->parent->pid` triggers a **Kernel Panic (Data Abort)**:
            ```c
            if (!current()->pcb || !current()->pcb->parent)
                return 0;
            return current()->pcb->parent->pid;
            ```
          * **Why `#define SYS_getparentpid 454` instead of `getppid()`?** The `musl` libc is prebuilt in the toolchain: its `getppid()` wrapper issues `__NR_getppid` (`64`), which is **absent** from `so3/syscall.tbl` and therefore returns `-ENOSYS`. User space must explicitly target `454` via `syscall(SYS_getparentpid)`.
      - id: diag-syscall-flow
        block_type: kroki
        diagram_type: mermaid
        title: "User → Kernel Path on ARM32"
        source: |
          flowchart LR
            U["User: syscall(454)"] --> R7["r7 = 454, svc #0"]
            R7 --> VEC["exception.S (SVC Mode)"]
            VEC --> DISP["syscall_handle()"]
            DISP --> TBL["syscall_table[454]"]
            TBL --> FN["sys_do_getparentpid()"]
            FN --> RET["Return in r0 (USR Mode)"]
        caption: "scripts/syscall_gen.sh generates syscall_number.h and syscall_table.h.in from syscall.tbl and arm32/syscall.h.in."
      - id: qz-syscall-null-parent
        block_type: quiz_question
        question_type: multiple_choice
        title: "Kernel Trap in sys_getparentpid"
        question: |
          A student implements `SYSCALL_DEFINE0(getparentpid)` in `so3/kernel/process.c` as a single line:

          ```c
          return current()->pcb->parent->pid;
          ```

          It works when called from a process launched by the shell. What happens if the root process (`PID 1`, created by `create_root_process()`) calls this syscall directly?
        options:
          - "The kernel triggers a Data Abort / Kernel Panic due to a NULL-pointer dereference."
          - "The syscall automatically returns 0 because the parent PCB points to a dummy PCB with PID 0."
          - "The syscall returns -ESRCH thanks to the SYSCALL_DEFINE0 macro."
          - "The compiler refuses to build the kernel until a NULL check is added."
        correct_answer: "The kernel triggers a Data Abort / Kernel Panic due to a NULL-pointer dereference."
        explanation: |
          The root process created by `create_root_process()` has no parent: `new_process()` zeroes out the PCB, leaving `pcb->parent == NULL`. Accessing `pcb->parent->pid` dereferences `NULL` in kernel (`SVC`) mode, causing a fatal Data Abort.

          * "automatically returns 0" is wrong: there is no dummy PCB for PID 0.
          * "returns -ESRCH" is wrong: `SYSCALL_DEFINE0` performs no checks on `pcb->parent`.
          * "refuses to build" is wrong: C does not catch NULL-pointer dereferences at compile time.
        hints:
          - "Which process has `pcb->parent == NULL` in `so3/kernel/process.c`?"
          - "What does the CPU do when dereferencing `NULL->pid` in privileged mode?"
        difficulty: 3
        related_block_id: th-syscall-chain

  - id: sec-2-fork-sync
    title: "2. Step 2 — fork() & Execution Order (test_parentpid)"
    blocks:
      - id: th-fork-order
        block_type: markdown
        title: "Why fork() Gives No Ordering Guarantee"
        content: |
          After `pid_t pid = fork();`:
          * The parent receives `pid > 0` (the child's PID); the child receives `pid == 0`.
          * **Both** processes are placed in the `READY` state. The scheduler is free to run either one first.

          ### Guaranteeing the Child Always Prints Before the Parent
          The only deterministic guarantee without busy-waiting is calling **`waitpid(pid, &status, 0)`** in the parent **before** its `printf()`:
          1. The parent transitions to `WAITING` (blocked) until the child terminates (`exit()`).
          2. The child executes `syscall(SYS_getparentpid)` and its `printf()`.
          3. When the child exits (`ZOMBIE`), `waitpid()` wakes the parent and reaps the child's PCB; the parent then prints `getpid()`.

          > **Why `sleep(1)` is wrong:** `sleep()` is an arbitrary time delay (a race condition). If the child is delayed longer than 1 second, the parent prints first.
      - id: qz-fork-waitpid
        block_type: quiz_question
        question_type: multiple_choice
        title: "Parent / Child Synchronization After fork()"
        question: "In `test_parentpid`, why does calling `waitpid(pid, NULL, 0)` in the parent guarantee that the child's message is always printed before the parent's, unlike `sleep(1)`?"
        options:
          - "waitpid() places the parent in the WAITING state until the child actually terminates, creating a strict causal barrier."
          - "waitpid() temporarily boosts the child's priority above the parent's."
          - "fork() always runs the child first, and waitpid() only prevents the child from becoming an orphan."
          - "waitpid() flushes the child's stdout buffer before returning to the parent."
        correct_answer: "waitpid() places the parent in the WAITING state until the child actually terminates, creating a strict causal barrier."
        explanation: |
          `waitpid(pid, ...)` suspends the parent (`THREAD_STATE_WAITING`) until child `pid` reaches the `ZOMBIE` state (after running its `printf` and calling `exit`). This is exact event-driven synchronization, unlike a fixed timer such as `sleep(1)`.

          * "boosts the child's priority" is wrong: `waitpid()` blocks the parent; it never changes `prio`.
          * "fork() always runs the child first" is wrong: post-`fork()` scheduling order is non-deterministic.
          * "flushes the child's stdout" is wrong: the child flushes its own `stdout` on exit.
        hints:
          - "Which scheduler state does a process enter when blocked on `waitpid()`?"
          - "At what exact moment does `waitpid()` return in the parent?"
        difficulty: 2
        related_block_id: th-fork-order
      - id: fc-fork-returns
        block_type: flashcard
        title: "Return Values of fork()"
        front: "What are the three possible return values of `fork()` and what does each mean?"
        back: |
          * **`< 0` (-1):** Creation failed (no child was created).
          * **`== 0`:** Executing in the **child process** (use `getpid()` / `getparentpid()` to inspect PIDs).
          * **`> 0`:** Executing in the **parent process**; the returned value is the **child's PID**.
        hint: "Think about what the parent needs to track its new child vs. what the child needs."

  - id: sec-3-env-execve
    title: "3. Step 3 — Child Environment & execve() in sh.c"
    blocks:
      - id: th-execve-env
        block_type: markdown
        title: "execv() vs. execve() and Environment Isolation"
        content: |
          By default in `sh.c`, `exec_elf()` called `execv(path, argv)`, which implicitly passes the parent shell's global `extern char **environ;` to the new program.

          To ensure every child process spawned by the shell receives **only** `CHILD=YES` while keeping `MYTEST=OK` in the parent shell:
          ```c
          char *const child_env[] = { "CHILD=YES", NULL };
          execve(path, argv, child_env);
          ```

          ### Key Subtleties
          1. **Why `setenv` must be a builtin (and what happens with `&` or `|`):**
             * Every process has its own `environ`. An external `setenv.elf` binary would only modify its own child `environ` and exit, leaving the parent shell unchanged.
             * In `sh.c`, `run_builtin()` only runs when `ncmd == 1 && !background && cmds[0].in_file == NULL && cmds[0].out_file == NULL`. Typing `setenv MYTEST OK &` or `setenv MYTEST OK | cat` skips `run_builtin()`, enters `run_pipeline()` $\rightarrow$ `exec_elf()`, tries to execute `/setenv.elf`, and prints `setenv: exec failed.`.
          2. **Why the parent shell keeps `MYTEST=OK`:**
             * External commands (including `sh`, which launches `/sh.elf`) go through `run_pipeline()` $\rightarrow$ `fork()` $\rightarrow$ `execve()`. `child_env` only replaces the memory image of the **child process**.
          3. **Why `execve()` is preferred over `clearenv()` + `setenv()`:**
             * `execve()` is the standard POSIX syscall (`man 2 execve`); the kernel copies `envp` directly onto the new user stack (`setup_proc_image_replace()`).
             * `clearenv()` is a non-POSIX GNU/BSD extension that mutates libc's heap after `fork()`.
          4. **Never omit the trailing `NULL`:** `child_env` must be `NULL`-terminated so the kernel knows where `envp` ends.
      - id: ref-env-isolation
        block_type: reflection_rubric
        title: "Synthesis: Parent / Child Isolation with execve"
        prompt: |
          In the modified SO3 shell from Step 3, you run:
          `setenv MYTEST OK` $\rightarrow$ `sh` $\rightarrow$ `env` (prints `CHILD=YES`) $\rightarrow$ `exit` $\rightarrow$ `env`.
          Explain why the final `env` still prints `MYTEST=OK` rather than `CHILD=YES`.
        self_check_criteria:
          - "Stated that `setenv` and `env` are builtins executed directly in the parent shell process (no fork)."
          - "Explained that `sh` launches `/sh.elf` inside a forked child process."
          - "Noted that `execve()` replaces the address space and `environ` only in the child, leaving the parent's memory intact."
        model_answer: |
          When run standalone, `setenv` and `env` are shell builtins executed directly inside the parent shell process: they read and mutate the parent's own `environ` array containing `MYTEST=OK`. When the user runs `sh`, the shell calls `fork()` and then `execve("/sh.elf", argv, child_env)` inside the child process only. `execve()` replaces the child's address space with `CHILD=YES` without touching the parent's isolated memory. Once the child exits, `env` in the parent still sees `MYTEST=OK`.
      - id: qz-exec-variants
        block_type: quiz_question
        question_type: multiple_choice
        title: "Choosing the Right exec* Function for envp"
        question: "Which function in the `exec` family lets you pass an explicit environment array `char *const envp[]` while still passing arguments as an `argv[]` array?"
        options:
          - "execve(path, argv, envp)"
          - "execv(path, argv)"
          - "execl(path, arg0, ..., NULL)"
          - "execvp(file, argv)"
        correct_answer: "execve(path, argv, envp)"
        explanation: |
          Under POSIX conventions (`man 3 exec`), `v` stands for *vector* (`argv[]`), `l` for *list* (variadic arguments), `p` searches `PATH`, and `e` passes an explicit `envp[]` array. `execve(path, argv, envp)` therefore combines `argv[]` with an explicit `envp[]`.

          * `execv` and `execvp` implicitly inherit `environ`.
          * `execl` takes a variadic argument list and also inherits `environ`.
        hints:
          - "What do the suffixes `v`, `l`, `p`, and `e` mean in the `exec*` family?"
          - "Look at the underlying kernel syscall signature in `so3/kernel/process.c`."
        difficulty: 2
        related_block_id: th-execve-env

  - id: sec-4-pipes
    title: "4. Step 4 — Pipelines « | », dup2(), close() & waitpid()"
    blocks:
      - id: th-pipe-mechanics
        block_type: markdown
        title: "Anatomy of a Pipeline `cmd1 | cmd2` in sh.c"
        content: |
          ### 1. Token Splitting & Syntax Errors (`parse_commands`)
          * `parse_commands()` scans `tok[0..n-1]` with a stage index `k` (starting at `0`) into `struct command cmds[]` (`argv`, `argc`, `in_file`, `out_file`, `append`). On `"|"`, it increments `k` and zeroes `cmds[k]`.
          * `| toupper` or `echo hi | | toupper` (consecutive pipes) $\rightarrow$ `cmds[k].argc == 0` immediately inside the loop $\rightarrow$ `sh: syntax error near '|'.` (returns `-1`).
          * `echo hi |` (trailing pipe) $\rightarrow$ loop ends with `cmds[k].argc == 0`, caught by the post-loop check `for (i = 0; i <= k; i++) if (cmds[i].argc == 0)` $\rightarrow$ `sh: syntax error.` (returns `-1`).

          ### 2. Wiring with `pipe()`, `dup2()`, and `close()` (`run_pipeline`)
          To connect stage $i$ to stage $i+1$, the parent creates `pipe(pfd)` (`pfd[0]` = read end, `pfd[1]` = write end):
          * **Child $i$:** if `prev_read != -1`, `dup2(prev_read, STDIN_FILENO)`; if $i < ncmd - 1$, `dup2(pfd[1], STDOUT_FILENO)`. Then close `prev_read`, `pfd[0]`, and `pfd[1]` to prevent FD leaks and avoid holding extra open pipe ends.
          * **Redirection precedence:** `apply_redirections()` runs **after** pipe wiring; for `echo hi > out.txt | toupper`, `dup2(fd, STDOUT_FILENO)` overwrites `pfd[1]`, so `echo` writes to `out.txt` and `toupper` immediately gets `EOF` on `stdin`.
          * **Parent:** closes `pfd[1]` immediately, closes the previous `prev_read` (prevents FD leaks across stages), and saves `prev_read = pfd[0]` for stage $i+1$.
          * **Backgrounding (`cmd1 | cmd2 &`):** `*background = 1` skips the `waitpid()` loop, prints `[<pid>]` with `pids[started - 1]` (the last stage's PID, `cmd2`), and both children are reaped non-blockingly by `reap_children()` (`waitpid(-1, NULL, WNOHANG)`) at the top of the main loop.

          ### 3. The Unix Golden Rule of `close()` (EOF)
          A `read()` on a pipe returns **0 (EOF)** only when **ALL** open write-end file descriptors (`pfd[1]`) for that pipe have been closed in **ALL** processes (including the parent!).
      - id: diag-pipe-fds
        block_type: kroki
        diagram_type: mermaid
        title: "File Descriptor Wiring for cmd1 | cmd2"
        source: |
          flowchart LR
            C1["Child 1 (cmd1): stdout -> pfd[1]"] -->|"Pipe (pfd[1] -> pfd[0])"| C2["Child 2 (cmd2): stdin <- prev_read"]
            P["Parent (sh): close(pfd[1]) required"] -.->|"Otherwise EOF never arrives"| C2
        caption: "After dup2(), each child closes the original FDs (pfd[0], pfd[1], prev_read) and the parent closes pfd[1] immediately."
      - id: qz-pipe-hang
        block_type: quiz_question
        question_type: multiple_choice
        title: "Consequence of Forgetting close(pfd[1]) in the Parent"
        question: "When running `echo \"Hello\" | toupper`, if the parent shell (`sh`) forgets to call `close(pfd[1])` after forking `echo`, what happens?"
        options:
          - "echo prints and exits, but toupper hangs forever in read(STDIN_FILENO, ...) because the parent still holds the write end open."
          - "echo immediately receives SIGPIPE and writes nothing to the pipe."
          - "toupper reads the data twice and then fails with EBADF."
          - "waitpid() returns -ECHILD because the pipe was not closed."
        correct_answer: "echo prints and exits, but toupper hangs forever in read(STDIN_FILENO, ...) because the parent still holds the write end open."
        explanation: |
          An anonymous pipe delivers `EOF` (`read()` returns `0`) to the reader (`toupper`) only when **every** file descriptor referencing the write end (`pfd[1]`) is closed across all processes. Because the parent (`sh`) kept `pfd[1]` open and then blocks in `waitpid()` waiting for `toupper`, `toupper` waits forever for an `EOF` that never arrives (deadlock).

          * `SIGPIPE` only occurs when writing to a pipe whose *read* end is closed, not the reverse.
          * Pipe data is consumed once and never read twice.
        hints:
          - "Under what condition does `read()` on a pipe return `0` (EOF)?"
          - "Who inherits `pfd[1]` on `fork()`, and what does the parent do right after spawning the children?"
        difficulty: 4
        related_block_id: th-pipe-mechanics
      - id: fc-pipe-waitpid
        block_type: flashcard
        title: "waitpid() Order & Pipeline Exit Status"
        front: "In what order does `sh.c` wait for pipeline stages, and what exit status does it return?"
        back: |
          * **Wait order:** **Left-to-right** (`for (i = 0; i < started; i++) waitpid(pids[i], NULL, 0)`). If a downstream stage exits before an upstream stage, the parent waits for the upstream stage first, and subsequent `waitpid` calls on already-zombie stages return immediately.
          * **Return value:** `sh.c` passes `NULL` for `wstatus` and returns `void` (no `$?`). In standard POSIX/bash, a pipeline's exit status is that of the **last command** (unless `pipefail` is enabled).
        hint: "Check the `for` loop at the end of `run_pipeline()` in `so3/usr/src/sh.c`."

  - id: sec-5-sockets-signals
    title: "5. Steps 5 & 6 — TCP Sockets & SIGTSTP (Ctrl+Z) Forfeit"
    blocks:
      - id: th-tcp-and-signals
        block_type: markdown
        title: "TCP Flow (Server/Client) & Async SIGTSTP Handling"
        content: |
          ### 1. TCP Sockets & Input Handling in `battleship.c`
          * **Server:** `socket(AF_INET, SOCK_STREAM, 0)` $\rightarrow$ `setsockopt(SO_REUSEADDR)` $\rightarrow$ `bind()` $\rightarrow$ `listen()` $\rightarrow$ `accept()` $\rightarrow$ **`close(srv_fd)`** (the game serves a single client: closing the listening socket frees the FD and stops accepting new connections).
          * **Client:** `socket(AF_INET, SOCK_STREAM, 0)` $\rightarrow$ `inet_pton()` $\rightarrow$ `connect()`.
          * **Why loop in `socketRecv` / `socketSend`?** TCP is a **byte stream**, not a message-framed protocol: `recv()` or `send()` can transfer fewer than `size` bytes at once. Loop until `total == size` (and return `-1` if `n <= 0`).
          * **Draining `stdin` in `promptCell()`:** `fgets(buf, sizeof(buf), stdin)` reads at most 63 characters. If `strchr(buf, '\n') == NULL`, `while ((c = getchar()) != '\n' && c != EOF);` flushes the rest of the line so leftover characters aren't read as the next move.

          ### 2. Forfeiting with `Ctrl+Z` (`SIGTSTP`)
          When the user presses `Ctrl+Z`, the terminal sends `SIGTSTP` to the process:
          * **Handler `quitGame(int sig)` (async-signal safety):** sets `forfeit = 1`, sends a sentinel byte (`-1`) on `sock_fd` to notify the opponent, and closes `sock_fd`. We intentionally avoid `printf()` and `exit()` inside the handler because `stdio` functions are not *async-signal-safe* (risking deadlocks or buffer corruption); `main()` prints the forfeit message after exiting the loop.
          * **Crucial Trap — `SA_RESTART`:** Register `sigaction(SIGTSTP, &sa, NULL)` with **`sa.sa_flags = 0`** (without `SA_RESTART`). That way, if the process was blocked in `fgets()` or `recv()`, the syscall fails with `EINTR` instead of restarting, breaking out of `while(1)` so `main()` prints `You forfeited the game: YOU LOST T_T`.
          * **`SIGPIPE` protection:** Ignore `SIGPIPE` (`signal(SIGPIPE, SIG_IGN)`) so calling `send()` after the opponent closed the socket returns `-1` (`errno = EPIPE`) instead of killing the process.
      - id: qz-tcp-partial
        block_type: quiz_question
        question_type: multiple_choice
        title: "Behavior of recv() on a TCP Socket"
        question: "Why must `socketRecv(sock_fd, buf, size)` loop with `while (total < size)` and check `n <= 0`?"
        options:
          - "Because TCP is a byte stream without message boundaries (a single recv may return fewer than size bytes), and n == 0 means the peer closed the connection."
          - "Because recv() returns one byte at a time by default in SOCK_STREAM mode."
          - "Because n == 0 means no data is ready yet and the caller must retry."
          - "Because size is capped at 1 byte by the Linux ABI on local sockets."
        correct_answer: "Because TCP is a byte stream without message boundaries (a single recv may return fewer than size bytes), and n == 0 means the peer closed the connection."
        explanation: |
          In TCP (`SOCK_STREAM`), data is a continuous byte stream: if the sender transmits $N$ bytes, `recv()` may deliver them across multiple chunks, so you must loop until `total == size`. On a blocking socket, `recv() == 0` means **EOF** (peer closed the connection), while `< 0` indicates an error (or `EINTR`).

          * "one byte at a time" is wrong: `recv()` returns whatever is available in the kernel buffer up to `size - total`.
          * "no data is ready yet" corresponds to `EAGAIN`/`EWOULDBLOCK` on non-blocking sockets (`n == -1`), never `n == 0`.
        hints:
          - "What is the difference between a byte stream (`SOCK_STREAM`) and datagrams (`SOCK_DGRAM`)?"
          - "What does `recv()` return on a blocking TCP socket when the peer calls `close()`?"
        difficulty: 3
        related_block_id: th-tcp-and-signals
      - id: qz-sigtstp-restart
        block_type: quiz_question
        question_type: multiple_choice
        title: "Role of sa_flags = 0 with SIGTSTP"
        question: "In `battleship.c`, `quitGame()` sets `forfeit = 1`, sends `-1`, and closes `sock_fd` without calling `exit()`. If a player presses `Ctrl+Z` while blocked in `fgets()` (`promptCell()`), why is `sa.sa_flags = 0` (no `SA_RESTART`) essential?"
        options:
          - "So that fgets() / read() is interrupted with EINTR and returns NULL, allowing main() to break out of the game loop."
          - "So that the kernel restarts main() from the beginning."
          - "To prevent SIGTSTP from suspending (STOP) the process in the shell."
          - "So that send() inside the handler can flush stdio buffers."
        correct_answer: "So that fgets() / read() is interrupted with EINTR and returns NULL, allowing main() to break out of the game loop."
        explanation: |
          If `SA_RESTART` is set, the kernel automatically restarts the blocked syscall (`read` under `fgets`) after the signal handler returns: the program would remain stuck waiting for keyboard input instead of ending the game. With `sa_flags = 0`, `read()` returns `-1` (`EINTR`), `promptCell()` returns `-1`, `main()` exits `while(1)`, and prints the forfeit message.

          * Installing a custom handler already overrides `SIG_DFL` (which stops the process), regardless of `SA_RESTART`.
        hints:
          - "What does `SA_RESTART` do when a signal interrupts a slow syscall like `read()` or `recv()`?"
          - "How can `main()` reach `if (forfeit)` if it was blocked inside `promptCell()`?"
        difficulty: 4
        related_block_id: th-tcp-and-signals
      - id: fc-so-reuseaddr
        block_type: flashcard
        title: "Role of SO_REUSEADDR on a TCP Server"
        front: "Why do we call `setsockopt(srv_fd, SOL_SOCKET, SO_REUSEADDR, ...)` before `bind()` in a TCP server?"
        back: |
          When a server closes its connection first, the socket lingers briefly in TCP **`TIME_WAIT`**. Without `SO_REUSEADDR`, immediately restarting the server on the same port (`5000`) fails with `bind: Address already in use` (`EADDRINUSE`).
        hint: "Which TCP state follows an active close?"

  - id: sec-6-renice-sched
    title: "6. Step 7 — renice() Syscall & Static Priority Scheduling"
    blocks:
      - id: th-sched-prio
        block_type: markdown
        title: "CONFIG_SCHED_PRIO Scheduler & Starvation"
        content: |
          In `so3/kernel/schedule.c`, when `CONFIG_SCHED_PRIO=y` is enabled in `so3/so3/.config`, `next_thread()` picks the ready thread with the **highest** numeric priority (default priority: `10`):
          ```c
          else if (tcb->prio > tcb_to_schedule->prio)
              tcb_to_schedule = tcb;
          ```

          ### `.config` Pitfall & Equal-Priority Behavior (`>`)
          * **Forgetting `CONFIG_SCHED_PRIO=y`:** If `CONFIG_SCHED_RR=y` remains enabled in `so3/so3/.config`, `renice` still updates `tcb->prio` without error, but the Round-Robin `next_thread()` completely ignores `prio` and schedules threads in RR order.
          * **Equal priorities under `CONFIG_SCHED_PRIO`:** Because `tcb->prio > tcb_to_schedule->prio` is a **strict `>`**, two continuous `time_loop &` processes at equal priority (`10 == 10`) do **not** preempt each other in round-robin on timer ticks: the running thread keeps the CPU until it blocks or exits.

          ### Implementing `renice(pid, prio)`
          * Priority lives on the **thread** (`tcb_t->prio` in `thread.h`), not directly on `pcb_t`.
          * `prio == 0` is rejected with **`-EINVAL`** because `thread.h` reserves `0` to mean "use default priority (`THREAD_PRIO_DEFAULT = 10`)"; explicit priorities start at `1`.
          * `renice(pid, prio)` wraps `find_proc_by_pid(pid)` and updates `pcb->main_thread->prio` + `pcb->threads` inside **`local_irq_save()` / `local_irq_restore()`** to prevent timer/scheduler interrupts from preempting or mutating lists mid-update.

          ### Continuous Mode (`time_loop &`) vs. Blocking Mode (`time_loop b &`)
          1. **`time_loop &` (continuous — busy-waiting on `gettimeofday`):**
             * Never blocks; stays `READY` or `RUNNING` 100% of the time.
             * Lowering the shell (`PID 1`) below `10` (`renice 1 5`) leaves `time_loop` with strictly higher priority (`10 > 5`).
             * **Result: total shell starvation.** No shell commands run until `time_loop` finishes all 30 iterations.
          2. **`time_loop b &` (blocking — `usleep(1000000)`):**
             * Each iteration puts `time_loop` into `THREAD_STATE_WAITING` (removed from `readyThreads`).
             * Even with lower priority (`5 < 10`), the shell runs normally while `time_loop` sleeps; when the timer wakes `time_loop`, it briefly preempts to print its counter and goes back to sleep.
