      - id: qz-renice-starvation
        block_type: quiz_question
        question_type: multiple_choice
        title: "Diagnosing Starvation Under CONFIG_SCHED_PRIO"
        question: |
          Under `CONFIG_SCHED_PRIO=y`, the shell (`PID 1`) has its priority lowered to `5` via `renice 1 5`. You then launch `time_loop &` (default priority `10`, continuous mode without `b`) and type `ls` in the shell. What happens and why?
        options:
          - "The shell is completely starved until time_loop finishes its 30 seconds, because time_loop stays ready with prio 10 > 5."
          - "ls runs immediately on the next timer tick (30 ms) thanks to periodic preemption."
          - "time_loop and the shell share the CPU equally because the shell handles keyboard interrupts."
          - "time_loop stops automatically after 1 second because the shell is PID 1."
        correct_answer: "The shell is completely starved until time_loop finishes its 30 seconds, because time_loop stays ready with prio 10 > 5."
        explanation: |
          Even though the serial (keyboard) IRQ wakes the shell and places it on `readyThreads`, `next_thread()` compares the running thread (`time_loop`, `prio = 10`) against the shell (`prio = 5`). Because `10 > 5` and continuous `time_loop` never blocks (busy-waiting on `gettimeofday`), the shell never wins the CPU until `time_loop` exits.

          * Periodic timer preemption (30 ms) invokes `schedule()`, but `next_thread()` still picks `time_loop` (prio 10).
          * `PID 1` has no special scheduling privilege over other processes.
        hints:
          - "In continuous mode, does `time_loop` ever leave `RUNNING` / `READY`?"
          - "In `next_thread()`, what condition decides which thread gets the CPU on each timer tick?"
        difficulty: 4
        related_block_id: th-sched-prio
      - id: fc-tcb-prio
        block_type: flashcard
        title: "Where Priority Lives in the SO3 Kernel"
        front: "In the SO3 kernel, which struct holds the `prio` field used by `CONFIG_SCHED_PRIO`, and how must `renice(pid, prio)` update it?"
        back: |
          `uint32_t prio` belongs to **`tcb_t`** (`struct tcb` in `include/thread.h`), not `pcb_t`.
          `renice(pid, prio)` must look up the `pcb_t` via `find_proc_by_pid(pid)` and update **`pcb->main_thread->prio`** as well as every secondary thread in `pcb->threads` (under `local_irq_save()` / `local_irq_restore()`).
        hint: "The SO3 scheduler schedules threads (`tcb_t`), not `pcb_t` directly."
