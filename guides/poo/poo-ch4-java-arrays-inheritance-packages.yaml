sections:
  - id: sec-arrays
    title: "1. Arrays (Tableaux), Reference Semantics & Varargs (Ellipse)"
    blocks:
      - id: md-arrays-fundamentals
        block_type: markdown
        title: "Arrays as Objects, 3-Step Creation & Varargs"
        content: |
          In Java, an **array** (*tableau*) is a full-fledged **object** on the heap:
          - It implicitly inherits from `java.lang.Object`.
          - Its fixed capacity is exposed via the public `final` attribute **`length`** (a field, *not* a method like `String.length()`).
          - All elements share the **same declared type** (either a primitive type or an object reference type).
          - Elements are indexed from `0` to `length - 1` using `ref[i]`, which behaves like any normal variable or reference (e.g., `ref[i].method()`). Accessing an out-of-range index throws `ArrayIndexOutOfBoundsException`.

          ### General 3-Step Array Lifecycle (*Déclaration générale*)
          1. **Declare the reference:** `Type[] ref;` (preferred Java style) or `Type ref[];` (C-style, valid but discouraged). No array exists yet.
          2. **Instantiate the array object:** `ref = new Type[size];` allocates a contiguous block of `size` slots on the heap:
             - **Primitive arrays** (*tableaux de types primitifs*): every slot is initialized to its default value (`0` for `int`/`long`/`short`/`byte`, `0.0` for `double`/`float`, `false` for `boolean`, `'\u0000'` for `char`). After `int[] a = new int[10];`, `a[0]` is `0`.
             - **Object arrays** (*tableaux d'objets*): creating the array **does NOT instantiate the elements**! Every slot is initialized to `null`. After `Person[] p = new Person[10];`, `p[0]` is `null` — calling `p[0].toString()` immediately throws `NullPointerException`.
          3. **Populate the elements:** assign primitive values (`a[4] = 2000;`) or instantiate/assign objects (`p[0] = new Person("Ada");`).

          > [!WARNING]
          > **Reference Aliasing:** Because an array variable holds a *reference* to the heap array object, writing `int[] b = a;` does **not** copy the array — both `a` and `b` point to the exact same array in memory. Mutating `b[0]` immediately mutates `a[0]`.

          ### Simplified & On-the-Fly Initialization (*Déclaration simplifiée & « à la volée »*)
          When elements are known upfront, you may use brace notation **only at declaration time**:
          - `double[] scores = { 1.2, 12.33, 33 };`
          - `String[] rgb = { "rouge", "vert", "bleu" };`
          - `int[][] matrix = { { 2, 3 }, { 3, 4 }, { 5, 6 } };`
          - `Integer[] boxed = { Integer.valueOf(1), Integer.valueOf(12) };` *(prefer `Integer.valueOf(...)` over the deprecated `new Integer(...)`)*.

          To pass an array **on the fly** (*à la volée*) as a method argument (or reassign an existing array variable), brace-only syntax is a **compile-time error** because the compiler cannot infer the type unambiguously:
          - Invalid: `notes.setGrades({ 4, 2.5f, 3 });`
          - Valid: `notes.setGrades(new float[] { 4, 2.5f, 3 });`

          ### Multidimensional & Ragged Arrays (*Tableaux multidimensionnels*)
          Java represents a 2D array `String[][] matrix = new String[5][10];` as an **array of references to 1D arrays**. Consequently, rows do not even need to have the same length (**ragged / jagged arrays**):
          - `int[][] ragged = { { 1, 2, 3 }, { 4 }, { 5, 6 } };` -> `ragged.length == 3`, `ragged[0].length == 3`, `ragged[1].length == 1`.

          ### `main()` Arguments & Ellipsis / Varargs (*Ellipse `...`*)
          - The entry point `public static void main(String[] args)` receives command-line arguments in `args`. Running `java Test un deux trois` sets `args[0] = "un"`, `args[1] = "deux"`, `args[2] = "trois"` (unlike C/C++, the program name is **not** in `args[0]`).
          - **Varargs** (*ellipse*): `ReturnType method(FixedType x, ElementType... args)` accepts zero or more arguments of `ElementType` and packages them into an array `ElementType[]` inside the method body.
            - Unlike C's untyped `...`, Java varargs are **strongly typed**.
            - The varargs parameter **must be the last parameter** in the method signature (at most one per method).
            - `main` can therefore also be written `public static void main(String... args)`.

