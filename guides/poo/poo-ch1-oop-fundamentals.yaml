sections:
  - id: sec-paradigms-and-history
    title: "1. Programming Paradigms & OOP History"
    blocks:
      - id: th-paradigms-taxonomy
        block_type: markdown
        title: "Programming Paradigms & the Evolution of OOP"
        bookmarkable: true
        content: |
          Before diving into classes and objects, it helps to situate **Object-Oriented Programming (OOP / *Programmation orientée objet*)** within the broader landscape of **programming paradigms (*paradigmes de programmation*)**.

          Programming languages fall into three main families:

          | Paradigm Family | Sub-Paradigms | Representative Languages | Core Mental Model |
          | :--- | :--- | :--- | :--- |
          | **Machine Language** (*Langage machine*) | Assembly (*Assembleur*) | x86, ARM Assembly | Direct hardware instructions operating on registers and memory addresses |
          | **Imperative Programming** (*Programmation impérative*) | Unstructured (*Non structurée*) → Procedural (*Procédurale*) → Object-Oriented (*Orientée objet*) | Fortran, Basic → C, Pascal → C++, Java | Explicit sequences of statements that mutate program state |
          | **Declarative Programming** (*Programmation déclarative*) | Logic (*Logique*), Functional (*Fonctionnelle*), Data Manipulation (*Manipulation de données*) | Prolog, Lisp, Haskell, SQL | Describe *what* result is desired rather than step-by-step control flow |

          > [!IMPORTANT]
          > **Key Exam Distinction:** OOP is **not** a declarative paradigm—it is the direct **evolution (*évolution*)** of **imperative programming (*programmation impérative*)**:
          >
          > $$\text{Unstructured (Fortran, Basic)} \;\longrightarrow\; \text{Procedural (C, Pascal)} \;\longrightarrow\; \text{Object-Oriented (C++, Java)}$$
          >
          > Procedural languages organized code into procedures operating on separate data structures; OOP unified data and the operations acting on that data into self-contained **objects**.

