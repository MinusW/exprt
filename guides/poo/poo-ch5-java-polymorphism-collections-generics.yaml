      - id: code-instanceof-class-traps
        block_type: code
        language: java
        filename: TypeCheckTraps.java
        title: "instanceof Compile-Time vs. Runtime Traps, Array Covariance & Class"
        code: |
          class Color {}
          class Red extends Color {}
          class Blue extends Color {}

          public class TypeCheckTraps {
              public static void main(String[] args) {
                  Color c = new Blue();
                  Red r = new Red();
                  System.out.println(c instanceof Red);   // false (compiles: Red extends Color)
                  // System.out.println(r instanceof Blue); // COMPILE ERROR: incompatible types
                  Integer[] ints = new Integer[5];
                  System.out.println(ints instanceof Object[]); // true (arrays are covariant)
                  // System.out.println(ints instanceof String[]); // COMPILE ERROR
                  Object o = ints;
                  System.out.println(o instanceof String[]);    // false (compiles via Object)
                  System.out.println(c.getClass() == Color.class); // false (exact class is Blue)
                  System.out.println(c.getClass() == Blue.class);  // true
              }
          }
        highlight_lines: [9, 10, 12, 15, 16]
        annotations:
          - line: 9
            note: "Compiles because Red is a subclass of c's static type Color; evaluates to false at runtime."
          - line: 10
            note: "Compile-time error! Red and Blue are unrelated sibling classes."
          - line: 12
            note: "Java arrays are covariant: Integer[] is a subtype of Object[] (and of Object)."
          - line: 15
            note: "Upcasting to Object satisfies the compiler; runtime check cleanly returns false."
          - line: 16
            note: "getClass() tests exact instantiation class (Blue.class), never superclasses."

      - id: sb-polymorphic-dispatch
        block_type: sandbox
        runtime: java
        title: "Lab 1: Polymorphic Roster Filter & Exact Instance Counter"
        instructions: |
          Complete `Main.java` to practice **dynamic binding**, **pattern matching for `instanceof`**, and **exact class counting** (combining the StarWars and `printInstancesCount` exercises from slides 61 & 76):
          1. In `printGreenSabers(Humanoid[] roster)`, print the `name` of every `Jedi` whose `saberColor` equals `"green"` using pattern matching `if (h instanceof Jedi j && ...)`.
          2. In `countExactTypes(Object[] items)`, count how many objects have exact runtime class `Humanoid.class`, `Jedi.class`, and `Sith.class` (using `getClass() == ...`, NOT `instanceof`) and print `"Humanoid: X, Jedi: Y, Sith: Z"`.
        starter_code: |
          class Humanoid {
              String name;
              Humanoid(String name) { this.name = name; }
          }
          class Jedi extends Humanoid {
              String saberColor;
              Jedi(String name, String saberColor) {
                  super(name);
                  this.saberColor = saberColor;
              }
          }
          class Sith extends Humanoid {
              Sith(String name) { super(name); }
          }

          public class Main {
              static void printGreenSabers(Humanoid[] roster) {
                  // TODO: Use pattern matching instanceof to print names of Jedi with "green" saber
              }

              static void countExactTypes(Object[] items) {
                  // TODO: Count exact runtime classes using getClass() == ...
                  // Print: "Humanoid: X, Jedi: Y, Sith: Z"
              }

              public static void main(String[] args) {
                  Humanoid[] roster = {
                      new Humanoid("Paul"),
                      new Jedi("Yoda", "green"),
                      new Jedi("Obi-Wan", "blue"),
                      new Jedi("Luke", "green"),
                      new Sith("Darth Vader")
                  };
                  printGreenSabers(roster);
                  countExactTypes(roster);
              }
          }
        solution: |
          class Humanoid {
              String name;
              Humanoid(String name) { this.name = name; }
          }
          class Jedi extends Humanoid {
              String saberColor;
              Jedi(String name, String saberColor) {
                  super(name);
                  this.saberColor = saberColor;
              }
          }
          class Sith extends Humanoid {
              Sith(String name) { super(name); }
          }

          public class Main {
              static void printGreenSabers(Humanoid[] roster) {
                  for (Humanoid h : roster) {
                      if (h instanceof Jedi j && "green".equals(j.saberColor)) {
                          System.out.println(j.name);
                      }
                  }
              }

              static void countExactTypes(Object[] items) {
                  int humanoids = 0, jedis = 0, siths = 0;
                  for (Object item : items) {
                      if (item.getClass() == Humanoid.class) humanoids++;
                      else if (item.getClass() == Jedi.class) jedis++;
                      else if (item.getClass() == Sith.class) siths++;
                  }
                  System.out.println("Humanoid: " + humanoids + ", Jedi: " + jedis + ", Sith: " + siths);
              }

              public static void main(String[] args) {
                  Humanoid[] roster = {
                      new Humanoid("Paul"),
                      new Jedi("Yoda", "green"),
                      new Jedi("Obi-Wan", "blue"),
                      new Jedi("Luke", "green"),
                      new Sith("Darth Vader")
                  };
                  printGreenSabers(roster);
                  countExactTypes(roster);
              }
          }
        expected_output: |
          Yoda
          Luke
          Humanoid: 1, Jedi: 3, Sith: 1
        hints:
          - "In `printGreenSabers`, write `if (h instanceof Jedi j && \"green\".equals(j.saberColor))` so you never need an explicit cast."
          - "In `countExactTypes`, `item instanceof Humanoid` would count Jedi and Sith too! Use `item.getClass() == Humanoid.class` to match only exact `Humanoid` instances."

  - id: sec-autoboxing-io
    title: "3. Autoboxing, Unboxing & Standard I/O"
    description: >-
      Understand wrapper classes, the Integer cache identity trap (-128 to 127),
      autoboxing performance overhead, and standard streams (System.out,
      System.err, System.in with Scanner).
    blocks:
      - id: th-autoboxing-unboxing
        block_type: markdown
        title: "Autoboxing, Unboxing & The Integer Cache Trap"
        content: |
          Primitive values (`int`, `double`, `boolean`, ...) are **not objects** in Java. Each primitive has an immutable **wrapper class** (*classe enrobeur*): `Integer`, `Double`, `Long`, `Boolean`, `Character`, etc.

          - **Autoboxing:** Automatic conversion from primitive $\rightarrow$ wrapper object.
            `Integer obj = 1;` is compiled to `Integer obj = Integer.valueOf(1);`.
          - **Unboxing:** Automatic conversion from wrapper object $\rightarrow$ primitive.
            `int i = obj;` is compiled to `int i = obj.intValue();`.

          ### Exam Trap 1: Wrapper Caching (`-128` to `127`) & `==` vs. `.equals()`
          Because wrapper objects are immutable, `Integer.valueOf(int)` **caches** a single shared instance for values in **`[-128, 127]`** (at minimum). Outside that range, each autoboxing allocates a **new** object on the heap!
          - Comparing `wrapper == primitive` triggers **unboxing** (value comparison $\rightarrow$ `true` for any equal number).
          - Comparing `wrapper1 == wrapper2` (or `wrapper == object`) compares **object references** (memory addresses)! It returns `true` for `1` (cached) and **`false` for `1000`** (two distinct `Integer` objects).
          - **Rule:** Always compare wrapper values with `.equals()`, never `==`.

          ### Exam Trap 2: Performance & `NullPointerException`
          Autoboxing is **not free**. Using `Long sum = 0L;` inside a tight loop (`sum += i;`) unboxes `sum`, adds `i`, and allocates a brand-new `Long` object on every iteration—roughly **5× slower** than primitive `long sum = 0L;`. Furthermore, unboxing a `null` wrapper reference throws a `NullPointerException` at runtime.

      - id: code-autoboxing-traps
        block_type: code
        language: java
        filename: AutoboxingTraps.java
        title: "Autoboxing Identity, Caching & Performance Pitfalls"
        code: |
          public class AutoboxingTraps {
              public static void main(String[] args) {
                  Object[] mixed = { 1, 2.4, 4.0 / 2 }; // Integer, Double, Double
                  Integer a = 1;
                  int val = a;                          // unboxing
                  Object obj = val;                     // autoboxing -> cached Integer(1)
                  System.out.println(a == 1);           // true (unboxing)
                  System.out.println(a == obj);         // true for 1, FALSE for 1000!
                  System.out.println(a == Integer.valueOf(1)); // true (cached)
                  Integer x = 1000, y = 1000;
                  System.out.println(x == y);           // false (outside -128..127 cache)
                  System.out.println(x.equals(y));      // true (value equality)
              }
          }
        highlight_lines: [3, 7, 8, 11, 12]
        annotations:
          - line: 3
            note: "4.0 / 2 evaluates to double 2.0, which autoboxes to java.lang.Double, not Integer."
          - line: 7
            note: "Comparing Integer to primitive int unboxes a, performing numeric equality."
          - line: 8
            note: "Both point to the same cached Integer(1) instance; fails if the value is 1000."
          - line: 11
            note: "1000 is outside the [-128, 127] cache, so x and y reference two distinct heap objects."
          - line: 12
            note: "Always use .equals() to compare wrapper object values safely."

      - id: th-standard-io
        block_type: markdown
        title: "Standard Output (PrintStream) & Standard Input (Scanner)"
        content: |
          ### Standard Output & Error (`System.out`, `System.err`)
          `System.out` and `System.err` are static `PrintStream` fields offering:
          - Overloaded `print()` and `println()` for primitives, `String`, and `Object`.
          - C-style `printf(String format, Object... args)` accepting a variable number of arguments (*varargs*).
          - **Automatic conversion:** When `%s` or `println(obj)` expects a `String`, Java invokes `obj.toString()` (via dynamic binding), and primitive arguments passed to `Object... args` are automatically **autoboxed**:
            ```java
            for (int i = 0; i < tableau.length; ++i)
                System.out.printf("%2d : %s\n", i, tableau[i]); // i autoboxed to Integer; tableau[i].toString() called
            ```

          ### Standard Input (`System.in` + `Scanner`)
          `System.in` is a raw `InputStream` (byte-oriented). Wrap it in `java.util.Scanner` to parse tokens and primitives:
          ```java
          Scanner sin = new Scanner(System.in);
          String word = sin.next();      // reads next whitespace-delimited token
          String line = sin.nextLine();  // reads remainder of the current line (watch for leftover '\n'!)
          int sum = 0;
          while (sin.hasNextInt())
              sum += sin.nextInt();
          ```

  - id: sec-collections-framework
    title: "4. Encapsulation, The Java Collections Framework & Iterators"
    description: >-
      Protect internal arrays and collections from encapsulation leaks, master
      the Java 21 Collections hierarchy (Collection, List, Set, Map,
      SequencedCollection), avoid C++ false friends, and iterate safely.
    blocks:
      - id: th-arrays-and-encapsulation
        block_type: markdown
        title: "Arrays vs. Collections & Encapsulation Leaks"
        content: |
          - **Arrays** (*tableaux*): fast indexed access and native support for primitives, **but fixed size**. Utility class `java.util.Arrays` provides static helpers such as `Arrays.sort(array)` and `Arrays.equals(a, b)`.
          - **Collections** (`java.util`): dynamic size (lists, sets, maps), **but store object references only** (primitives must be boxed, e.g., `collection.add(2)` autoboxes to `Integer`).

          ### Critical Encapsulation Trap
          Arrays and collections are **mutable heap objects**. Returning a direct reference to a `private` array or collection destroys encapsulation:
          ```java
          public class Holder {
              private int[] array = { 1, 2, 3 };
              public int[] getArray() { return array; } // LEAK! Caller can do h.getArray()[2] = 66;
          }
          ```
          **Three Safe Solutions:**
          1. **Expose element accessors** instead of the backing container: `int getElement(int i) { return array[i]; }`.
          2. **Return a defensive copy** (e.g., `Arrays.copyOf(array, array.length)` or `new ArrayList<>(list)`).
          3. **Return an unmodifiable view:** `Collections.unmodifiableCollection(c)` / `Collections.unmodifiableList(list)` (throws `UnsupportedOperationException` on mutation attempts).

      - id: th-collections-types-and-cpp
        block_type: markdown
        title: "Collections Interfaces, Java 21 SequencedCollection & C++ Comparison"
        content: |
          ### Core `Collection` Contract
          Implemented by lists and sets (but **NOT** by `Map`!):
          - `boolean add(E o)` / `boolean remove(Object o)`
          - `int size()` / `boolean contains(Object o)`
          - `Iterator<E> iterator()` (inherited from `Iterable<E>`)

          ### Lists, Sets, Maps & Java 21 `SequencedCollection`
          - **`ArrayList`** (extensible array): $O(1)$ indexed access (`get(i)`), slow middle insertions/removals ($O(n)$ shifting).
          - **`LinkedList`** (doubly linked list): $O(1)$ head/tail insertions/removals and optimal sequential traversal, slow indexed access ($O(n)$). Also provides `listIterator()` returning a bidirectional `ListIterator`.
          - **`Set`** (no duplicates): `HashSet` (unordered, $O(1)$ average), `LinkedHashSet` (insertion-ordered), `TreeSet` (sorted).
          - **`Map`** (key-value dictionary, separate hierarchy): `HashMap` (unordered), `LinkedHashMap` (insertion-ordered), `TreeMap` (sorted by key).
          - **Java 21 `SequencedCollection` & `SequencedMap`:** Unified interfaces for collections with a well-defined encounter order (implemented by `List`, `LinkedHashSet`, `TreeSet`, etc.; *not* `HashSet`/`HashMap`):
            - `addFirst(e)` / `addLast(e)`
            - `getFirst()` / `getLast()`
            - `removeFirst()` / `removeLast()`
            - `reversed()` (returns a reversed view)

          ### C++ Containers vs. Java Collections ("False Friends" / *Faux amis*)
          | Concept | C++ (`std::`) | Java (`java.util`) |
          | :--- | :--- | :--- |
          | Resizable array | `std::vector<T>` | `ArrayList<T>` *(not `Vector`)* |
          | Doubly linked list | `std::list<T>` | `LinkedList<T>` |
          | Hash set / Ordered set | `std::unordered_set` / `std::set` | `HashSet` / `TreeSet` |
          | Hash map / Ordered map | `std::unordered_map` / `std::map` | `HashMap` / `TreeMap` |

          **Two Deep Architectural Differences:**
          1. **Values vs. References:** C++ containers store objects or primitive values directly by value (or pointers); Java collections store **only object references**.
          2. **Templates vs. Interfaces:** C++ uses compile-time **templates** (duck typing, no shared base interface across containers); Java defines polymorphic **interfaces** (`Collection`, `List`, `Set`, `Map`) shared by multiple implementations.

      - id: diag-collections-hierarchy
