      - id: th-iterators-foreach
        block_type: markdown
        title: "Iterators & Enhanced For-Each Loops"
        content: |
          An **`Iterator`** starts **before the first element** of a collection and exposes three methods:
          - `boolean hasNext()` — returns `true` if more elements remain.
          - `E next()` — advances and returns the next element.
          - `void remove()` — removes the element last returned by `next()`.

          > [!CAUTION]
          > **Never modify a collection directly while iterating over it** (e.g., calling `list.remove(x)` inside a `while (it.hasNext())` or `for-each` loop triggers `ConcurrentModificationException`). Always use **`it.remove()`**!

          ### Simplified Iteration (`for-each`)
          Syntax: `for (Type element : expression) { ... }` works on both **arrays** and any object implementing **`Iterable<E>`** (which requires `public Iterator<E> iterator()`).
          - Eliminates explicit `Iterator` boilerplate and index errors.
          - **Restriction:** You still need an explicit `Iterator` to remove elements from a collection during traversal, or an index `i` to overwrite slots in an array.

      - id: fc-collections-comparison
        block_type: flashcard
        title: "Collections Comparison & C++ False Friends"
        front: "Compare `ArrayList`, `LinkedList`, `HashSet`, and `HashMap` in Java—and name the C++ STL equivalents of `ArrayList` and `LinkedList`."
        back: |
          - **`ArrayList`** (C++ `std::vector`): Extensible array; $O(1)$ indexed `get(i)`, $O(n)$ middle insert/remove.
          - **`LinkedList`** (C++ `std::list`): Doubly linked list; $O(1)$ head/tail insert/remove & sequential traversal, $O(n)$ indexed access; offers `ListIterator`.
          - **`HashSet`**: Unordered `Set` (no duplicates, does **not** implement `SequencedCollection`).
          - **`HashMap`**: Unordered key-value `Map` (separate hierarchy; does **not** extend `Collection`).
        hint: "Watch out for the C++ false friend `std::vector` vs `std::list`."
        tags:
          - collections
          - cpp-vs-java
          - complexity

  - id: sec-generics
    title: "5. Generics, Type Erasure, Bounds & Custom Linked Lists"
    description: >-
      Eliminate raw-type casts with Java Generics, understand type erasure vs.
      C++ templates, generics invariance, bounded type parameters, generic
      methods, and custom generic iterators.
    blocks:
      - id: th-raw-vs-generic
        block_type: markdown
        title: "Why Raw Types Are Dangerous & Generic Collections"
        content: |
          Without generics, a collection such as `LinkedList list = new LinkedList();` is a **raw type** (*type brut*), effectively storing `Object` references:
          - You can accidentally mix `Person`, `String`, and `Integer` in the same list.
          - Every retrieval requires a manual cast (`((Person) o).print()`), shifting type errors from compile time to runtime `ClassCastException`.
          - **Rule:** Never use raw collections! If you genuinely need a heterogeneous collection, declare `LinkedList<Object>` explicitly.

          ### Generic Collections & the Diamond Operator (`<>`)
          ```java
          List<String> list = new LinkedList<>(); // diamond operator infers <String>
          list.add("One");
          // list.add(new Person("John"));        // COMPILE ERROR! Caught immediately
          String s = list.get(0);                 // No cast needed
          ```
          Generic types work seamlessly as method parameters and return types (`public List<String> getNames()`).

      - id: th-type-erasure-bounds-invariance
        block_type: markdown
        title: "Type Erasure, Bounded Parameters & Generics Invariance"
        content: |
          ### Type Erasure (*Effacement de type*) vs. C++ Templates
          - In **C++**, instantiating `std::vector<int>` and `std::vector<std::string>` compiles **two separate classes** in machine code.
          - In **Java**, a generic class/interface (`interface List<E>`) is compiled **once** into a **single `.class` file**. The compiler checks all generic types at compile time, inserts invisible casts where needed, and **erases** the type parameter—replacing `E` with `Object` (or with its upper bound if bounded).

          ### Bounded Type Parameters (`<T extends Type>`)
          Restricting a type parameter to a class hierarchy unlocks calling the supertype's methods inside the generic class:
          ```java
          class PersonList<T extends Person> {
              // T is guaranteed to be Person or a subclass of Person
              // Inside this class, you can call Person methods on T instances!
          }
          ```

          ### Generics Invariance (vs. Array Covariance)
          Even though `Student extends Person`:
          - **Arrays are covariant:** `Student[]` **is** a subtype of `Person[]` (so `Person[] arr = new Student[2];` compiles, but `arr[0] = new Sportsman(...);` fails at runtime with `ArrayStoreException`).
          - **Generics are invariant:** `List<Student>` is **NOT** a subtype of `List<Person>`! Allowing `List<Person> lp = new ArrayList<Student>();` would let you call `lp.add(new Sportsman(...))`, corrupting the `Student` list without a compile error. To accept any list of `Person` subtypes for reading, Java uses wildcards: `List<? extends Person>`.

      - id: th-generic-methods-simplelist
        block_type: markdown
        title: "Multi-Parameter Generics, Generic Methods & SimpleList"
        content: |
          A class can take multiple type parameters (e.g., `Pair<T, U>`). Likewise, individual **generic methods** (*méthodes génériques*) declare their own type parameter(s) in `<...>` before the return type—and the compiler **automatically infers** the type argument from the call site:

          ```java
          public <V> Pair<T, V> merge(Pair<U, V> other) {
              if (second.equals(other.first))
                  return new Pair<>(first, other.second);
              return new Pair<>(null, null);
          }
          ```

          ### Design Pattern: Encapsulated `SimpleList<T>` & `Examinator<T>`
          To build a custom singly linked list without leaking internal nodes:
          - Place `Element<T>` (holding `T data; Element<T> next;`) as a **package-private** class (or private static nested class) so external callers cannot manipulate pointers.
          - Keep `private Element<T> head;` inside `public class SimpleList<T>`.
          - Provide `public Examinator<T> examinator()` returning an iterator holding `private Element<T> current;` with `hasNext()`, `next()`, and `remove()`.

      - id: code-generics-pair-merge
        block_type: code
        language: java
        filename: PairDemo.java
        title: "Multi-Parameter Generic Class & Generic Method Type Inference"
        code: |
          class Pair<T, U> {
              private final T first;
              private final U second;
              public Pair(T first, U second) {
                  this.first = first;
                  this.second = second;
              }
              public T first() { return first; }
              public U second() { return second; }
              public <V> Pair<T, V> merge(Pair<U, V> other) {
                  if (second.equals(other.first))
                      return new Pair<>(first, other.second);
                  return new Pair<>(null, null);
              }
              public String toString() { return "(" + first + ", " + second + ")"; }
          }

          public class PairDemo {
              public static void main(String[] args) {
                  Pair<Integer, String> p1 = new Pair<>(10, "Key");
                  Pair<String, Double> p2 = new Pair<>("Key", 3.14);
                  Pair<Integer, Double> merged = p1.merge(p2);
                  System.out.println(merged);
              }
          }
        highlight_lines: [1, 10, 20, 22]
        annotations:
          - line: 1
            note: "Two type parameters T and U; compiled once into a single Pair.class via type erasure."
          - line: 10
            note: "Generic method declaring its own type parameter <V> before the return type Pair<T, V>."
          - line: 20
            note: "Primitive 10 is autoboxed to Integer; diamond <> infers <Integer, String>."
          - line: 22
            note: "Compiler automatically infers V = Double from p2 without writing p1.<Double>merge(p2)."

      - id: sb-generics-iterator
        block_type: sandbox
        runtime: java
        title: "Lab 2: Generic Pair.merge() & Safe Iterator.remove()"
        instructions: |
          Complete `Main.java` to combine **Generics** and **safe `Iterator` mutation**:
          1. Implement the generic method `<V> Pair<T, V> merge(Pair<U, V> other)` inside `Pair<T, U>`: if `this.second.equals(other.first)`, return `new Pair<>(this.first, other.second)`, otherwise `new Pair<>(null, null)`.
          2. In `removeNegatives(List<Integer> nums)`, remove all negative integers (`< 0`) using an `Iterator<Integer>` and `it.remove()` (do NOT call `nums.remove(...)` inside a `for-each` loop!).
        starter_code: |
          import java.util.*;

          class Pair<T, U> {
              final T first;
              final U second;
              Pair(T first, U second) { this.first = first; this.second = second; }

              public <V> Pair<T, V> merge(Pair<U, V> other) {
                  // TODO: Merge if this.second.equals(other.first), else return Pair(null, null)
                  return new Pair<>(null, null);
              }

              public String toString() { return "(" + first + ", " + second + ")"; }
          }

          public class Main {
              static void removeNegatives(List<Integer> nums) {
                  // TODO: Use Iterator<Integer> and it.remove() to remove all elements < 0
              }

              public static void main(String[] args) {
                  Pair<Integer, String> p1 = new Pair<>(10, "Key");
                  Pair<String, Double> p2 = new Pair<>("Key", 3.14);
                  System.out.println(p1.merge(p2));

                  List<Integer> nums = new ArrayList<>(Arrays.asList(5, -2, 8, -9, 0, 3));
                  removeNegatives(nums);
                  System.out.println(nums);
              }
          }
        solution: |
          import java.util.*;

          class Pair<T, U> {
              final T first;
              final U second;
              Pair(T first, U second) { this.first = first; this.second = second; }

              public <V> Pair<T, V> merge(Pair<U, V> other) {
                  if (this.second.equals(other.first)) {
                      return new Pair<>(this.first, other.second);
                  }
                  return new Pair<>(null, null);
              }

              public String toString() { return "(" + first + ", " + second + ")"; }
          }

          public class Main {
              static void removeNegatives(List<Integer> nums) {
                  Iterator<Integer> it = nums.iterator();
                  while (it.hasNext()) {
                      if (it.next() < 0) {
                          it.remove();
                      }
                  }
              }

              public static void main(String[] args) {
                  Pair<Integer, String> p1 = new Pair<>(10, "Key");
                  Pair<String, Double> p2 = new Pair<>("Key", 3.14);
                  System.out.println(p1.merge(p2));

                  List<Integer> nums = new ArrayList<>(Arrays.asList(5, -2, 8, -9, 0, 3));
                  removeNegatives(nums);
                  System.out.println(nums);
              }
          }
        expected_output: |
          (10, 3.14)
          [5, 8, 0, 3]
        hints:
          - "In `merge`, use `.equals()` (not `==`) to compare `this.second` and `other.first`, because `U` is a reference type (`String` here)."
          - "In `removeNegatives`, obtain `Iterator<Integer> it = nums.iterator();`, loop `while (it.hasNext())`, check `if (it.next() < 0)`, and call `it.remove()`."

      - id: fc-generics-erasure-invariance
        block_type: flashcard
        title: "Type Erasure & Generics Invariance"
        front: "How does Java **type erasure** (*effacement de type*) differ from C++ templates, and why is `List<Student>` **not** a subtype of `List<Person>`?"
        back: |
          - **Type Erasure:** A Java generic class is compiled **once** into a single `.class` file; type arguments are checked at compile time and then erased to `Object` (or the upper bound in `<T extends Bound>`). C++ templates generate separate compiled code per instantiation.
          - **Generics Invariance:** If `List<Student>` were a subtype of `List<Person>`, you could write `List<Person> lp = students; lp.add(new Sportsman());` and silently corrupt a `Student` list at runtime.
        hint: "Think about how many `.class` files `Pair<T, U>` produces, and what would happen if you inserted a `Sportsman` through a `List<Person>` alias."
        tags:
          - generics
          - type-erasure
          - invariance

      - id: ref-static-vs-dynamic-encapsulation
        block_type: reflection_rubric
        title: "Synthesis: Static/Dynamic Dispatch & Collection Encapsulation"
        prompt: >-
          In your own words, answer both exam-style questions: (1) Given
          `Person p = new Student("Paul");`, why does `p.study()` fail to
          compile while `p.toString()` executes `Student.toString()` at
          runtime? (2) Why is returning `private List<Student> students;` from a
          getter an encapsulation violation, and what are two safe alternatives?
        self_check_criteria:
          - "Distinguished p's static type (Person, checked at compile time) from its dynamic type (Student, used for dynamic binding via the method table at runtime)."
          - "Explained that returning a mutable List reference allows external callers to call .add()/.remove()/.clear() and bypass class invariants."
          - "Named at least two safe remedies: Collections.unmodifiableList(...), returning a defensive copy (new ArrayList<>(students)), or exposing read-only element accessors."
        model_answer: >-
          (1) The Java compiler checks method existence strictly against the
          variable's static type (`Person`). Because `study()` is not declared
          on `Person`, `p.study()` is rejected at compile time. However,
          `toString()` is declared on `Object`/`Person`, so it compiles; at
          runtime, dynamic binding (*liaison dynamique*) follows the heap
          object's `Class` pointer to `Student`'s method table and executes
          `Student::toString`. (2) Because `List` is a mutable reference type,
          returning the private reference directly lets external code mutate the
          internal list (e.g., `getStudents().clear()`), breaking encapsulation.
          Safe fixes include returning an unmodifiable view
          (`Collections.unmodifiableList(students)`), returning a defensive copy
          (`new ArrayList<>(students)`), or providing index/size accessors
          instead of exposing the list.

  - id: sec-diagnostic-quiz
    title: "6. Diagnostic Knowledge Check (TE1 Exam Calibration)"
    description: >-
      Test your mastery of polymorphism, dynamic binding, instanceof traps,
      autoboxing caching, collections, and generics with TE1-grade diagnostic
      questions.
    blocks:
      - id: qz-polymorphism-taxonomy
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 2
        related_block_id: th-polymorphism-taxonomy
        title: "Polymorphism Taxonomy Classification"
        question: >-
          According to the Strachey/Cardelli polymorphism taxonomy taught in POO,
          which pair correctly classifies **Universal** (*universel*) vs.
          **Ad-hoc** polymorphism?
        options:
          - "Universal = Parametric (generics) & Inclusion (subtyping); Ad-hoc = Overloading & Conversion"
          - "Universal = Inclusion (subtyping) & Overloading; Ad-hoc = Parametric (generics) & Conversion"
          - "Universal = Parametric (generics) & Conversion; Ad-hoc = Inclusion (subtyping) & Overloading"
          - "Universal = Dynamic binding & Casting; Ad-hoc = Interfaces & Abstract classes"
        correct_answer: "Universal = Parametric (generics) & Inclusion (subtyping); Ad-hoc = Overloading & Conversion"
        explanation: |
          Universal polymorphism covers operations that work uniformly over an unbounded set of types: **Parametric** (*généricité*, e.g., `List<T>`) and **Inclusion** (*sous-typage*, e.g., `Person p = new Sportsman()`). Ad-hoc polymorphism covers a finite set of explicitly defined behaviors: **Overloading** (*surcharge*) and **Conversion** (*conversion automatique*).

          - Putting Overloading under Universal is wrong because each overload is a separate, ad-hoc implementation.
          - Putting Conversion under Universal is wrong because primitive widening/coercion applies only to specific predefined type pairs.
          - Dynamic binding and casting are mechanisms supporting inclusion polymorphism, not the top-level taxonomy categories.
        hints:
          - "Universal polymorphism has two kinds that both work over infinitely many types (via type parameters or inheritance hierarchies)."
          - "Method overloading (`surcharge`) requires writing a distinct method body for each signature—is that uniform/universal or ad-hoc?"

      - id: qz-static-vs-dynamic-dispatch
        block_type: quiz_question
        question_type: code_output
        difficulty: 4
        related_block_id: th-class-reflection-vtable
        title: "Static Field Hiding vs. Dynamic Method Binding"
        question: |
          Consider the following Java classes:

          ```java
          class Person {
              String role = "Person";
              String describe() { return "I am a Person"; }
          }
          class Sportsman extends Person {
              String role = "Sportsman";
              @Override
              String describe() { return "I am a Sportsman"; }
          }

          Person p = new Sportsman();
          System.out.println(p.role + " | " + p.describe());
          ```

          What is printed to the console?
        options:
          - "Person | I am a Sportsman"
          - "Sportsman | I am a Sportsman"
          - "Person | I am a Person"
          - "Compile-time error: duplicate field role"
        correct_answer: "Person | I am a Sportsman"
        explanation: |
          In Java, **instance methods** use **dynamic binding** (*liaison dynamique*) based on the runtime object's type (`Sportsman`), so `p.describe()` invokes `Sportsman::describe` and returns `"I am a Sportsman"`. In contrast, **attributes (fields)** are bound **statically** at compile time based on the variable's declared type (`Person`), so `p.role` reads `Person.role` (`"Person"`), a phenomenon called *field hiding* (*masquage*).

          - `"Sportsman | I am a Sportsman"` wrongly assumes fields are polymorphically overridden like methods.
          - `"Person | I am a Person"` ignores dynamic binding on overridden methods.
          - Declaring a field with the same name in a subclass is legal in Java (hiding, not a compile error).
        hints:
          - "Does dynamic binding (*liaison dynamique*) apply to instance methods, to attributes, or to both?"
          - "What is the static type of `p`, and what is the dynamic type of the object `p` references?"

      - id: qz-instanceof-compile-vs-runtime
        block_type: quiz_question
        question_type: code_output
        difficulty: 4
        related_block_id: code-instanceof-class-traps
        title: "instanceof Compile-Time Compatibility Trap"
        question: |
          Given `class Color {}`, `class Red extends Color {}`, and `class Blue extends Color {}`, consider these four lines:

          ```java
          Color c = new Blue();
          Red r = new Red();
          boolean b1 = (c instanceof Red);
          boolean b2 = (r instanceof Blue);
          ```

          What happens when you compile and run this code?
        options:
          - "Compile-time error on line 4 (`r instanceof Blue`); line 3 compiles and evaluates to `false`"
          - "Compiles cleanly; `b1` is `false` and `b2` is `false`"
          - "Compile-time error on both line 3 and line 4"
          - "Compiles cleanly, but throws `ClassCastException` on line 4"
        correct_answer: "Compile-time error on line 4 (`r instanceof Blue`); line 3 compiles and evaluates to `false`"
        explanation: |
          In `exp instanceof C`, when both `exp`'s static type and `C` are classes, the compiler requires them to be on the **same inheritance branch** (one must be a superclass or subclass of the other).
          - Line 3 (`c instanceof Red`): `c` has static type `Color`, and `Red extends Color`, so it compiles and evaluates to `false` at runtime (since `c` points to a `Blue`).
          - Line 4 (`r instanceof Blue`): `r` has static type `Red`. Because `Red` and `Blue` are unrelated sibling classes, no object could ever be both—Java rejects this at **compile time**.
          - `instanceof` never throws `ClassCastException` (casting does).
        hints:
          - "Check the compile-time rule for `exp instanceof C`: what relationship must exist between `exp`'s static class type and `C`?"
          - "Can an instance of `Red` ever also be an instance of sibling class `Blue` in Java's single-inheritance hierarchy?"

      - id: qz-getclass-vs-instanceof
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: th-class-reflection-vtable
        title: "Exact Class (getClass) vs. Membership (instanceof)"
        question: |
          Given `Person p = new Sportsman("Roger", 39, "Tennis");` (where `Sportsman extends Person`), which pair of boolean values is produced by:
          1. `p instanceof Person`
          2. `p.getClass() == Person.class`
        options:
          - "`true` and `false`"
          - "`true` and `true`"
          - "`false` and `false`"
          - "`false` and `true`"
        correct_answer: "`true` and `false`"
        explanation: |
          - `p instanceof Person` tests **membership** (*membre de*): a `Sportsman` is a member of `Sportsman`, `Person`, and `Object`, so it returns **`true`**.
          - `p.getClass() == Person.class` tests the **exact instantiation class**: `p.getClass()` returns the unique `Sportsman.class` meta-object, which is not equal to `Person.class`, so it returns **`false`**.
        hints:
          - "Which operator checks whether an object belongs to a class *or any of its subclasses*?"
          - "What exact `Class` object does `p.getClass()` return for `new Sportsman(...)`?"

      - id: qz-autoboxing-cache-trap
        block_type: quiz_question
        question_type: code_output
        difficulty: 4
        related_block_id: code-autoboxing-traps
        title: "Autoboxing Integer Cache & == Comparison"
        question: |
          What does the following Java snippet print?

          ```java
          Integer a = 127;
          Integer b = 127;
          Integer x = 128;
          Integer y = 128;
          System.out.println((a == b) + " " + (x == y) + " " + (x == 128));
          ```
        options:
          - "`true false true`"
          - "`true true true`"
          - "`false false true`"
          - "`true false false`"
        correct_answer: "`true false true`"
        explanation: |
          1. `a == b`: Autoboxing calls `Integer.valueOf(127)`. Since `127` is inside Java's guaranteed `Integer` cache (`-128` to `127`), `a` and `b` reference the **same** cached `Integer` object $\rightarrow$ **`true`**.
          2. `x == y`: `128` is **outside** the `[-128, 127]` cache, so `Integer.valueOf(128)` allocates two distinct `Integer` objects on the heap; reference comparison `==` returns **`false`**.
          3. `x == 128`: Comparing an `Integer` wrapper to a primitive `int` triggers **unboxing** (`x.intValue() == 128`), which compares numeric values $\rightarrow$ **`true`**.
        hints:
          - "Recall the exact inclusive range of `Integer` values cached by `Integer.valueOf()`."
          - "What happens when one operand of `==` is an `Integer` and the other is a primitive `int`?"

      - id: qz-encapsulation-array-leak
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: th-arrays-and-encapsulation
        title: "Fixing an Encapsulation Leak on a Private Collection"
        question: |
          A class declares `private List<String> names = new ArrayList<>();` and exposes `public List<String> getNames() { return names; }`. Why is this considered broken encapsulation, and which fix preserves encapsulation **without** copying the entire list?
        options:
          - "Callers can mutate the internal list via `getNames().clear()`; fix by returning `Collections.unmodifiableList(names)`"
          - "Callers cannot read `private` fields from outside the class, so `getNames()` is already safe"
          - "Callers can mutate `names`; fix by declaring `private final List<String> names`"
          - "Callers can mutate `names`; fix by casting `(Object) names` before returning"
        correct_answer: "Callers can mutate the internal list via `getNames().clear()`; fix by returning `Collections.unmodifiableList(names)`"
        explanation: |
          Because `List` is a mutable object, returning the reference directly lets any caller call `.add()`, `.remove()`, or `.clear()` on the class's internal state. Wrapping it in `Collections.unmodifiableList(names)` returns a read-only view (without copying elements) that throws `UnsupportedOperationException` on mutation attempts.

          - `private` only restricts direct field access by name; once the reference is returned, the object itself is exposed.
          - `final` prevents reassigning the `names` reference to a different list, but does **not** make the list's contents immutable.
          - Casting to `Object` still leaks the same mutable reference (and ruins the API).
        hints:
          - "Does the `final` keyword on a reference variable prevent calling `.add()` or `.clear()` on the referenced `List`?"
          - "Which static helper on `java.util.Collections` creates a read-only wrapper around an existing collection?"

      - id: qz-iterator-modification
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: th-iterators-foreach
        title: "Safely Removing Elements During Iteration"
        question: >-
          You want to remove all empty strings from a `List<String> words` while
          iterating through it. Which approach is guaranteed safe and follows
          the `Iterator` contract?
        options:
          - "Obtain `Iterator<String> it = words.iterator();`, advance with `it.next()`, and call `it.remove()` when empty"
          - "Use `for (String w : words)` and call `words.remove(w)` when `w.isEmpty()`"
          - "Obtain `Iterator<String> it = words.iterator();` and call `words.remove(it.next())` when empty"
          - "Call `it.remove()` immediately after creating `words.iterator()` before calling `it.next()`"
        correct_answer: "Obtain `Iterator<String> it = words.iterator();`, advance with `it.next()`, and call `it.remove()` when empty"
        explanation: |
          Modifying a collection directly (via `words.remove(...)`) while an `Iterator` or `for-each` loop is traversing it violates the iterator contract and throws `ConcurrentModificationException`. The only safe structural removal during iteration is via `it.remove()`, called **after** `it.next()` has advanced to the current element.

          - Calling `words.remove(w)` inside `for-each` or `while (it.hasNext())` causes `ConcurrentModificationException`.
          - An `Iterator` starts *before* the first element, so calling `it.remove()` before `it.next()` throws `IllegalStateException`.
        hints:
          - "Where is an `Iterator` positioned right after `words.iterator()` is called?"
          - "Which object must perform the removal so the iterator's internal cursor stays synchronized?"

      - id: qz-collections-cpp-false-friends
        block_type: quiz_question
        question_type: multi_select
        difficulty: 3
        related_block_id: th-collections-types-and-cpp
        title: "Java Collections Architecture & C++ Comparisons"
        question: >-
          Which of the following statements about the Java Collections Framework
          and its comparison with C++ containers are **true**?
        options:
          - "Java's `ArrayList` corresponds to C++'s `std::vector`, and Java's `LinkedList` corresponds to C++'s `std::list`."
          - "`Map` does NOT extend the `Collection` interface."
          - "Java collections can store primitive `int` values directly without boxing."
          - "In Java 21, `SequencedCollection` defines `addFirst`/`addLast`, `getFirst`/`getLast`, `removeFirst`/`removeLast`, and `reversed()` for ordered collections."
        correct_answer:
          - "Java's `ArrayList` corresponds to C++'s `std::vector`, and Java's `LinkedList` corresponds to C++'s `std::list`."
          - "`Map` does NOT extend the `Collection` interface."
          - "In Java 21, `SequencedCollection` defines `addFirst`/`addLast`, `getFirst`/`getLast`, `removeFirst`/`removeLast`, and `reversed()` for ordered collections."
        explanation: |
          - **True:** `ArrayList` $\leftrightarrow$ `std::vector` (resizable array) and `LinkedList` $\leftrightarrow$ `std::list` (doubly linked list) are classic C++/Java naming correspondences.
          - **True:** `Map<K, V>` models key-value pairs and forms its own separate hierarchy (it does not extend `Collection<E>`).
          - **False:** Unlike C++ containers, Java collections store **only object references**; inserting an `int` always requires boxing it into an `Integer`.
          - **True:** Java 21 introduced `SequencedCollection` (and `SequencedMap`) to standardize first/last access and `reversed()` views across ordered collections.
        hints:
          - "Can you declare `List<int>` in Java, or must you write `List<Integer>`?"
          - "Check the UML hierarchy: does `Map<K, V>` inherit from `Collection<E>`?"

      - id: qz-generics-erasure-invariance
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 5
        related_block_id: th-type-erasure-bounds-invariance
        title: "Type Erasure & Generics Invariance"
        question: >-
          Given `class Student extends Person {}`, which statement accurately
          describes Java Generics?
        options:
          - "`Pair<T, U>` compiles into a single `.class` file via type erasure, and `List<Student>` is NOT a subtype of `List<Person>`."
          - "`Pair<String, Integer>` and `Pair<Double, Boolean>` compile into two separate `.class` files, just like C++ templates."
          - "Because `Student extends Person`, `List<Person> lp = new ArrayList<Student>();` compiles cleanly."
          - "Inside `class PersonList<T extends Person>`, type erasure replaces `T` with `Object`, making `Person` methods inaccessible."
        correct_answer: "`Pair<T, U>` compiles into a single `.class` file via type erasure, and `List<Student>` is NOT a subtype of `List<Person>`."
        explanation: |
          Java implements generics via **type erasure** (*effacement de type*): a generic class is compiled **once** into a single `.class` file, unlike C++ templates which generate separate code per instantiation. Furthermore, Java generics are **invariant**: `List<Student>` is NOT a subtype of `List<Person>`, preventing callers from inserting a `Sportsman` into a `List<Student>` through a `List<Person>` reference.

          - Separate `.class` files per type argument is false (that's C++ template instantiation, not Java).
          - `List<Person> lp = new ArrayList<Student>();` is a **compile-time error** due to generics invariance.
          - For a bounded type parameter `<T extends Person>`, type erasure replaces `T` with its upper bound `Person` (not `Object`), specifically so `Person`'s methods *are* accessible.
        hints:
          - "Think about what would happen if `List<Person> lp = new ArrayList<Student>();` compiled and you then ran `lp.add(new Sportsman(...));`."
          - "How many `.class` files does `javac` emit for `class Pair<T, U>` regardless of how many different `<T, U>` combinations you use?"
