sections:
  - id: sec-polymorphism-foundations
    title: "1. Polymorphism Taxonomy, Substitution & Type Conversions"
    description: >-
      Understand the four kinds of polymorphism, the Liskov-style substitution
      principle, primitive widening/narrowing conversions, and the crucial
      difference between static type and dynamic type.
    blocks:
      - id: th-starwars-motivation
        block_type: markdown
        title: "Motivating Problem: Heterogeneous Collections (StarWars)"
        content: |
          Suppose you model a StarWars roster with a base class `Humanoid` and subclasses `Jedi` (Yoda, Obi-Wan, Anakin, Luke) and `Sith` (Darth Sidious, Darth Vader after corrupting Anakin). You want to store **all** characters (`Paul`, `Yoda`, `Darth Sidious`, `Obi-Wan`, `Darth Vader`, `Luke`) inside a single array `Humanoid[]` and display every character—then filter only those wielding a green lightsaber.

          How can a single `Humanoid[]` array hold `Jedi` and `Sith` objects, call each subclass's own `toString()` automatically, and safely inspect subclass-specific traits like lightsaber color? That is the exact problem solved by **polymorphism** (*polymorphisme*), **dynamic binding** (*liaison dynamique*), and runtime type inspection (`instanceof`).

      - id: th-polymorphism-taxonomy
        block_type: markdown
        title: "The Four Kinds of Polymorphism"
        content: |
          Following the classic classification ([Strachey 67], [Cardelli 85], [Meyer 88], [Booch 91]), **polymorphism** (*polymorphisme*) splits into two main families—**Universal** (*universel*) and **Ad-hoc**:

          | Family | Kind (EN / FR) | Definition | Java Example |
          | :--- | :--- | :--- | :--- |
          | **Universal** | **Parametric** (*paramétrique*) | One operation or data structure works uniformly over many types via type parameters (**generics** / *généricité*). | `List<T>`, `Pair<T, U>`, `<V> Pair<T, V> merge(...)` |
          | **Universal** | **Inclusion** (*d'inclusion*) | One operation works on types linked by a **subtyping** (*sous-typage*) relation (in Java, inheritance $\implies$ subtyping). | `Person p = new Sportsman(...);` |
          | **Ad-hoc** | **Overloading** (*surcharge*) | Same identifier bound to distinct implementations distinguished by parameter types/arity. | `println(int)`, `println(String)`, `println(Object)` |
          | **Ad-hoc** | **Conversion** (*conversion*) | Automatic type conversion (coercion) performed by the compiler. | `int i = 1; double d = i;` |

          ### The Substitution Principle (*Principe de substitution*)
          In object-oriented programming (inclusion polymorphism): if $C'$ is a subclass of $C$, an instance of $C'$ can be used **anywhere** an instance of $C$ is expected—both in assignments and in method parameter passing:

          ```java
          Person p = new Sportsman("Roger", 39, "Tennis"); // polymorphic assignment (affectation polymorphique)
          System.out.println(p);                           // dynamic binding invokes Sportsman::toString
          ```

          > [!IMPORTANT]
          > **Static Type vs. Dynamic Type (*Type statique vs. Type dynamique*):**
          > - The **static type** of `p` is `Person` (the declared type of the variable, known at compile time). It determines **which methods and fields the compiler allows you to call**.
          > - The **dynamic type** of `p` is `Sportsman` (the actual class instantiated on the heap, known at runtime). It determines **which overridden instance method body actually executes** via **dynamic binding** (*liaison dynamique*).

