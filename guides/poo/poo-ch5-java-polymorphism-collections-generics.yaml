      - id: th-conversions-and-subtyping
        block_type: markdown
        title: "Primitive Conversions & Reference Substitution Limits"
        content: |
          ### Primitive Widening vs. Narrowing Conversions
          An integer can always be used where a real number is expected, but not vice versa. Java performs **widening conversions** (*conversions élargissantes*) **implicitly** at compile time:

          $$\texttt{byte} \rightarrow \texttt{short} \rightarrow \texttt{int} \rightarrow \texttt{long} \rightarrow \texttt{float} \rightarrow \texttt{double}$$
          $$\texttt{char} \rightarrow \texttt{int} \rightarrow \texttt{long} \rightarrow \texttt{float} \rightarrow \texttt{double}$$

          All other primitive conversions are **narrowing conversions** (*conversions restrictives*) and require an **explicit cast** (*transtypage*), except for compile-time constant literals that fit within the target type's range (e.g., `byte b = 42;`):

          ```java
          int i = 1;
          double d = i;         // implicit widening conversion (conversion élargissante)
          i = (int) (d * 2.3);  // explicit narrowing cast required; truncates to i == 2
          ```

          ### Reference Substitution Is One-Way
          A `Student` **is a** `Person`, so passing a `Student` to `void person(Person arg)` is legal. The reverse is **not**—even if a `Person` reference currently points to a `Student` object:

          ```java
          Student s = new Student();
          t.person(s);    // OK: Student is a subtype of Person
          Person p = s;   // OK: polymorphic assignment (upcast)
          // t.student(p); // COMPILE ERROR! p's static type is Person, not Student
          t.student(s);   // OK: s's static type is Student
          ```

      - id: fc-widening-chain
        block_type: flashcard
        title: "Primitive Widening Conversion Chain"
        front: "Which primitive type conversions does the Java compiler perform **implicitly** (*conversions élargissantes*), and when is an explicit cast (*transtypage*) required?"
        back: |
          **Implicit widening chains:**
          - `byte` $\rightarrow$ `short` $\rightarrow$ `int` $\rightarrow$ `long` $\rightarrow$ `float` $\rightarrow$ `double`
          - `char` $\rightarrow$ `int` $\rightarrow$ `long` $\rightarrow$ `float` $\rightarrow$ `double`

          **Narrowing conversions** (going backwards, or between `byte`/`short` and `char`) require an explicit cast `(Type) expr` — **except** when assigning a compile-time constant whose value fits inside the target type's range (e.g., `short s = 100;`).
        hint: "Notice where `char` enters the chain (unsigned 16-bit cannot widen implicitly to signed `short`)."
        tags:
          - java
          - conversions
          - primitives

  - id: sec-casting-instanceof-class
    title: "2. Casting, instanceof, Dynamic Binding Internals & Pattern Matching"
    description: >-
      Master safe downcasting, instanceof compile-time vs. runtime rules,
      exact-type testing with java.lang.Class, vtable dynamic dispatch, and Java
      16/21 pattern matching.
    blocks:
      - id: th-casting-instanceof
        block_type: markdown
        title: "Membership, Downcasting & the instanceof Operator"
        content: |
          An instance of class $C$ is **instantiated** (*instancié*) in $C$, and is a **member** (*membre*) of $C$ and **all superclasses** of $C$ (all the way up to `Object`).

          ### Downcasting (*Transtypage*)
          Syntax: `(TargetType) reference`. Casting forces the compiler to treat a reference as a more specific type so you can invoke subclass-only methods. It is **dangerous**: if the heap object is not actually a member of `TargetType`, the JVM throws **`ClassCastException`** at runtime.

          ```java
          Person p = new Sportsman("Roger", 39, "Tennis");
          // p.sport();                    // COMPILE ERROR: sport() is not in Person
          System.out.println(p);           // OK: dynamic binding invokes Sportsman::toString
          ((Sportsman) p).sport();         // OK: p actually references a Sportsman
          Student s = (Student) p;         // COMPILES, but throws ClassCastException at runtime!
          ```

          ### Safe Runtime Checks with `instanceof`
          Syntax: `expression instanceof C` $\rightarrow$ `boolean` (returns `true` if the object is a member of `C`, and `false` if `expression` is `null`).
          - If `C` is a **class**: checks if the object is an instance of `C` or any subclass of `C`.
          - If `C` is an **interface**: checks if the object's class implements `C`.
          - If `C` is an **array** `T[]`: checks if the object is an array of `T` (where `T` is a primitive, class, or interface).

          > [!WARNING]
          > **Compile-Time Compatibility Trap:** In `exp instanceof C`, if `exp` has static class type `R` and `C` is a class, `C` **must** be a superclass or subclass of `R` (they must lie on the same inheritance branch). Testing two sibling classes (e.g., `Red r = new Red(); r instanceof Blue`) is a **compile-time error**!

          ### Java 16 Pattern Matching for `instanceof` (*Filtrage par motif*)
          Eliminates redundant casts and prevents wrong-cast typos:
          ```java
          if (p instanceof Sportsman s) {
              s.sport(); // s is already typed as Sportsman in this scope!
          }
          ```
          **Design discipline:** Do not overuse `instanceof`—long `if/else if (x instanceof ...)` chains usually signal missing polymorphic method overriding.

      - id: th-class-reflection-vtable
        block_type: markdown
        title: "Runtime Meta-Objects (Class), Dynamic Dispatch & Java 21 Pattern Switch"
        content: |
          ### Exact Class Testing with `java.lang.Class`
          Every class, interface, and primitive type has a **unique** `Class` meta-object in the JVM:
          - **Type literal:** `Sportsman.class`, `int.class`, `String.class`.
          - **Instance query:** `obj.getClass()` (defined on `Object`) returns the exact `Class` where `obj` was instantiated.

          Compare `instanceof` vs. `getClass()` for `Person p = new Sportsman(...)`:
          - `p instanceof Person` $\rightarrow$ **`true`** (membership includes superclasses).
          - `p.getClass() == Person.class` $\rightarrow$ **`false`** (exact instantiated class is `Sportsman.class`).
          - `p.getClass() == Sportsman.class` $\rightarrow$ **`true`**.

          Useful reflection methods on `Class`: `getName()` (`"java.lang.String"`), `getSimpleName()` (`"String"`), `getSuperclass()`, `isInstance(Object o)` (dynamic equivalent of `instanceof`), and `newInstance()`.

          > [!TIP]
          > **Hierarchy Ordering Rule:** When looping over a `Class[] types` array with `types[i].isInstance(p)` (or writing `switch` type patterns), always list **most specific subclasses first** (`Student.class`, `Sportsman.class`) before superclasses (`Person.class`, `Object.class`)—otherwise a superclass matches first (or causes a compile error in `switch`).

          ### How Dynamic Binding Works in Memory (Method Tables)
          Every heap object stores a hidden reference to its runtime `Class` descriptor. Each `Class` descriptor holds a pointer to its `superclass` and a **method table** (*table des méthodes* / vtable) mapping method signatures to bytecode implementations:
          - `Person` has `set() -> Person::set` and `toString() -> Person::toString`.
          - `Sportsman` inherits `set() -> Person::set`, overrides `toString() -> Sportsman::toString`, and adds `sport() -> Sportsman::sport`.
          - When `p.toString()` executes, the JVM follows `p` $\rightarrow$ `Sportsman` `Class` descriptor $\rightarrow$ `Sportsman::toString`.
          - **Exam Trap — Attributes are NOT polymorphic:** Instance fields are bound **statically** (at compile time) based on the reference's declared type (*attribute hiding* / *masquage*), whereas non-static, non-private methods are bound **dynamically** (*overriding* / *redéfinition*).

          ### Java 21 Pattern Matching for `switch`
          Java 21 allows type patterns, `null` handling, and guarded `when` clauses directly in `switch` expressions:
          ```java
          String sound = switch (o) {
              case null -> {
                  System.out.println("No animal...");
                  yield "";
              }
              case Cat c -> c.meow();
              case Human h when h.age() > 2 -> "Hello!";
              default -> "Argle-bargle";
          };
          ```

