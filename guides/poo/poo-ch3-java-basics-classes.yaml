            + Person(name: String)
            + toString(): String
          }

          class Vector {
            - x: int
            - y: int
            + Vector(x: int, y: int)
            + addTo(v: Vector): Vector
            + plus(v: Vector): Vector
          }

          Object <|-- Person
          Object <|-- Vector
          @enduml

      - id: code-person-constructors
        block_type: code
        language: java
        filename: Person.java
        title: "Overloaded Constructors, this(...) Chaining & Encapsulation"
        code: |
          public class Person {
              private String name;
              private int age;
              public Person(String name, int age) {
                  this.name = name;
                  this.age = age;
              }
              public Person(String name) {
                  this(name, 0);
              }
              public String toString() {
                  return name + ", " + age;
              }
          }
        highlight_lines:
          - 2
          - 5
          - 9
          - 11
        annotations:
          - line: 2
            note: "Private attributes encapsulate object state; because an explicit constructor exists, new Person() no longer compiles."
          - line: 5
            note: "this.name disambiguates the instance attribute from the parameter name that shadows it."
          - line: 9
            note: "Constructor chaining: delegates to Person(String, int). Must be the very first statement!"
          - line: 11
            note: "Overrides Object.toString() to produce a readable representation of the Person's state."

  - id: sec-params-this-main
    title: "5. Parameter Passing, `this` & Program Entry Point"
    description: "Why Java is strictly pass-by-value, how reference copies affect mutable vs. immutable objects, the 3 uses of this, class-level encapsulation, and main() CLI execution."
    blocks:
      - id: th-param-passing-this
        block_type: markdown
        title: "Parameter Passing (*Mode de transmission*), `this`, and `main()`"
        content: |
          ### Parameter Passing in Java (Slides 27–30)
          Programming languages generally offer two parameter passing modes:
          * **Pass-by-value (*par valeur*):** The method receives a **copy** of the argument; modifying the parameter has no effect on the caller's variable.
          * **Pass-by-reference (*par référence / par adresse*):** The method receives an alias to the caller's variable and can overwrite it directly (supported alongside pass-by-value in C++).

          > [!IMPORTANT]
          > **Java uses EXCLUSIVELY pass-by-value (*exclusivement par valeur*)!**
          > However, because objects are always manipulated via references, passing an object passes a **copy of the reference** — NOT a copy of the object. Both caller and callee therefore point to the **same heap object**:
          > * The callee **can mutate the object's fields** through the copied reference.
          > * Reassigning the parameter variable itself (`other = new Int(99);`) only changes the local copy and **never** alters the caller's reference.

          **Practical mental model (Slide 28):** Everything behaves *as if* it were:
          * **By value** for **primitive types** and **immutable objects** (`String`, `Integer`, `Double`, ...).
          * **By reference** for **mutable objects** (e.g., `Int` wrapper box, `Vector`, `StringBuilder`).

          Compare Slides 29 and 30:
          * `z.swap(x, y)` on `int x = 1, y = 2;` swaps only the local copies `a` and `b` — `x` and `y` remain `1` and `2`.
          * `x.swap(y)` on mutable `Int x = new Int(1), y = new Int(2);` swaps `this.value` and `other.value` on the heap objects — `x.value()` becomes `2` and `y.value()` becomes `1`.

          ---

          ### The 3 Uses of `this` & Class-Level Encapsulation (Slides 31–32)
          Inside an instance method or constructor, `this` denotes the current target instance. It is used to:
          1. **Pass the current instance** as an argument to another method.
          2. **Access shadowed attributes** when a parameter shares the same name (`this.name = name;`).
          3. **Return the current instance** (`return this;`) to enable **method chaining** (*chaîner des appels*):
             ```java
             v1.addTo(v2).addTo(v3); // mutates v1 in place: (1,0) + (42,42) + (-1,-1) = (42, 41)
             ```

          > [!TIP]
          > **Class-Level Encapsulation (Slide 32):** Inside `Vector.addTo(Vector v)`, writing `this.x += v.x;` is completely legal even though `x` is `private`! In Java, **the unit of encapsulation is the class, not the individual object** (*l'unité d'encapsulation est la classe, non l'objet*).
          >
          > **Slide 32 Question — How to define a non-mutating `+` (`plus`) method?** Instead of modifying `this` and returning `this`, allocate and return a fresh object: `return new Vector(this.x + v.x, this.y + v.y);`.

          **Do not confuse member access with constructor chaining:**
          * `this.attr` / `this.method(...)` accesses members of the current instance; `this(...)` invokes another constructor of the same class.
          * `super.attr` / `super.method(...)` accesses members of the superclass; `super(...)` invokes a superclass constructor.

          ---

          ### Program Entry Point & Command-Line Execution (Slide 33)
          Every executable Java program requires a `public static void main(String[] args)` method:
          * `args` is a `String[]` holding any command-line arguments passed at launch.
          * **Compile:** `javac <ClassName>.java`
          * **Run:** `java <ClassName> [arg1 arg2 ... argn]` (omit the `.class` extension!)

      - id: exp-sandbox-vector-chaining
        block_type: sandbox
        runtime: java
        title: "Practice: Method Chaining (`this`), Class Encapsulation & Mutable Swap"
        instructions: |
          Implement two methods in `Vector` and one in `IntBox` (matching Slides 30 & 32):
          1. `Vector.addTo(Vector v)`: adds `v.x` and `v.y` to `this.x` and `this.y` (using class-level access to `v`'s private fields) and returns `this` to allow chaining `v1.addTo(v2).addTo(v3)`.
          2. `Vector.plus(Vector v)`: returns a **new** `Vector(this.x + v.x, this.y + v.y)` **without** mutating `this` or `v`.
          3. `IntBox.swap(IntBox other)`: swaps `this.value` with `other.value`.

          Run the code so the output matches `(42, 41) | (41, 40) | (42, 41) | 2,1`.
        starter_code: |
          public class Main {
              static class Vector {
                  private int x, y;

                  public Vector(int x, int y) {
                      this.x = x;
                      this.y = y;
                  }

                  public Vector addTo(Vector v) {
                      // TODO: mutate this.x and this.y by adding v.x and v.y, then return this
                      return this;
                  }

                  public Vector plus(Vector v) {
                      // TODO: return a new Vector with summed coordinates without mutating this
                      return new Vector(0, 0);
                  }

                  public String toString() {
                      return "(" + x + ", " + y + ")";
                  }
              }

              static class IntBox {
                  private int value;

                  public IntBox(int i) {
                      this.value = i;
                  }

                  public int value() {
                      return value;
                  }

                  public void swap(IntBox other) {
                      // TODO: swap this.value and other.value
                  }
              }

              public static void main(String[] args) {
                  Vector v1 = new Vector(1, 0);
                  Vector v2 = new Vector(42, 42);
                  Vector v3 = new Vector(-1, -1);

                  v1.addTo(v2).addTo(v3);
                  Vector sum = v1.plus(v3);

                  IntBox a = new IntBox(1);
                  IntBox b = new IntBox(2);
                  a.swap(b);

                  System.out.println(v1 + " | " + sum + " | " + v1 + " | " + a.value() + "," + b.value());
              }
          }
        solution: |
          public class Main {
              static class Vector {
                  private int x, y;

                  public Vector(int x, int y) {
                      this.x = x;
                      this.y = y;
                  }

                  public Vector addTo(Vector v) {
                      this.x += v.x;
                      this.y += v.y;
                      return this;
                  }

                  public Vector plus(Vector v) {
                      return new Vector(this.x + v.x, this.y + v.y);
                  }

                  public String toString() {
                      return "(" + x + ", " + y + ")";
                  }
              }

              static class IntBox {
                  private int value;

                  public IntBox(int i) {
                      this.value = i;
                  }

                  public int value() {
                      return value;
                  }

                  public void swap(IntBox other) {
                      int tmp = this.value;
                      this.value = other.value;
                      other.value = tmp;
                  }
              }

              public static void main(String[] args) {
                  Vector v1 = new Vector(1, 0);
                  Vector v2 = new Vector(42, 42);
                  Vector v3 = new Vector(-1, -1);

                  v1.addTo(v2).addTo(v3);
                  Vector sum = v1.plus(v3);

                  IntBox a = new IntBox(1);
                  IntBox b = new IntBox(2);
                  a.swap(b);

                  System.out.println(v1 + " | " + sum + " | " + v1 + " | " + a.value() + "," + b.value());
              }
          }
        expected_output: "(42, 41) | (41, 40) | (42, 41) | 2,1"
        hints:
          - "Inside `Vector`, you can read `v.x` and `v.y` directly even though they are `private`, because encapsulation in Java is at the class level."
          - "In `addTo`, update `this.x += v.x; this.y += v.y;` and `return this;`. In `plus`, return `new Vector(this.x + v.x, this.y + v.y);`."
          - "In `IntBox.swap`, use a temporary `int tmp = this.value;` to exchange `this.value` and `other.value`."

