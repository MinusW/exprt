sections:
  - id: sec-java-jvm
    title: "1. Java Ecosystem, Compilation & the JVM"
    description: "Origins of Java, LTS release milestones, compiled vs. interpreted trade-offs, and how the JVM combines bytecode interpretation with Just-In-Time (JIT) compilation."
    blocks:
      - id: th-java-overview
        block_type: markdown
        title: "Java Origins, LTS Versions & Language Characteristics"
        content: |
          ### Origins & Evolution (Slides 4–5)
          Java originated at **Sun Microsystems** as a language for **embedded systems** (*systèmes embarqués*), initially named **Oak** before becoming **Java**. Embedded devices shared the exact same engineering requirements as the emerging Internet:
          * **Reliability & security** (*fiabilité, sécurité*)
          * **CPU independence** (*indépendance vis-à-vis du processeur*)
          * **External interaction** (*interactions avec l'extérieur*) and **error recovery** (*récupération d'erreurs*)

          Although early fame came from browser *applets*, Java evolved into a standard platform for enterprise backends, web services, and mobile development (Android).

          #### Long-Term Support (LTS) Milestones
          This course targets **Java 21 (LTS)**. Know the major turning points in Java's evolution:

          | LTS Version | Year | Key Additions |
          | :--- | :--- | :--- |
          | **Java 5** | 2004 | Major release: generics (*généricité*), enums (*types énumérés*), enhanced `for-each` loop |
          | **Java 8** | 2014 | Major release: default interface methods (*méthodes par défaut*), lambda expressions |
          | **Java 11** | 2018 | Minor release: `var` local type inference (*inférence de type*), removal of applets |
          | **Java 17** | 2021 | Minor release: text blocks (*blocs de texte*), `switch` expressions, pattern matching for `instanceof`, `record`, `sealed` classes |
          | **Java 21** | 2023 | Minor release (course target): record patterns, pattern matching for `switch`, virtual threads, sequenced collections |

          ### General Aspects of Java (*Aspects généraux*, Slide 6)
          * **Multi-platform:** Compiles to portable **bytecode** executed by a **virtual machine** (*machine virtuelle*).
          * **C++-like syntax** (*syntaxe proche de C++*), lowering the barrier for systems programmers.
          * **Almost everything is an object** (*presque tout objet*) — the only exceptions are the 8 **primitive types** (`int`, `double`, `boolean`, etc.).
          * **Robust (*robuste*):** Strong static typing (*typage fort*), **no raw pointers** (*pas de pointeurs*), automatic **garbage collector** (*ramasse-miettes*), and encapsulation.
          * **Safe (*sûr*):** Structured **exception handling** (*gestion des exceptions*).
          * **Organized & Battery-Included:** Structured into **packages** (*paquetages*) and modules, shipping with a vast standard class library (**API**), portable GUI toolkits (Swing, JavaFX), built-in concurrency (**threads** / *processus*), **dynamic linking** (*lier dynamiquement du code à l'exécution*), and networking APIs for **distributed applications** (*applications réparties*).

          ---

          ### Compiled vs. Interpreted vs. JVM Hybrid (Slides 7–12)
          Every language design makes a trade-off between raw hardware performance and developer productivity/portability:

          | Paradigm | Examples | How It Runs | Strengths (+) | Weaknesses (−) |
          | :--- | :--- | :--- | :--- | :--- |
          | **Compiled** (*compilé*) | C, C++ | Translated ahead-of-time into native machine code by a compiler | Often faster; predictable performance; fine hardware control | Manual memory management; harder to secure (*unsafe*); harder to port across CPUs/OSes |
          | **Interpreted** (*interprété*) | Python, JavaScript | Translated dynamically during execution by an interpreter | Easy to port; ideal for prototyping; dynamic features (`eval`) | Often slower; limited hardware control; code-injection risks |
          | **JVM Hybrid** (*Machine Virtuelle Java*) | Java, Scala, Kotlin | Compiled to **bytecode** (`.class`), then interpreted **and** JIT-compiled by the JVM | **Portable** (*Write once, run anywhere*); dynamic **Just-In-Time (JIT)** optimization (e.g., *inlining*) using runtime profiles; **memory safety**; automatic **garbage collector** | Less predictable performance; **warmup time** (*temps de chauffe*, class loading); higher memory footprint (GC overhead) |

          > [!NOTE]
          > Multiple JVM implementations exist, including the proprietary **Oracle JDK** and the open-source **OpenJDK**. Because the JVM observes the live execution profile, it identifies **hot paths** (*portions chaudes*) and compiles them on-the-fly into native machine code tailored to the exact host CPU.

      - id: diag-jvm-pipeline
        block_type: kroki
        diagram_type: mermaid
        title: "Java Compilation, Class Loading & JVM Execution Pipeline"
        caption: "From .java source to portable .class bytecode via javac, then loaded and executed by the JVM combining interpretation with profile-guided JIT compilation."
        source: |
          flowchart LR
            subgraph Compile ["1. Compilation (javac)"]
              src["Prog11.java\n(Java Source)"] --> javac["javac Compiler"]
              javac --> bc["Prog11.class\n(Bytecode: aload_0,\nastore_2, getfield #23)"]
            end

            subgraph JVM ["2. JVM Execution (java Prog11)"]
              bc --> loader["Class Loader\n(Chargement)"]
              libs["JDK Standard Library\n& Other .class Files"] --> loader
              loader --> interp["Bytecode Interpreter\n(Immediate Execution)"]
              interp -->|"Hot Paths Detected\n(Portions chaudes)"| jit["JIT Compiler\n(Just-In-Time + Inlining)"]
              jit --> native["Native Machine Code\n(Host CPU)"]
              gc["Garbage Collector\n(Ramasse-miettes)"] -.->|"Reclaims Unreferenced\nHeap Objects"| interp
            end

            classDef srcStyle fill:#f0f9ff,stroke:#0284c7,stroke-width:1.5px;
            classDef procStyle fill:#ede9fe,stroke:#6366f1,stroke-width:1.5px;
            classDef outStyle fill:#ecfdf5,stroke:#059669,stroke-width:2px;
            classDef gcStyle fill:#fef3c7,stroke:#d97706,stroke-width:1.5px;

            class src,libs srcStyle;
            class javac,bc,loader,interp,jit procStyle;
            class native outStyle;
            class gc gcStyle;

      - id: fc-jvm-tradeoffs
        block_type: flashcard
        title: "JVM Trade-Offs (+/-)"
        front: "List **3 key advantages** and **3 key drawbacks** of running Java on the **JVM** compared to purely compiled languages like C/C++."
        back: |
          **Advantages (+):**
          1. **Portability** (*Write once, run anywhere* via bytecode).
          2. **Dynamic runtime optimization** via **JIT** compilation on hot paths (e.g. *inlining*).
          3. **Memory safety** (*sécurité de la mémoire*) and automatic **garbage collection** (*ramasse-miettes*).

          **Drawbacks (−):**
          1. **Less predictable performance** (JIT compilation & GC pauses).
          2. **Warmup time** (*temps de chauffe* + class loading).
          3. **Higher memory consumption** due to the garbage collector and JVM runtime.
        hint: "Think about portability, JIT, memory safety on one side, and warmup, predictability, and RAM on the other."
        tags:
          - jvm
          - jit
          - performance

  - id: sec-primitives-wrappers
    title: "2. Primitive Types, Literals & Wrapper Classes"
    description: "The 8 primitive types, signedness and bit widths, literal conversion rules, variable declaration rules, and immutable wrapper classes with autoboxing."
    blocks:
      - id: th-primitives-wrappers
        block_type: markdown
        title: "Primitive Types (*Types primitifs*) & Wrapper Classes (*Classes enveloppes*)"
        content: |
          ### The 8 Primitive Types (Slide 13)
          Java has **8 primitive types**. Unlike C/C++, **all integer types in Java are strictly signed** (*entiers, signés seulement*) — there is no `unsigned int`.

          | Category | Type | Size | Range / Values | Default (Attribute) |
          | :--- | :--- | :--- | :--- | :--- |
          | **Signed Integer** | `byte` | 8 bits | $-128$ to $127$ ($-2^7$ to $2^7 - 1$) | `0` |
          | **Signed Integer** | `short` | 16 bits | $-32{,}768$ to $32{,}767$ ($-2^{15}$ to $2^{15} - 1$) | `0` |
          | **Signed Integer** | `int` | 32 bits | $-2^{31}$ to $2^{31} - 1$ ($\approx \pm 2.14 \times 10^9$) | `0` |
          | **Signed Integer** | `long` | 64 bits | $-2^{63}$ to $2^{63} - 1$ | `0L` |
          | **Floating-Point** (*réels*) | `float` | 32 bits | IEEE 754 single precision | `0.0f` |
          | **Floating-Point** (*réels*) | `double` | 64 bits | IEEE 754 double precision | `0.0` |
          | **Boolean** (*booléen*) | `boolean` | JVM-dependent | `true` or `false` | `false` |
          | **Character** (*caractère*) | `char` | 16 bits | Unicode code units (`'\u0000'` to `'\uffff'`) | `'\u0000'` |

          > [!WARNING]
          > **`String` is NOT a primitive type!** `String` is a full-fledged **class** (`java.lang.String`), so a `String` variable holds an object reference (defaulting to `null` as an attribute).

          ### Default Literal Types (*Type par défaut des littéraux*, Slide 13)
          * **Integer literals** (e.g., `3`, `42`) have type **`int`** by default.
            * When assigned directly to a `byte`, `short`, `char` (or `long`), the compiler performs an **implicit conversion** if the literal value fits in the target range (e.g., `byte b = 100;` is valid, whereas `byte b = 200;` fails to compile).
          * **Floating-point literals** (e.g., `3.14`, `3.14E2`) have type **`double`** by default. (Assigning to `float` requires an `f` suffix such as `3.14f`.)

          ### Declaring Primitive Variables (Slide 14)
          * Syntax: `type varName;`, `type a, b, c;`, or `type varName = value;` (declaration + assignment).
          * A local variable can be declared **anywhere inside a method before its first use** (like C++, unlike pre-C99 C).
          * **No address-of operator (`&`)**: Unlike C/C++, Java forbids taking the memory address of a variable.

          ### Wrapper Classes (*Classes enveloppes / types enrobeurs*, Slide 15)
          Every primitive type has an object-oriented counterpart in `java.lang`:

          | Primitive | Wrapper Class | Primitive | Wrapper Class |
          | :--- | :--- | :--- | :--- |
          | `byte` | `Byte` | `float` | `Float` |
          | `short` | `Short` | `double` | `Double` |
          | `int` | `Integer` | `boolean` | `Boolean` |
          | `long` | `Long` | `char` | `Character` |

          * **Why they exist:** Usable anywhere an object is required (e.g., generic collections like `List<Integer>`, arrays of `Object`) and provide utility methods (e.g., `Integer.parseInt("42")`).
          * **Immutable (*immutables*):** Once created, a wrapper object's value **cannot be modified** (no `set` method).
          * **Autoboxing / Unboxing:** Java automatically converts between a primitive and its wrapper class (e.g., `Integer x = 42;` boxes `int` -> `Integer`; `int n = x;` unboxes `Integer` -> `int`).

      - id: fc-primitive-types
        block_type: flashcard
        title: "Primitive Types, Sizes & Wrapper Names"
        front: "Which two wrapper classes do **not** simply capitalize the primitive type name, and what are the bit widths of `byte`, `short`, `char`, `int`, `float`, `long`, and `double`?"
        back: |
          * Non-trivial wrapper names: **`int` -> `Integer`** and **`char` -> `Character`** (the other six are `Byte`, `Short`, `Long`, `Float`, `Double`, `Boolean`).
          * Bit widths:
            * **8 bits:** `byte` (signed)
            * **16 bits:** `short` (signed), `char` (Unicode)
            * **32 bits:** `int` (signed), `float`
            * **64 bits:** `long` (signed), `double`
            * **`boolean`:** `true` / `false` (not numeric — cannot be cast to `int`).
        hint: "Watch out for the 3-letter integer type and the 4-letter character type."
        tags:
          - primitives
          - wrappers
          - exam-essentials

  - id: sec-references-strings
    title: "3. References, Memory Model & Immutable Strings"
    description: "How Java manipulates objects via typed references, identity (==) vs. state, String literals, + operator overloading, and String immutability."
    blocks:
      - id: th-references-strings
        block_type: markdown
        title: "Object References (*Références*) & Strings (*Chaînes de caractères*)"
        content: |
          ### Object References (Slide 16)
          In Java, **all objects are manipulated exclusively through typed references** (*références typées*):
          1. **Declaration:** `Person a;` declares a reference variable `a` on the stack (it does **not** create an object yet).
          2. **Instantiation:** `a = new Person("John");` invokes a **constructor** via `new`, allocates the object on the heap, and stores its reference in `a`. Both steps can be combined: `Person b = new Person("Paul");`.
          3. **Reference assignment:** `a = b;` copies the reference — now **both `a` and `b` point to the exact same `Paul` object**. The `John` object previously referenced by `a` loses its last reference and becomes eligible for automatic reclamation by the **garbage collector** (*ramasse-miettes*).
          4. **Identity equality (`==`):** Applying `==` to references compares **object identity** (do both references point to the same heap object?), **not** whether the two objects have identical field values.

          ### Strings (*Chaînes de caractères*, Slides 17–18)
          * **Simplified literal creation:** Instead of constructing from a `char[]` (`char[] data = {'D', 'e'}; String s = new String(data);`), always use string literals:
            ```java
            String s = "De belles"; // Empty string: String empty = "";
            ```
            **Never call `new String(...)` unnecessarily** — it forces a redundant heap allocation.
          * **`+` operator concatenation:** Java provides built-in overloading of `+` between `String` and primitive types:
            ```java
            System.out.println(s + " valeurs : " + 1 + ", " + true);
            // Output: De belles valeurs : 1, true
            ```
            > [!IMPORTANT]
            > **User-defined operator overloading is NOT supported in Java** (*la surcharge utilisateur des opérateurs n'est pas possible*). String `+` is a special language-level exception.
          * **Strings are true objects:** You can call methods directly on both variables and literals:
            * `String s = "foo"; String t = s.substring(1);` -> `"oo"` (from index 1 to end).
            * `"Go! Now!".substring(1, 3)` -> `"o!"` (Java uses a half-open interval `[beginIndex, endIndex)` — index 1 inclusive, index 3 exclusive).
          * **Immutability (*immutabilité*):** Once created, a `String` object's content **cannot change**. Every operation (`+=`, `substring`, `toUpperCase`) allocates and returns a **new** `String` object. For repeated modifications (e.g., inside loops), use **`StringBuilder`**.

      - id: diag-stack-heap-refs
        block_type: kroki
        diagram_type: mermaid
        title: "Stack vs. Heap: Primitives, Reference Aliasing & String Immutability"
        caption: "Primitives store values directly on the stack. Object variables store references to heap objects; reassigning a reference can alias an object and orphan the previous one for the garbage collector."
        source: |
          flowchart LR
            subgraph Stack ["Stack (Local Variables)"]
              i["int i = 42\n(value stored directly)"]
              a["Person a"]
              b["Person b"]
              s["String s"]
              p["String p"]
            end

            subgraph Heap ["Heap (Objects)"]
              john["Person #1: John\n(Unreferenced -> GC!)"]
              paul["Person #2: Paul"]
              strA["String #32: 'a'\n(Still held by p)"]
              strAEx["String #33: 'a!'\n(Created by s += '!')"]
            end

            a -->|"after a = b"| paul
            b --> paul
            s -->|"after s += '!'"| strAEx
            p --> strA

            classDef prim fill:#f0f9ff,stroke:#0284c7,stroke-width:1.5px;
            classDef ref fill:#ede9fe,stroke:#6366f1,stroke-width:1.5px;
            classDef obj fill:#ecfdf5,stroke:#059669,stroke-width:1.5px;
            classDef gc fill:#ffe4e6,stroke:#e11d48,stroke-width:1.5px,stroke-dasharray: 5 5;

            class i prim;
            class a,b,s,p ref;
            class paul,strA,strAEx obj;
            class john gc;

      - id: code-string-immutability
        block_type: code
        language: java
        filename: StringTrace.java
        title: "Tracing String Immutability, Identity (==) & StringBuilder"
        code: |
          public class StringTrace {
              public static void main(String[] args) {
                  String s = "a";
                  String p = s;
                  System.out.println(p == s);          // true (same object)
                  s += "!";                            // allocates new String "a!"
                  System.out.println(p + " | " + s);   // a | a!
                  p = new String("a!");                // distinct object on heap
                  System.out.println(p == s);          // false (different identities)
                  System.out.println(p.equals(s));     // true (same content)
                  StringBuilder sb = new StringBuilder("Go");
                  sb.append("! Now!");                 // mutates in place
                  System.out.println(sb.toString());   // Go! Now!
              }
          }
        highlight_lines:
          - 4
          - 6
          - 8
          - 9
          - 10
          - 12
        annotations:
          - line: 4
            note: "Reference copy: p and s point to the exact same String object \"a\", so p == s is true."
          - line: 6
            note: "Strings are immutable: s += \"!\" creates a brand-new \"a!\" object; p still points to \"a\"."
          - line: 8
            note: "Now \"a\" has zero references left and is eligible for garbage collection. p points to a distinct \"a!\" object."
          - line: 9
            note: "== checks reference identity (memory location), NOT text content — returns false!"
          - line: 10
            note: "Use .equals() to compare String contents (returns true)."
          - line: 12
            note: "StringBuilder is mutable: append() modifies the internal buffer in place without creating temporary Strings."

  - id: sec-classes-constructors
    title: "4. Classes, Attributes, Methods & Constructors"
    description: "Class structure, implicit Object root, file naming rules, formal method signatures, constructors, default attribute values, overloading, and constructor chaining."
    blocks:
      - id: th-classes-methods
        block_type: markdown
        title: "Classes, Attributes (*Attributs*) & Methods (*Méthodes*)"
        content: |
          ### Classes & File Organization (Slide 19)
          * A **class** is the blueprint used to instantiate objects.
          * **Implicit root:** Every Java class implicitly inherits from `java.lang.Object`.
          * **Naming convention:** Class names start with an **uppercase** letter (`PascalCase`, e.g., `Person`).
          * **Source file rules:**
            * Usually one class is declared per `.java` file.
            * If a class is declared `public`, the file **must** have the exact same name plus `.java` (e.g., `public class Person` -> `Person.java`).
            * `javac` generates **one `.class` file per class** declared in the `.java` source file.

          ### Attributes (*Attributs / champs / variables membres*, Slide 20)
          * Define the **state** (*état*) of each instance; can be primitive types or object references.
          * Can specify an explicit initial value (e.g., `private int age = 18;` overrides the default `0`).
          * Should almost always have **`private`** visibility to enforce encapsulation.
          * **Naming convention:** Start with a **lowercase** letter (`camelCase`, e.g., `name`, `father`).
          * Accessed via **dot notation** (*notation pointée*): `aPerson.name = "John";` (only when accessible).

          ### Methods (*Méthodes / fonctions membres*, Slides 21–22)
          * Functions defined inside a class that operate on its instances; parameters and return values are primitives or object references (`void` if no value is returned).
          * **Naming convention:** Start with a **lowercase** letter (`camelCase`).
          * **Formal type signature** (Slide 22):
            $$\text{méthode} : \text{Classe} \times \text{Type}_1 \times \dots \times \text{Type}_n \to \text{TypeRésultat}$$
          * **Under the hood:** When you write `ref.methode(arg1, arg2)`, the compiler conceptually transforms the OOP call into a function call passing the receiver first: `methode(ref, arg1, arg2)`. That is why all attributes and methods of `ref` are implicitly available inside the method body, and why the receiver can be named explicitly with **`this`**.

      - id: th-constructors-defaults
        block_type: markdown
        title: "Constructors (*Constructeurs*), Default Values & Garbage Collection"
        content: |
          ### Why Constructors Exist (Slide 24)
          Relying on a separate `set(...)` method to initialize an object is fragile: nothing forces callers to invoke it. **Constructors** combined with encapsulation guarantee that every object is born in a **coherent state** (*état cohérent*).

          ### Constructor Rules (Slides 24–26)
          1. **Exact class name, NO return type** — not even `void`! (Adding `void Person(...)` turns it into an ordinary method, not a constructor.)
          2. **Invoked via `new`:** `Person p = new Person("John", 22);`
          3. **Implicit Default Constructor (*constructeur par défaut*):**
             * If a class defines **zero** constructors, the compiler automatically synthesizes a 0-parameter default constructor.
             * It initializes every attribute to its **type default value**:
               * Numeric types (`byte`, `short`, `int`, `long`, `float`, `double`): **`0`** (or `0.0`)
               * `boolean`: **`false`**
               * `char`: **`'\u0000'`** (*caractère de code nul*)
               * Object references (including `String`): **`null`**
          4. **Loss of the Default Constructor (High-Frequency Exam Trap!):**
             * As soon as you declare **even one explicit constructor**, the compiler **stops generating** the implicit default constructor (*celui par défaut est perdu*). Calling `new Person()` will then fail to compile unless you also define a 0-arg constructor explicitly.
          5. **Constructor Overloading (*surcharge*):** A class may declare multiple constructors as long as their parameter lists differ (number or types of parameters).
          6. **Constructor Chaining (`this(...)`):** One constructor can delegate to another constructor of the same class using `this(args);`.
             * **Mandatory rule:** `this(...)` **must be the very first statement** of the constructor body.
          7. **No Destructors (*pas de destructeurs*):** Unlike C++, Java has no destructors; unreferenced objects are reclaimed automatically by the **garbage collector** (*ramasse-miettes*).

      - id: diag-person-uml
        block_type: kroki
        diagram_type: plantuml
        title: "UML Class Diagram: Object Root, Person & Vector"
        caption: "Every Java class implicitly inherits from Object. Private attributes (-) enforce encapsulation while public constructors and methods (+) expose a safe interface."
        source: |
          @startuml
          skinparam classAttributeIconSize 0
          skinparam classBackgroundColor #f8fafc
          skinparam classBorderColor #475569

          class Object {
            + toString(): String
            + equals(obj: Object): boolean
          }

