      - id: ref-pass-by-value-rubric
        block_type: reflection_rubric
        title: "Synthesis: Pass-by-Value & Class-Level Encapsulation"
        prompt: |
          A classmate argues: *"Java passes objects by reference — look at `x.swap(y)` on `IntBox`, it modified `y.value`! And `Vector.addTo(Vector v)` breaks encapsulation because it reads `v.x` even though `x` is `private`."*

          Write a clear, exam-ready rebuttal addressing both claims.
        self_check_criteria:
          - "Stated clearly that Java uses EXCLUSIVELY pass-by-value for all parameters."
          - "Explained that for objects, the reference itself is copied by value, so both references point to the same heap object (allowing field mutation, while reassigning the parameter variable does NOT affect the caller)."
          - "Contrasted mutable objects with primitives and immutable objects (String, wrapper classes) where no mutation is possible."
          - "Explained that Java's unit of encapsulation is the class, not the individual object, which is why Vector.addTo(Vector v) can legally access v.x."
        model_answer: |
          1. **Java is strictly pass-by-value:** When passing an object to a method, Java copies the *reference* (not the object) into the formal parameter. Because the copied reference points to the exact same heap object, `x.swap(y)` can mutate `other.value`. However, if `swap` executed `other = new IntBox(99);`, the caller's variable `y` would remain untouched — proving it is pass-by-value of a reference, not true pass-by-reference. For primitives and immutable objects (`String`, `Integer`), callers never observe any mutation.
          2. **Class-level encapsulation:** In Java, `private` restricts access to code outside the *class*, not outside the *instance*. Because `addTo(Vector v)` is declared inside `Vector`, it has full access to `v.x` and `v.y` on any `Vector` instance.

  - id: sec-diagnostics
    title: "6. Diagnostic Retrieval & Exam Traps"
    description: "Exam-calibrated diagnostic questions targeting JVM execution, primitive literal rules, String immutability, default constructor loss, this() chaining, and parameter passing."
    blocks:
      - id: qz-jvm-jit
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 2
        related_block_id: th-java-overview
        title: "JVM Bytecode & Just-In-Time (JIT) Compilation"
        question: "Which statement accurately describes how the Java Virtual Machine (JVM) achieves both portability and high runtime performance?"
        options:
          - "`javac` compiles `.java` files into platform-independent bytecode (`.class`); the JVM interprets it and JIT-compiles hot paths into native machine code at runtime."
          - "`javac` compiles `.java` files directly into CPU-specific native binaries, and the JVM only manages garbage collection."
          - "The JVM parses raw `.java` source files directly at runtime without any prior compilation step, exactly like a pure interpreter."
          - "The JVM guarantees completely predictable real-time performance with zero warmup time because bytecode is pre-optimized."
        correct_answer: "`javac` compiles `.java` files into platform-independent bytecode (`.class`); the JVM interprets it and JIT-compiles hot paths into native machine code at runtime."
        explanation: |
          Java uses a hybrid model: `javac` compiles source code into portable **bytecode** (`.class`), which enables *Write once, run anywhere*. At runtime, the JVM interprets bytecode, profiles execution to identify **hot paths** (*portions chaudes*), and compiles them on-the-fly (**Just-In-Time**) into native machine code with profile-guided optimizations like inlining.

          * Compiling directly to native binaries describes C/C++, not standard `javac`.
          * Parsing raw source at runtime describes pure interpreters, ignoring `.class` bytecode.
          * The JVM actually has *less* predictable performance and a measurable **warmup time** (*temps de chauffe*) due to class loading, JIT compilation, and garbage collection.
        hints:
          - "Recall the two-stage pipeline shown in Slide 11: what does `javac` output, and what does `java` run?"
          - "Think about why Slide 10 says the JVM 'combines the best of both worlds' (compiled + interpreted)."

      - id: qz-primitive-literals
        block_type: quiz_question
        question_type: multi_select
        difficulty: 3
        related_block_id: th-primitives-wrappers
        title: "Primitive Types, Signedness & Literals"
        question: "Which of the following statements about Java primitive types and literals are TRUE?"
        options:
          - "All four integer primitive types (`byte`, `short`, `int`, `long`) are strictly signed in Java."
          - "A floating-point literal such as `3.14` has type `double` by default."
          - "`String` is a 16-bit primitive type built directly into the JVM."
          - "Assigning an integer literal like `100` to a `byte` variable (`byte b = 100;`) performs an implicit conversion because `100` fits in the `byte` range."
          - "Java supports the `&` address-of operator on primitive variables, just like C++."
        correct_answer:
          - "All four integer primitive types (`byte`, `short`, `int`, `long`) are strictly signed in Java."
          - "A floating-point literal such as `3.14` has type `double` by default."
          - "Assigning an integer literal like `100` to a `byte` variable (`byte b = 100;`) performs an implicit conversion because `100` fits in the `byte` range."
        explanation: |
          * **True:** Java's integer types (`byte`, `short`, `int`, `long`) are all signed (Slide 13).
          * **True:** Floating-point literals (`3.14`, `3.14E2`) default to `double`, while integer literals default to `int`.
          * **True:** When an `int` literal's value is within the target range (`-128..127` for `byte`), Java implicitly converts it during assignment.
          * **False:** `String` is a **class**, NOT a primitive type (`char` is the 16-bit Unicode primitive).
          * **False:** Java explicitly forbids taking variable addresses with `&` (Slide 14).
        hints:
          - "Check Slide 13 carefully: is `String` a primitive type or a class?"
          - "Remember the C++ vs. Java difference regarding pointers and the `&` operator."

      - id: qz-string-identity-output
        block_type: quiz_question
        question_type: code_output
        difficulty: 3
        related_block_id: code-string-immutability
        title: "Predict Output: String Immutability & Identity (`==`)"
        question: |
          What does the following Java snippet print?

          ```java
          String s = "a";
          String p = s;
          boolean b1 = (p == s);
          s += "!";
          boolean b2 = (p == s);
          p = new String("a!");
          boolean b3 = (p == s);
          boolean b4 = p.equals(s);
          System.out.println(b1 + " " + b2 + " " + b3 + " " + b4);
          ```
        options:
          - "true false false true"
          - "true true true true"
          - "true false true true"
          - "false false false true"
        correct_answer: "true false false true"
        explanation: |
          Trace each reference step by step (Slide 18):
          1. `String s = "a"; String p = s;` -> `p` and `s` hold the exact same reference -> `b1 = (p == s)` is **`true`**.
          2. `s += "!";` -> Because `String` is **immutable**, Java creates a new `"a!"` object and updates `s` to point to it; `p` still points to `"a"` -> `b2 = (p == s)` is **`false`**.
          3. `p = new String("a!");` -> Allocates a distinct `"a!"` object on the heap (`"a"` is now unreferenced). `p` and `s` point to two different objects -> `b3 = (p == s)` is **`false`**.
          4. `p.equals(s)` -> Compares character contents (`"a!"` vs `"a!"`) -> `b4` is **`true`**.

          * `true true true true` assumes `s += "!"` mutates `"a"` in place (wrong — `String` is immutable).
          * `true false true true` confuses `==` (object identity) with `.equals()` (value equality).
          * `false false false true` misses that `p = s` copies the reference to the exact same object.
        hints:
          - "Does `s += \"!\"` modify the existing `String` object or create a new one?"
          - "What is the difference between `==` and `.equals()` on object references?"

      - id: qz-default-constructor-loss
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: th-constructors-defaults
        title: "Default Constructor & Implicit Loss"
        question: |
          Consider the following class:

          ```java
          public class Book {
              private String title;
              private int pages;

              public Book(String title) {
                  this.title = title;
              }
          }
          ```

          What happens when another class executes `Book b = new Book();`?
        options:
          - "Compilation error: declaring `Book(String)` causes the compiler to stop generating the implicit default constructor."
          - "It compiles and creates a `Book` with `title = null` and `pages = 0`."
          - "It compiles, but throws a `NullPointerException` at runtime."
          - "It compiles and calls `Book(String)` with `title = \"\"`."
        correct_answer: "Compilation error: declaring `Book(String)` causes the compiler to stop generating the implicit default constructor."
        explanation: |
          According to Java's constructor rules (Slide 25), the compiler synthesizes a 0-argument **default constructor** (*constructeur par défaut*) **only if the class defines no constructors at all**. As soon as `Book(String)` is declared, the implicit default constructor is lost (*perdu*), so `new Book()` fails to compile.

          * Creating a `Book` with `null` and `0` would only happen if *no* constructors were declared, or if a 0-arg `public Book() {}` were explicitly written.
          * This is a compile-time error, not a runtime exception, and Java never invents an empty string `""` for missing arguments.
        hints:
          - "When does the Java compiler generate a default 0-argument constructor?"
          - "What happens to the default constructor once you write your own constructor?"

      - id: qz-this-chaining-rule
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: code-person-constructors
        title: "Constructor Chaining with `this(...)`"
        question: |
          Why does the following constructor fail to compile?

          ```java
          public class Person {
              private String name;
              private int age;

              public Person(String name, int age) {
                  this.name = name;
                  this.age = age;
              }

              public Person(String name) {
                  System.out.println("Creating " + name);
                  this(name, 0);
              }
          }
          ```
        options:
          - "A constructor call `this(...)` must be the very first statement inside the constructor body."
          - "A constructor cannot call another constructor of the same class; only `super(...)` is allowed."
          - "Calling `this(name, 0)` causes infinite recursion because it invokes `Person(String)` again."
          - "`System.out.println` cannot be used inside a constructor."
        correct_answer: "A constructor call `this(...)` must be the very first statement inside the constructor body."
        explanation: |
          In Java (Slide 26), delegating to another constructor via `this(...)` is completely valid and avoids duplicating initialization logic, **provided it is the very first statement** of the constructor. Placing `System.out.println(...)` before `this(name, 0);` causes a compile-time error.

          * `this(...)` is legal in constructors alongside `super(...)` (though not both in the same constructor).
          * `this(name, 0)` matches the 2-argument overload `Person(String, int)`, so there is no recursion.
          * Logging or side effects are legal in constructors *after* `this(...)`.
        hints:
          - "Look at the order of statements inside `Person(String name)`."
          - "Recall the strict placement rule for `this(...)` from Slide 26."

      - id: qz-pass-by-value-output
        block_type: quiz_question
        question_type: code_output
        difficulty: 4
        related_block_id: th-param-passing-this
        title: "Predict Output: Pass-by-Value with Object References"
        question: |
          Consider the following Java program:

          ```java
          public class Main {
              static class Box {
                  int val;
                  Box(int v) { this.val = v; }
              }

              static void trick(Box b, int n) {
                  b.val = 10;
                  b = new Box(99);
                  b.val = 50;
                  n = 77;
              }

              public static void main(String[] args) {
                  Box x = new Box(1);
                  int k = 5;
                  trick(x, k);
                  System.out.println(x.val + " " + k);
              }
          }
          ```

          What is printed to the console?
        options:
          - "10 5"
          - "50 5"
          - "1 5"
          - "50 77"
        correct_answer: "10 5"
        explanation: |
          Java passes **all** arguments strictly **by value** (Slide 28):
          1. `b` receives a copy of the reference `x` (both point to `Box(1)`).
          2. `b.val = 10;` mutates the shared heap object — so `x.val` is now **`10`**.
          3. `b = new Box(99);` reassigns only the local parameter copy `b` to a new object; `x` still points to the original object!
          4. `b.val = 50;` mutates only the new `Box(99)` object, leaving `x.val` at `10`.
          5. `n = 77;` modifies only the local `int` copy; `k` remains **`5`**.

          * `50 5` mistakenly assumes Java is pass-by-reference for objects (thinking `b = new Box(99)` rebinds `x`).
          * `1 5` mistakenly assumes Java copies the entire `Box` object on call.
          * `50 77` assumes both objects and primitives are passed by reference.
        hints:
          - "Trace which heap object `x` points to before and after `b = new Box(99);`."
          - "Remember: reassigning a formal parameter never changes the caller's variable in Java."
          - "Check `k` separately: primitives are always copied by value."

      - id: qz-class-encapsulation-chaining
        block_type: quiz_question
        question_type: code_output
        difficulty: 4
        related_block_id: th-param-passing-this
        title: "Predict Output: `this` Chaining & Class-Level Encapsulation"
        question: |
          Consider the `Vector` class from Slide 32:

          ```java
          class Vector {
              private int x, y;
              Vector(int x, int y) { this.x = x; this.y = y; }
              Vector addTo(Vector v) {
                  this.x += v.x;
                  this.y += v.y;
                  return this;
              }
              public String toString() { return "(" + x + ", " + y + ")"; }
          }
          ```

          What is the result of executing:

          ```java
          Vector v1 = new Vector(1, 0);
          Vector v2 = new Vector(42, 42);
          Vector v3 = new Vector(-1, -1);
          v1.addTo(v2).addTo(v3);
          System.out.println(v1 + " " + v2);
          ```
        options:
          - "(42, 41) (42, 42)"
          - "Compilation error: `v.x` and `v.y` are `private` and cannot be accessed from another `Vector` instance."
          - "(42, 41) (41, 41)"
          - "(1, 0) (42, 42)"
        correct_answer: "(42, 41) (42, 42)"
        explanation: |
          1. **Class-level encapsulation:** Accessing `v.x` and `v.y` inside `Vector.addTo` is completely valid because `private` in Java restricts access per **class**, not per individual object.
          2. **Method chaining:** `v1.addTo(v2)` mutates `v1` to `(1+42, 0+42) = (43, 42)` and returns `this` (i.e., `v1`). Then `.addTo(v3)` mutates `v1` again to `(43-1, 42-1) = (42, 41)`.
          3. `v2` is only read, never mutated, so it stays `(42, 42)`.

          * The compilation-error distractor reflects the common misconception that `private` is object-level rather than class-level.
          * `(42, 41) (41, 41)` assumes `.addTo(v3)` was applied to `v2` instead of `this` (`v1`).
          * `(1, 0) (42, 42)` assumes `addTo` returns a new `Vector` without mutating `v1`.
        hints:
          - "In Java, is `private` enforced per object or per class?"
          - "What reference does `v1.addTo(v2)` return, and which object does `.addTo(v3)` mutate?"

      - id: qz-memory-gc-multi
        block_type: quiz_question
        question_type: multi_select
        difficulty: 4
        related_block_id: th-references-strings
        title: "Memory Management, Wrappers & Object Lifecycle"
        question: "Which of the following statements about Java's object lifecycle and wrapper classes are TRUE?"
        options:
          - "Java has no destructors; objects that are no longer referenced are automatically reclaimed by the garbage collector (*ramasse-miettes*)."
          - "Wrapper classes (`Integer`, `Double`, `Boolean`, etc.) are immutable — once created, their internal value cannot be changed."
          - "Every Java class implicitly inherits from `Object`."
          - "After executing `Person a = new Person(\"John\"); Person b = new Person(\"Paul\"); a = b;`, the `John` object is copied into `b`."
          - "A `.java` file containing a `public class Invoice` can be named `Main.java` as long as it has a `main` method."
        correct_answer:
          - "Java has no destructors; objects that are no longer referenced are automatically reclaimed by the garbage collector (*ramasse-miettes*)."
          - "Wrapper classes (`Integer`, `Double`, `Boolean`, etc.) are immutable — once created, their internal value cannot be changed."
          - "Every Java class implicitly inherits from `Object`."
        explanation: |
          * **True:** Java has no destructors (Slide 26); the garbage collector automatically frees unreferenced objects.
          * **True:** Wrapper classes (`Byte`, `Short`, `Integer`, `Long`, `Float`, `Double`, `Boolean`, `Character`) are immutable and have no `set` methods (Slide 15).
          * **True:** `Object` is the implicit root of every Java class hierarchy (Slide 19).
          * **False:** `a = b;` copies the *reference* to `Paul` into `a`, leaving `John` unreferenced and eligible for GC — it never copies `John` into `b` (Slide 16).
          * **False:** A `public` class must live in a file with the exact same name (`Invoice.java`, Slide 19).
