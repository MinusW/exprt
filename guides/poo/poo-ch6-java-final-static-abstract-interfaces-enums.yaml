sections:
  - id: sec-final-keyword
    title: "1. The final Keyword: Immutability, Late Initialization & Locking Inheritance"
    description: "Understand what final locks (and what it does NOT lock) across primitives, references, arrays, parameters, methods, and classes."
    blocks:
      - id: th-final-overview
        block_type: markdown
        title: "final Across All Five Java Contexts"
        content: |
          In Java, the `final` keyword (*mot clef final*) carries one overarching meaning: **"cannot be modified"** (*ne peut être modifié*). However, *what* cannot be modified depends critically on where `final` appears.

          ### 1. Primitive Variables & Attributes (*variables de type primitif constantes*)
          Once assigned, a `final` primitive holds its value permanently (either a compile-time constant or assigned once at runtime):
          * `final int a = 4;` followed by `a = 5;` triggers a **compile-time error**.

          ### 2. Object References & Arrays (*références constantes*)
          A `final` reference locks the **arrow** (which object it points to), **not** the internal state of the referenced object:
          * `final Person p = new Person(...);`
            * `p.name = "neo";` is **legal** (mutating the object's state).
            * `p = anotherPerson;` is a **compile-time error** (reassigning the reference).
          * **Arrays are objects** manipulated through references:
            * `final int[] a = { 1, 2, 3, 4 };`
            * `a[2] = 42;` is **legal**; `a = anotherArray;` is a **compile-time error**.

          ### 3. Explicit vs. Late Initialization (*initialisation explicite ou tardive*)
          A `final` variable or attribute does **not** have to be initialized on its declaration line, but **Java never assigns a default value** (*pas d'initialisation à une valeur par défaut*) to a `final` datum:
          * **Explicit initialization (*initialisation explicite*):** `final int a = 4;`
          * **Late / blank `final` initialization (*initialisation tardive*):** `final int a;`
            * **Local variables:** must be definitely assigned somewhere in the enclosing block **before first use**.
            * **Instance attributes (*attributs*):** must be initialized **in an instance block or in every constructor** (at the latest).
            * **Static `final` attributes:** have no default value and no constructor, so they must be initialized **at declaration or in a `static { ... }` block**.

          ### 4. Method Parameters (*paramètres*)
          Declaring `void m(final Person p, final int i)` forbids reassigning `p` (`p = new Person()`) or modifying `i` (`++i`) inside `m`.
          * **Exam nuance:** Its practical value is limited (*intérêt limité*) because it **does not prevent** mutating the object referenced by `p` (e.g., `p.name = "Trinity"` remains completely legal).

          ### 5. Methods & Classes (*méthodes et classes*)
          | Context | Effect | Key Subtlety / Exam Trap |
          | :--- | :--- | :--- |
          | **`final` method** | Forbids **overriding** (*redéfinition*) and dynamic dispatch (*liaison dynamique*) in subclasses. | **`private` methods are implicitly `final`** (no dynamic dispatch). A subclass *can* legally declare a method with the exact same signature as a superclass's `private` (or `private final`) method — there is **no link** between them because the superclass method is hidden (*masquée*) from the subclass! |
          | **`final` class** | Forbids **specialization** / subclassing (`final class Leaf {}`). | All methods of a `final` class are effectively non-overridable. |

          > [!WARNING]
          > **Design Caution (Slide 106):** Marking classes or methods `final` without strong justification can be a **design mistake** (*erreur de conception*) because it prematurely limits class reusability and extensibility.

      - id: code-final-contexts
        block_type: code
        title: "Annotated Walkthrough: Every final Context & the private Trap"
        language: java
        filename: "FinalDemo.java"
        code: |
          class Base {
              final int id;
              final int[] scores = { 10, 20, 30 };
              Base(int id) {
                  this.id = id;
              }
              private final void secret() {
                  System.out.println("Base.secret");
              }
              final void locked(final int x, final int[] arr) {
                  arr[0] = x;
                  // x++;            // Compile error: final parameter
                  // arr = new int[1]; // Compile error: final reference
              }
          }
          class Sub extends Base {
              Sub(int id) { super(id); }
              void secret() {
                  System.out.println("Sub.secret (NOT an override!)");
              }
              // void locked(int x, int[] arr) {} // Compile error: cannot override final
          }
          final class Leaf extends Sub {
              Leaf(int id) { super(id); }
          }
        highlight_lines: [2, 5, 7, 11, 18, 23]
        annotations:
          - line: 2
            note: "Late initialization (initialisation tardive): no default 0 is assigned; every constructor must initialize id."
          - line: 5
            note: "Legal: initializes the blank final attribute id inside the constructor."
          - line: 7
            note: "private methods are implicitly final (no dynamic dispatch). Adding final is redundant."
          - line: 11
            note: "Mutating elements of a final array parameter is legal; only reassigning arr or modifying x is forbidden."
          - line: 18
            note: "Compiles! Because Base.secret() is private, it is invisible to Sub — Sub.secret() is a brand-new unrelated method, not an override."
          - line: 23
            note: "A final class cannot be extended by any subclass."

      - id: fc-final-five-contexts
        block_type: flashcard
        title: "The 5 Contexts of final in Java"
        front: "Summarize what `final` prevents (and what it still allows) in all 5 Java contexts: (1) primitive, (2) reference/array, (3) parameter, (4) method, (5) class."
        back: |
          1. **Primitive (`final int a`):** Value cannot be reassigned after single initialization (no default value if late-initialized).
          2. **Reference / Array (`final Person p`, `final int[] a`):** Reference cannot be rebound (`p = ...` forbidden), **but the target object/array elements CAN still be mutated** (`p.name = ...`, `a[0] = 42`).
          3. **Parameter (`void m(final Person p)`):** Cannot reassign parameter inside the body; still allows mutating `p`'s fields.
          4. **Method (`final void f()`):** Cannot be overridden in subclasses. (`private` methods are implicitly `final`, yet subclasses may declare an unrelated method with the same signature.)
          5. **Class (`final class Leaf`):** Cannot be subclassed (no `extends Leaf`).
        hint: "Distinguish carefully between locking a reference arrow vs. locking the object's state, and remember the private-method visibility rule."
        tags: ["final", "immutability", "inheritance"]

  - id: sec-static-members
    title: "2. The static Keyword: Class Members, Hiding vs. Overriding & Static Imports"
    description: "Distinguish class-level state and behavior from instance-level polymorphism, and avoid the static method hiding trap."
    blocks:
      - id: th-static-attributes-methods
        block_type: markdown
        title: "Class Members (Membres de classe) & Dynamic Dispatch Trade-offs"
        content: |
          Members marked `static` belong to the **class itself** (*propriétés de classe*), not to individual object instances.

          ### 1. Static Attributes (*attributs statiques / de classe*)
          * Exist in **exactly one copy** for the entire class, shared by all instances (analogous to scoped global variables).
          * Classic pattern (Slide 109 `Cat` exercise): tracking total instances created, assigning unique IDs (`++count`), or maintaining a `static` collection of all living instances for class-wide operations (`Cat.info()`, `Cat.mreowAll()`).
          * **Dot notation (*notation pointée*):**
            * Preferred: `ClassName.staticAttr` / `ClassName.staticMethod(...)` (works with zero instances created).
            * Legal but **discouraged** (*déconseillé*): `instanceRef.staticAttr` / `instanceRef.staticMethod(...)` — creates the dangerous illusion of instance-level polymorphism.

          ### 2. Static Methods (*méthodes statiques / de classe*)
          * Independent of any object instance (e.g., `public static void main(String[] args)`).
          * **No implicit `this` parameter:** Its type signature is that of a plain function: $\text{Type}_1 \times \dots \times \text{Type}_n \to \text{TypeRésultat}$.
          * **Rule:** A `static` method **cannot directly access non-static (instance) attributes or methods** of its class because no object (`this`) exists.
          * **NO overriding & NO dynamic dispatch (*pas de redéfinition / liaison dynamique*):**
            * If a subclass declares a `static` method with the same signature as a superclass `static` method, this is **method hiding** (*masquage*), **not** overriding.
            * Which version executes is decided at **compile time** based purely on the **declared type** of the reference (or class name), never the runtime object type!

          ### 3. Design Trade-off: `static` vs. Instance `compare` (Slide 110)
          Suppose `class B extends A`, and we have:
          ```java
          A ref1 = new B(...);
          A ref2 = new B(...);
          ```
          * **Option 1 (static):** `static boolean compare(A obj1, A obj2)` called via `A.compare(ref1, ref2)`.
            * **No dynamic dispatch:** compares only the `A` slice of state, completely ignoring `B`'s extra fields.
          * **Option 2 (instance):** `boolean compare(A obj)` called via `ref1.compare(ref2)`.
            * **Dynamic dispatch works:** overriding `compare` in `B` lets `ref1.compare(ref2)` dispatch to `B::compare` and inspect `B`-level state too.

          ### 4. Static Imports (*importation statique*, Slide 113)
          Static imports allow using static fields/methods without prefixing the class name:
          * Single member: `import static java.lang.Math.PI;` → `Math.cos(PI * 2.15)`
          * Wildcard: `import static java.lang.Math.*;` → `cos(PI * 2.15)`
          * **Best practice:** Use sparingly; overusing wildcard static imports obscures where symbols originate and harms maintainability.

      - id: code-static-hiding-compare
        block_type: code
        title: "Static Method Hiding vs. Instance Overriding & Population Tracking"
        language: java
        filename: "StaticVsInstance.java"
        code: |
          import static java.lang.Math.PI;
          class Animal {
              static int population = 0;
              final int id;
              Animal() { this.id = ++population; }
              static String kind() { return "Animal (static)"; }
              String speak() { return "Generic sound"; }
          }
          class Cat extends Animal {
              static String kind() { return "Cat (static)"; }
              @Override
              String speak() { return "Cat #" + id + " meows!"; }
          }
          public class StaticVsInstance {
              public static void main(String[] args) {
                  Animal a = new Cat();
                  System.out.println(a.kind());
                  System.out.println(a.speak());
                  System.out.println("Pop: " + Animal.population + ", PI=" + PI);
              }
          }
        highlight_lines: [1, 3, 6, 10, 17, 18]
        annotations:
          - line: 1
            note: "Static import allows referencing PI directly without the Math. prefix."
          - line: 3
            note: "Single shared class attribute (attribut de classe) across all Animal and Cat instances."
          - line: 6
            note: "Static method: bound at compile time, no implicit this, cannot be overridden."
          - line: 10
            note: "Method HIDING (masquage), NOT overriding — adding @Override here would be a compile error!"
          - line: 17
            note: "Prints 'Animal (static)'! Resolved by declared type Animal, NOT runtime type Cat (and calling static via instance ref is discouraged)."
          - line: 18
            note: "Prints 'Cat #1 meows!' via dynamic dispatch (liaison dynamique) on runtime type Cat."

  - id: sec-initialization-blocks-order
    title: "3. Initialization Blocks, Local Variables & Exact JVM Initialization Order"
    description: "Trace static blocks, instance blocks, constructors, and the strict rules separating attributes from local variables."
    blocks:
      - id: th-init-blocks-and-locals
        block_type: markdown
        title: "Static Blocks, Instance Blocks, Attribute Matrix & Local Variable Rules"
        content: |
          Java lets you place executable **initialization blocks** (*blocs d'initialisation*) directly inside a class body. Multiple blocks of the same kind execute in **textual declaration order**.

          ### 1. The Two Kinds of Initialization Blocks (Slides 114–115)
          * **Instance / dynamic block (*bloc dynamique / d'instance*) `{ ... }`:**
            * Runs **every time an object is instantiated (`new`)**, **immediately before the constructor body**.
            * Acts like an anonymous default constructor shared by all constructors. Generally **avoided** (*en général, à éviter*) in favor of explicit constructors.
          * **Static block (*bloc statique*) `static { ... }`:**
            * Runs **once only**, the first time the class is loaded/referenced by the JVM (e.g., accessing a static field, calling a static method, or creating the first instance).
            * Cannot access non-static members of the class.

          **Slide 115 Mental Trace:**
          Given `class A { int x; static int y = 1, z, w; { x = 2; ++y; } static { ++z; } static void f() {} }`:
          1. Calling `A.f();` triggers class loading (no object created!): `y = 1`, `z` starts at `0` then `static { ++z; }` sets `z = 1`, `w = 0`.
          2. Executing `A.w = 2;` updates `A.w` to `2`.
          3. Executing `A a = new A();` skips the already-run `static` block, runs `{ x = 2; ++y; }`, leaving `a.x = 2`, `A.y = 2`, `A.z = 1`, `A.w = 2`.

          ### 2. Complete Attribute Initialization Matrix (Slides 111–112, 116–117)
          | Attribute Category | Default Value (`0`/`false`/`null`)? | Explicit at Declaration? | In `{ ... }` Instance Block? | In Constructor? | In `static { ... }` Block? |
          | :--- | :---: | :---: | :---: | :---: | :---: |
          | **Instance attribute** (`int x`) | Yes | Yes | Yes | Yes | No |
          | **`final` instance attribute** (`final int x`) | **No** | Yes | Yes | Yes (at latest) | No |
          | **`static` attribute** (`static int x`) | Yes | Yes | *(Can mutate, not init)* | *(Can mutate)* | Yes |
          | **`static final` attribute** (`static final int x`) | **No** | Yes | **No** | **No** | Yes |

          ### 3. Local Variables (*variables locales*) vs. `NullPointerException` (Slide 118)
          * **Local variables** (both primitives AND object references) are **NEVER default-initialized**. Reading an unassigned local variable is a **compile-time error** (*erreur à la compilation*):
            ```java
            Person p;
            p.print(); // Compile-time error: variable p might not have been initialized
            ```
          * Explicitly assigning `null` satisfies the compiler, shifting the bug to **runtime** (*erreur à l'exécution*):
            ```java
            Person p = null;
            p.print(); // Compiles, then throws NullPointerException at runtime!
            ```

      - id: diag-java-init-order
        block_type: kroki
        diagram_type: mermaid
        title: "Exact Java Class & Instance Initialization Order (With Inheritance)"
        caption: "Static initialization runs top-down once per class load; instance initialization runs top-down on every new Child() call, with each class's instance fields & blocks executing right before its own constructor body."
        source: |
          flowchart TD
            subgraph Load ["Phase 1: Class Loading (Runs ONCE on first reference)"]
              S1["1. Superclass static fields & static { } blocks\n(in textual declaration order)"]
              S2["2. Subclass static fields & static { } blocks\n(in textual declaration order)"]
              S1 --> S2
            end

            subgraph Inst ["Phase 2: Object Instantiation (Runs on EVERY new Child())"]
              I1["3. Superclass instance fields & { } blocks\n(in textual declaration order)"]
              I2["4. Superclass constructor body"]
              I3["5. Subclass instance fields & { } blocks\n(in textual declaration order)"]
              I4["6. Subclass constructor body"]
              I1 --> I2 --> I3 --> I4
            end

            S2 --> I1

            classDef stat fill:#e0e7ff,stroke:#4f46e5,stroke-width:2px;
            classDef superInst fill:#f0f9ff,stroke:#0284c7,stroke-width:2px;
            classDef subInst fill:#ecfdf5,stroke:#059669,stroke-width:2px;

            class S1,S2 stat;
            class I1,I2 superInst;
            class I3,I4 subInst;

      - id: code-init-order-trace
        block_type: code
        title: "Annotated Trace: Inheritance Initialization Sequence"
        language: java
        filename: "InitOrder.java"
        code: |
          class Parent {
              static final int P_CONST;
              static { P_CONST = 10; System.out.print("1 "); }
              { System.out.print("3 "); }
              Parent() { System.out.print("4 "); }
          }
          class Child extends Parent {
              static { System.out.print("2 "); }
              { System.out.print("5 "); }
              Child() { System.out.print("6 "); }
          }
          public class InitOrder {
              public static void main(String[] args) {
                  new Child();
                  System.out.print("| ");
                  new Child();
              }
          }
        highlight_lines: [2, 3, 4, 5, 8, 9, 10, 14, 16]
        annotations:
          - line: 2
            note: "Blank static final attribute: must be assigned in a static block since there is no constructor for static members."
          - line: 3
            note: "Step 1 (once): Superclass static block runs first when Child is loaded."
          - line: 4
            note: "Step 3 (every new): Superclass instance block runs right before Parent()."
          - line: 5
            note: "Step 4 (every new): Superclass constructor body runs before Child's instance blocks."
          - line: 8
            note: "Step 2 (once): Subclass static block runs immediately after Parent's static block."
          - line: 9
            note: "Step 5 (every new): Subclass instance block runs after Parent() finishes."
          - line: 10
            note: "Step 6 (every new): Subclass constructor body runs last."
          - line: 14
            note: "First instantiation prints: 1 2 3 4 5 6"
          - line: 16
            note: "Second instantiation skips static blocks and prints: 3 4 5 6 (full output: 1 2 3 4 5 6 | 3 4 5 6)."

      - id: fc-init-order
        block_type: flashcard
        title: "Exact 6-Step Java Initialization Order"
        front: "When `new Child()` is called for the first time (where `class Child extends Parent`), what is the exact 6-step execution order of static blocks, instance blocks, and constructors — and what changes on the second `new Child()`?"
        back: |
          **First `new Child()`:**
          1. `Parent` `static` fields & `static {}` blocks (declaration order)
          2. `Child` `static` fields & `static {}` blocks (declaration order)
          3. `Parent` instance fields & `{}` blocks (declaration order)
          4. `Parent` constructor body
          5. `Child` instance fields & `{}` blocks (declaration order)
          6. `Child` constructor body

          **Second `new Child()`:** Steps 1–2 are **skipped** (class already loaded); only Steps 3 → 4 → 5 → 6 execute!
        hint: "Static runs top-down once; then instance+constructor runs Parent-first, then Child."
        tags: ["initialization-order", "static-block", "inheritance"]

  - id: sec-abstract-classes
    title: "4. Abstract Classes: Factoring State & Enforcing Polymorphic Contracts"
    description: "Learn every rule governing abstract methods and abstract classes, and how they power dynamic dispatch via template methods."
    blocks:
      - id: th-abstract-classes
        block_type: markdown
        title: "Rules of Abstract Methods & Abstract Classes (Slides 119–122)"
        content: |
          ### 1. Abstract Methods (*méthodes abstraites*)
          An abstract method supplies **only its signature** (no `{ ... }` body); concrete subclasses must provide the implementation.
          * **Cannot be `private`:** It must be visible to subclasses so they can override it.
          * **Cannot be `static`:** Static methods belong to a class and cannot be overridden via dynamic dispatch.
          * **Formal parameter names are mandatory:** Even though there is no body, you must write parameter names (e.g., `abstract void draw(int width);`, not `abstract void draw(int);`).

          ### 2. Abstract Classes (*classes abstraites*)
          * **Cannot be instantiated directly:** `new A()` is a compile-time error.
          * **Mandatory `abstract` modifier:** Any class containing at least one abstract method **must** be declared `abstract`.
          * **Zero abstract methods allowed:** A class *can* be declared `abstract` even with **no abstract methods** — a clean idiom to forbid direct instantiation while still acting as a base class.
          * **Rich members allowed:** An abstract class can declare instance/static attributes, concrete methods, **and constructors** (invoked via `super(...)` from subclass constructors).
          * **Partial implementation rule:** A subclass of an abstract class that does not implement **all** inherited abstract methods must itself be declared `abstract`.
          * **Extending concrete classes:** An abstract class *can* inherit from a concrete class (in fact, every abstract class implicitly extends the concrete class `java.lang.Object`).

          ### 3. Why Abstract Classes Matter: Dynamic Dispatch & Factorization
          * **Polymorphic references:** Even though `new Displayable()` is illegal, `Displayable d = new Box();` is completely valid.
          * **Template-method pattern (Slide 121):** A concrete method inside an abstract class (e.g., `refresh()`) can safely call an `abstract` method (`display()`). At runtime, **dynamic dispatch** (*liaison dynamique*) automatically invokes the concrete subclass's `Box::display()`.
          * **State & behavior factorization (Slide 122):** In the `Animal` / `Dog` / `Cat` hierarchy, `Animal` factors out common attributes (`name`, `sound`) and concrete `speak()`, while subclasses supply specialized constructors or behavior.

      - id: code-abstract-template
        block_type: code
        title: "Abstract Class with Constructor, Template Method & Polymorphic Array"
        language: java
        filename: "AbstractDemo.java"
        code: |
          abstract class Animal {
              private final String name;
              protected Animal(String name) {
                  this.name = name;
              }
              abstract String sound();
              public void speak() {
                  System.out.println(getClass().getSimpleName() + " " + name + " says '" + sound() + "'");
              }
          }
          class Dog extends Animal {
              private final String bark;
              Dog(String name, String bark) { super(name); this.bark = bark; }
              @Override
              String sound() { return bark; }
          }
          class Cat extends Animal {
              Cat(String name) { super(name); }
              @Override
              String sound() { return "Mreow!"; }
          }
        highlight_lines: [1, 3, 6, 8, 13]
        annotations:
          - line: 1
            note: "Must be declared abstract because it contains the abstract method sound()."
          - line: 3
            note: "Abstract classes CAN have constructors to initialize factored state via super(...)."
          - line: 6
            note: "Abstract method: no body, cannot be private or static."
          - line: 8
            note: "Concrete method invoking abstract sound() — dynamic dispatch calls Dog::sound or Cat::sound at runtime."
          - line: 13
            note: "Subclass constructor delegates shared field initialization to Animal(String)."

  - id: sec-interfaces-sealed-default
    title: "5. Interfaces, Sealed Types & Default Methods"
    description: "Master Java interfaces, implicit modifiers, marker interfaces, runtime-evaluated constants, Java 17 sealed hierarchies, and Java 8+ default method conflict resolution."
    blocks:
      - id: th-interfaces-sealed-defaults
        block_type: markdown
        title: "Interfaces, Sealed Hierarchies & Default Method Rules (Slides 123–136)"
        content: |
          ### 1. Core Interface Semantics & Implicit Modifiers (Slides 123–125)
          An `interface` defines a **behavioral contract** (*contrat à respecter*) independent of the class inheritance tree:
          * A class can `extends` only **one** superclass, but can `implements` **multiple** interfaces (`class C implements I, J`).
          * An interface can `extends` **multiple** parent interfaces (`interface I extends I1, I2`).
          * **Implicit modifiers (always enforced by the compiler):**
            * Every abstract method in an interface is implicitly **`public abstract`**. Any implementing class must therefore declare the overridden method **`public`** (failing to write `public` reduces visibility to package-private and fails to compile!).
            * Every field in an interface is implicitly **`public static final`** (a constant).
          * **Zero ambiguity for abstract methods:** If both `I` and `J` declare `void m()`, `class C implements I, J` provides one `public void m()` satisfying both contracts.
          * **Inherited satisfaction (Slide 132):** If `class B extends A implements I`, and `A` already defines `public void f()`, then `B` inherits `A`'s implementation and only needs to implement the remaining methods of `I`.

          ### 2. Interface-Typed References, `instanceof` & Marker Interfaces (Slides 127–129)
          * You cannot instantiate an interface (`new I()` is illegal), but you can declare variables and arrays of interface type (`Displayable[] arr = { new Int(1), new Cat("Tom") };`, `Collection c = new LinkedList();`, `Iterator i = c.iterator();`).
          * **Type-checking rule:** `Object o = new A(); I i = o;` is a **compile-time error** because `Object` does not implement `I` (an explicit cast `(I) o` is needed).
          * **Marker interfaces (*interfaces de marquage*):** Empty interfaces like `interface Cloneable {}` carry metadata tested at runtime with `if (this instanceof Cloneable)`.
          * **Functional interfaces (*interfaces fonctionnelles*):** Interfaces with exactly one abstract method (SAM), eligible as targets for lambda expressions.

          ### 3. Interface Constants & Non-Constant Initializers (Slides 130–131)
          * Interface constants are accessible unqualified inside implementing classes, or via `I.MAX` / `A.MAX` outside.
          * **Subtle trap (Slide 131):** Even though interface fields are `public static final`, they can be initialized with **non-constant runtime expressions**:
            ```java
            interface I {
                Random r = new java.util.Random();
                int i = r.nextInt(10); // Evaluated once when I is loaded by the JVM!
            }
            ```
            Each run of the program can therefore print a different `I.i` value.

          ### 4. Sealed Classes & Interfaces (Java 17, Slide 126)
          A `sealed` class or interface (*classe/interface scellée*) restricts which types may extend or implement it via `permits`:
          ```java
          abstract sealed class Shape permits Square, Circle { }
          final class Square extends Shape { }
          ```
          Every permitted direct subtype **must** choose exactly one of three modifiers:
          * `final` — cannot be extended further (**classes only**, not interfaces),
          * `sealed` — continues restricting further subtypes with its own `permits`,
          * `non-sealed` — reopens the branch for arbitrary extension.

          ### 5. Default, Static & Private Methods in Interfaces (Java 8+, Slides 134–136)
          * **`default` methods (*méthodes par défaut*):** Provide a concrete body inside an interface (e.g., `default void action() { System.out.println("Action: " + actionNoise()); }`). An implementing class or sub-interface can:
            1. Inherit the default implementation unchanged,
            2. Override it with a custom implementation, or
            3. Redeclare it as `abstract` (forcing concrete subclasses to implement it).
          * **Conflict Resolution Rules (Diamond Problem):**
            1. **Class always wins over interface (Slide 135):** In `class B extends A implements I` where `A` has concrete `public void m()` and `I` has `default void m()`, **`A::m` is chosen automatically**.
            2. **More specific sub-interface wins:** If `J extends I` and both define `default void m()`, `J::m` wins.
            3. **Unrelated default conflict (Slide 136):** In `class A implements I, J` where both `I` and `J` define `default void m()`, the compiler reports an **ambiguity error** until `A` overrides `m()`. Inside `A.m()`, you can explicitly delegate to one parent default using **`I.super.m();`**.
          * **`static` methods in interfaces:** Invoked via `InterfaceName.method()`, never inherited by implementing classes.
          * **`private` methods in interfaces (Java 9+):** Helper methods sharing code between `default` or `static` methods inside the interface without exposing them publicly.

          ### 6. Abstract Class vs. Interface Quick Comparison
          | Dimension | Abstract Class (`abstract class`) | Interface (`interface`) |
          | :--- | :--- | :--- |
          | **Inheritance** | Single inheritance (`extends` 1 class) | Multiple implementation (`implements` N interfaces); interface `extends` N interfaces |
          | **State (Fields)** | Instance & static fields (any visibility, mutable or `final`) | Only `public static final` constants |
          | **Constructors** | Yes (called via `super(...)`) | **No** |
          | **Methods** | Concrete, `abstract`, `static`, `final`, any visibility | Implicitly `public abstract`, plus `default`, `static`, and `private` helpers |
          | **Design Role** | *"Is-a"* hierarchy sharing common state & base implementation | *"Can-do"* behavioral capability / contract across unrelated classes |

