      - id: fc-abstract-vs-interface
        block_type: flashcard
        title: "Abstract Class vs. Interface: Key Rules"
        front: "Compare `abstract class` and `interface` in Java on: (1) fields, (2) constructors, (3) multiple inheritance, (4) implicit method modifiers, and (5) `default` conflict precedence."
        back: |
          1. **Fields:** Abstract classes can have any instance/static fields; interfaces can only have `public static final` constants.
          2. **Constructors:** Abstract classes **can** have constructors; interfaces **cannot**.
          3. **Multiple inheritance:** A class `extends` 1 class, `implements` many interfaces; an interface `extends` many interfaces.
          4. **Implicit modifiers:** Interface methods without `default`/`static`/`private` are implicitly `public abstract`; abstract class methods default to package-private and concrete unless marked `abstract`.
          5. **Conflict precedence:** A superclass's concrete method **always beats** an interface's `default` method; conflicting sibling defaults require an explicit override (optionally using `I.super.m()`).
        hint: "Think state + single hierarchy vs. stateless contract + multiple capabilities."
        tags: ["abstract-class", "interface", "default-methods"]

      - id: exp-sandbox-abstract-interface
        block_type: sandbox
        runtime: java
        title: "Practice: Abstract Class + Conflicting Interface Default Methods"
        instructions: |
          Complete `Main.java` so that:
          1. `interface Greeter` has `default String tag() { return "GREET"; }`.
          2. `interface Logger` has `default String tag() { return "LOG"; }`.
          3. `abstract class Device` stores a `private final String name`, has a constructor `Device(String name)`, a getter `getName()`, and an `abstract String action();`.
          4. `class SmartBell extends Device implements Greeter, Logger`:
             * Resolves the `tag()` default-method conflict by returning `Greeter.super.tag() + "+" + Logger.super.tag()`.
             * Implements `action()` to return `"Ring!"`.
          5. `Main.main` prints `bell.getName() + " [" + bell.tag() + "]: " + bell.action()`.
        starter_code: |
          interface Greeter {
              default String tag() { return "GREET"; }
          }

          interface Logger {
              default String tag() { return "LOG"; }
          }

          abstract class Device {
              private final String name;
              protected Device(String name) {
                  this.name = name;
              }
              public String getName() { return name; }
              // TODO: declare abstract String action();
          }

          class SmartBell extends Device implements Greeter, Logger {
              SmartBell(String name) {
                  super(name);
              }
              // TODO: resolve the conflicting default method tag() using Greeter.super.tag() and Logger.super.tag()
              // TODO: implement action() returning "Ring!"
          }

          public class Main {
              public static void main(String[] args) {
                  SmartBell bell = new SmartBell("Doorbell");
                  // TODO: print bell.getName() + " [" + bell.tag() + "]: " + bell.action()
              }
          }
        expected_output: "Doorbell [GREET+LOG]: Ring!"
        solution: |
          interface Greeter {
              default String tag() { return "GREET"; }
          }

          interface Logger {
              default String tag() { return "LOG"; }
          }

          abstract class Device {
              private final String name;
              protected Device(String name) {
                  this.name = name;
              }
              public String getName() { return name; }
              abstract String action();
          }

          class SmartBell extends Device implements Greeter, Logger {
              SmartBell(String name) {
                  super(name);
              }
              @Override
              public String tag() {
                  return Greeter.super.tag() + "+" + Logger.super.tag();
              }
              @Override
              String action() {
                  return "Ring!";
              }
          }

          public class Main {
              public static void main(String[] args) {
                  SmartBell bell = new SmartBell("Doorbell");
                  System.out.println(bell.getName() + " [" + bell.tag() + "]: " + bell.action());
              }
          }
        hints:
          - "Interface methods are implicitly public, so your overriding `tag()` method in `SmartBell` MUST be declared `public String tag()`."
          - "To invoke a specific parent interface's default implementation, use the syntax `InterfaceName.super.methodName()` (i.e., `Greeter.super.tag()` and `Logger.super.tag()`)."
          - "Remember to add `abstract String action();` to `Device` and override it in `SmartBell`."

      - id: ref-abstract-vs-interface-rubric
        block_type: reflection_rubric
        title: "Architecture Decision: Abstract Class vs. Interface vs. Sealed Class"
        prompt: |
          You are designing a graphics engine where `Circle`, `Rectangle`, and `TextLabel` must all be `Drawable`, while `Circle` and `Rectangle` (and ONLY those two shapes) share `x`, `y` coordinates and a `color` field. Which Java constructs (`abstract class`, `interface`, `sealed`) would you assign to `Drawable` and `Shape`, and why?
        self_check_criteria:
          - "Chose an `interface` for `Drawable` because unrelated types (`TextLabel` and geometric shapes) share only a behavioral contract, not shared state."
          - "Chose an `abstract sealed class Shape permits Circle, Rectangle` to factor out shared instance fields (`x`, `y`, `color`) and constructor initialization while restricting the closed set of subtypes."
          - "Noted that each permitted subclass (`Circle`, `Rectangle`) must explicitly be declared `final`, `sealed`, or `non-sealed`."
          - "Explained that an interface cannot hold mutable instance state (`x`, `y`, `color`) or constructors."
        model_answer: |
          Make `Drawable` an **interface** (`interface Drawable { void draw(); }`) because `TextLabel` and geometric shapes do not need to share a common superclass or state — they only share a *"can-be-drawn"* contract. Make `Shape` an **`abstract sealed class Shape implements Drawable permits Circle, Rectangle`** because `Circle` and `Rectangle` share mutable instance state (`x`, `y`, `color`) and constructor logic, cannot be meaningfully instantiated as a generic `Shape`, and form a closed domain of exactly two permitted subtypes (each declared `final`, `sealed`, or `non-sealed`).

  - id: sec-enums
    title: "6. Type-Safe Enumerations (enum): Internals, Rich Behavior & Constant-Specific Bodies"
    description: "Discover how Java compiles enums into Enum subclasses, and how to equip enums with fields, constructors, EnumSet ranges, and per-constant abstract methods."
    blocks:
      - id: th-enums-deep-dive
        block_type: markdown
        title: "Type-Safe Enums Under the Hood (Slides 137–142)"
        content: |
          ### 1. Why Java `enum` Replaced Integer Constants (Slide 137)
          Before Java 5, developers used `static final int` constants (unsafe — any `int` could be passed) or manually coded the Typesafe Enum pattern (a class with a `private` constructor and `public static final` singleton instances).
          * Java 5 introduced `enum Season { Spring, Summer, Autumn, Winter }`.
          * Enum constants are **singleton objects**, so they can be compared safely with `==` (`if (season == Season.Spring)`) as well as `.equals()`.
          * Enums work directly in **`switch`** statements using unqualified constant names (`case Summer:`).

          ### 2. What the Compiler Actually Generates (`javap -private Season`, Slide 138)
          ```java
          final class Season extends java.lang.Enum<Season> {
              public static final Season Spring, Summer, Autumn, Winter;
              private static final Season[] $VALUES;
              public static final Season[] values();      // returns a defensive COPY of $VALUES!
              public static Season valueOf(String name);  // lookup by exact name (throws IllegalArgumentException if invalid)
              private Season(String name, int ordinal);   // always private!
              static { /* initializes Spring..Winter and $VALUES */ }
          }
          ```
          **Key methods inherited from `java.lang.Enum`:**
          | Method | `final`? | Behavior |
          | :--- | :---: | :--- |
          | `public final String name()` | **Yes** | Returns the exact constant identifier (e.g., `"Spring"`). Cannot be overridden. |
          | `public final int ordinal()` | **Yes** | Returns the 0-based declaration index (`0`, `1`, `2`, `3`). Cannot be overridden. |
          | `public final boolean equals(Object o)` | **Yes** | Reference identity comparison (`this == o`). |
          | `public final int compareTo(E o)` | **Yes** | Compares by `ordinal()` order (enums are implicitly `Comparable` and `Serializable`). |
          | `public String toString()` | **No!** | Defaults to `name()`, **can be overridden** for custom formatting! |

          ### 3. Rich Enums: Fields, Constructors, Methods & `EnumSet` (Slides 139–140)
          Because an `enum` is a full-fledged class:
          * It can define **attributes**, **constructors** (implicitly `private` — declaring `public` or `protected` is a compile error!), concrete methods (e.g., `next()` via `values()[(ordinal() + 1) % array.length]`), and `implements` interfaces.
          * It **cannot `extends` another class** because it already implicitly extends `java.lang.Enum`.
          * **`EnumSet.range(Day.mon, Day.fri)`** (in `java.util.EnumSet`) iterates efficiently over an inclusive range of enum constants.

          ### 4. Constant-Specific Abstract Methods (Slide 141)
          An `enum` can declare an `abstract` method and provide a **distinct implementation inside each constant**:
          ```java
          enum Operation {
              plus  { int eval(int x, int y) { return x + y; } },
              minus { int eval(int x, int y) { return x - y; } };
              abstract int eval(int x, int y);
          }
          ```
          * **Under the hood:** Each enum constant (`plus`, `minus`) is the unique instance of an **anonymous subclass** (*sous-classe anonyme*) of `Operation` that implements `eval(int, int)`. (Consequently, the compiled `Operation` class is `abstract` rather than `final`.)

      - id: code-enum-rich-operation
        block_type: code
        title: "Rich Enum with Constructor, Overridden toString() & Constant-Specific Method"
        language: java
        filename: "EnumShowcase.java"
        code: |
          import java.util.EnumSet;
          enum Number {
              One(1), Two(2), Three(3);
              private final int value;
              Number(int value) {
                  this.value = value;
              }
              @Override
              public String toString() {
                  return super.toString() + " (" + value + ")";
              }
          }
          enum Operation {
              plus { int eval(int x, int y) { return x + y; } },
              minus { int eval(int x, int y) { return x - y; } };
              abstract int eval(int x, int y);
          }
          public class EnumShowcase {
              public static void main(String[] args) {
                  for (Number n : EnumSet.range(Number.One, Number.Two))
                      System.out.println(n + " [ord=" + n.ordinal() + "]");
                  System.out.println("4 plus 3 = " + Operation.plus.eval(4, 3));
              }
          }
        highlight_lines: [3, 5, 9, 14, 16, 20]
        annotations:
          - line: 3
            note: "Parameterized enum constants invoke the private constructor; semicolon is required when members follow."
          - line: 5
            note: "Enum constructors are implicitly private (public/protected is forbidden)."
          - line: 9
            note: "toString() is NOT final in java.lang.Enum, so it can be overridden (unlike name() and ordinal())."
          - line: 14
            note: "Constant-specific class body: compiled as an anonymous subclass of Operation."
          - line: 16
            note: "Abstract method forces every enum constant to supply its own implementation."
          - line: 20
            note: "EnumSet.range(from, to) creates an efficient inclusive set of enum constants."

      - id: exp-sandbox-rich-enum
        block_type: sandbox
        runtime: java
        title: "Practice: Rich Enum with Fields, Cycling & Constant-Specific Method"
        instructions: |
          Complete `enum Season` in `Main.java` (inspired by Slides 140–142) so that:
          1. Each constant (`Spring`, `Summer`, `Fall`, `Winter`) stores a `private final int avgTemp` (`15`, `26`, `12`, `2`) initialized via a constructor.
          2. Each constant implements an abstract method `abstract String vibe();` returning `"Blooming"`, `"Sunny"`, `"Crisp"`, `"Snowy"` respectively.
          3. `Season` overrides `toString()` to return `name() + "(" + ordinal() + "," + avgTemp + "C)"`.
          4. `Season` defines `public Season next()` returning the next season cyclically (so `Winter.next()` returns `Spring`).
          5. `Main.main` prints each season's `toString()`, `vibe()`, and `next().name()` as shown in `starter_code`.
        starter_code: |
          enum Season {
              Spring(15) { String vibe() { return "Blooming"; } },
              Summer(26) { String vibe() { return "Sunny"; } },
              Fall(12)   { String vibe() { return "Crisp"; } },
              Winter(2)  { String vibe() { return "Snowy"; } };

              private final int avgTemp;

              Season(int avgTemp) {
                  this.avgTemp = avgTemp;
              }

              abstract String vibe();

              // TODO: implement public Season next() using values() and ordinal()

              // TODO: override public String toString() to return name() + "(" + ordinal() + "," + avgTemp + "C)"
          }

          public class Main {
              public static void main(String[] args) {
                  Season s = Season.valueOf("Winter");
                  System.out.println(s + " -> " + s.vibe() + " -> next=" + s.next().name());
              }
          }
        expected_output: "Winter(3,2C) -> Snowy -> next=Spring"
        solution: |
          enum Season {
              Spring(15) { String vibe() { return "Blooming"; } },
              Summer(26) { String vibe() { return "Sunny"; } },
              Fall(12)   { String vibe() { return "Crisp"; } },
              Winter(2)  { String vibe() { return "Snowy"; } };

              private final int avgTemp;

              Season(int avgTemp) {
                  this.avgTemp = avgTemp;
              }

              abstract String vibe();

              public Season next() {
                  Season[] all = values();
                  return all[(ordinal() + 1) % all.length];
              }

              @Override
              public String toString() {
                  return name() + "(" + ordinal() + "," + avgTemp + "C)";
              }
          }

          public class Main {
              public static void main(String[] args) {
                  Season s = Season.valueOf("Winter");
                  System.out.println(s + " -> " + s.vibe() + " -> next=" + s.next().name());
              }
          }
        hints:
          - "Inside `next()`, call `values()` to get the array of all constants in declaration order, then index it with `(ordinal() + 1) % all.length`."
          - "In `toString()`, use `name()` (inherited `final` method from `Enum`) rather than `super.toString()`, plus `ordinal()` and `avgTemp`."

      - id: ref-feynman-enum-internals
        block_type: feynman_prompt
