  - id: sec-diagnostic-quiz
    title: "7. Diagnostic Knowledge Check (TE1 Exam Traps)"
    description: "Test your mastery against classic HEIG-VD POO exam traps: final references, private-final methods, static method hiding, initialization order traces, default method conflicts, and enum internals."
    blocks:
      - id: qz-final-reference-array
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 2
        related_block_id: th-final-overview
        title: "final Array & Object Reference Semantics"
        question: |
          Consider the following Java snippet:

          ```java
          final int[] nums = { 1, 2, 3 };
          nums[1] = 99;
          nums = new int[] { 4, 5, 6 };
          ```

          What happens when you compile and run this code?
        options:
          - "Line 2 compiles and mutates the array to {1, 99, 3}; Line 3 causes a compile-time error."
          - "Both Line 2 and Line 3 cause compile-time errors because a final array is deeply immutable."
          - "Line 2 throws an UnsupportedOperationException at runtime; Line 3 compiles."
          - "Both Line 2 and Line 3 compile because arrays are reference types."
        correct_answer: "Line 2 compiles and mutates the array to {1, 99, 3}; Line 3 causes a compile-time error."
        explanation: |
          In Java, arrays are objects accessed through references. Marking `nums` as `final` makes the **reference** constant, not the array contents:
          * `nums[1] = 99;` mutates an element inside the existing array object — completely legal.
          * `nums = new int[] { 4, 5, 6 };` attempts to reassign the `final` reference to a new array — **compile-time error**.
          * Distractor "deeply immutable" confuses `final` references with immutable objects (like `String`).
          * Distractor `UnsupportedOperationException` confuses arrays with unmodifiable collections (e.g., `List.of(...)`).
        hints:
          - "Ask yourself what `nums` actually stores in memory: the array's elements directly, or a reference to an array object on the heap?"
          - "Does `final` on a reference variable freeze the reference itself or the heap object it points to?"

      - id: qz-final-private-method
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 4
        related_block_id: code-final-contexts
        title: "The private final Method Subclass Trap"
        question: |
          Consider these two classes in the same package:

          ```java
          class Parent {
              private final void helper() { System.out.println("Parent"); }
          }
          class Child extends Parent {
              void helper() { System.out.println("Child"); }
          }
          ```

          What is the result of compiling this code?
        options:
          - "It compiles cleanly: Child.helper() is an unrelated new method because Parent.helper() is private and invisible to Child."
          - "Compile-time error: Child cannot override the final method Parent.helper()."
          - "Compile-time error: Child.helper() must be declared public or protected."
          - "Compiles, but throws IllegalAccessError at runtime when new Child().helper() is called."
        correct_answer: "It compiles cleanly: Child.helper() is an unrelated new method because Parent.helper() is private and invisible to Child."
        explanation: |
          As highlighted on Slide 106, `private` methods do **not** participate in dynamic dispatch and are implicitly `final`. Because `Parent.helper()` is invisible to `Child`, `Child.helper()` has **no link whatsoever** to `Parent.helper()` — it is **not** overriding it, so `final` on `Parent.helper()` does not block `Child` from defining its own `helper()`.
          * Distractor "cannot override the final method" would only apply if `Parent.helper()` were package-private, `protected`, or `public`.
          * Distractor "must be public or protected" mistakenly assumes overriding visibility rules apply here.
        hints:
          - "Can a subclass see or inherit a `private` method declared in its superclass?"
          - "If a method is invisible to the subclass, is the subclass *overriding* it or declaring an independent method?"

      - id: qz-static-hiding-dispatch
        block_type: quiz_question
        question_type: code_output
        difficulty: 4
        related_block_id: code-static-hiding-compare
        title: "Predict Output: Static Method Hiding vs. Dynamic Dispatch"
        question: |
          What does the following program print?

          ```java
          class A {
              static String s() { return "A.s"; }
              String m() { return "A.m"; }
          }
          class B extends A {
              static String s() { return "B.s"; }
              @Override
              String m() { return "B.m"; }
          }
          public class Test {
              public static void main(String[] args) {
                  A ref = new B();
                  System.out.println(ref.s() + " " + ref.m());
              }
          }
          ```
        options:
          - "A.s B.m"
          - "B.s B.m"
          - "A.s A.m"
          - "Compile-time error: cannot call static method s() on an instance reference ref"
        correct_answer: "A.s B.m"
        explanation: |
          * `ref.s()` invokes a **`static` method**. Static methods do **not** use dynamic dispatch (*liaison dynamique*); `B.s()` merely **hides** `A.s()`. The compiler binds `ref.s()` to the **declared type** of `ref` (`A`), returning `"A.s"`.
          * `ref.m()` invokes an **instance method**, which uses dynamic dispatch based on the **runtime type** (`B`), returning `"B.m"`.
          * Distractor `"B.s B.m"` mistakenly applies polymorphism to static methods.
          * Distractor `"Compile-time error"` is wrong because calling a static method via an instance reference is **legal** in Java (though discouraged precisely because of this trap!).
        hints:
          - "Is `s()` bound at compile time (declared type) or runtime (actual object type)?"
          - "Contrast how `ref.s()` (`static`) and `ref.m()` (instance) are dispatched when `A ref = new B();`."

      - id: qz-init-order-trace
        block_type: quiz_question
        question_type: code_output
        difficulty: 5
        related_block_id: diag-java-init-order
        title: "Predict Output: Exact Inheritance Initialization Order"
        question: |
          What is printed by the following program?

          ```java
          class Base {
              static { System.out.print("SB "); }
              { System.out.print("IB "); }
              Base() { System.out.print("CB "); }
          }
          class Derived extends Base {
              static { System.out.print("SD "); }
              { System.out.print("ID "); }
              Derived() { System.out.print("CD "); }
          }
          public class Main {
              public static void main(String[] args) {
                  new Derived();
                  new Derived();
              }
          }
          ```
        options:
          - "SB SD IB CB ID CD IB CB ID CD"
          - "SB IB CB SD ID CD IB CB ID CD"
          - "SB SD IB ID CB CD IB ID CB CD"
          - "SB SD IB CB ID CD SB SD IB CB ID CD"
        correct_answer: "SB SD IB CB ID CD IB CB ID CD"
        explanation: |
          Trace the exact 6-step JVM initialization order:
          1. **Class loading (runs ONCE):** `Base` static block (`SB`), then `Derived` static block (`SD`).
          2. **First `new Derived()`:** `Base` instance block (`IB`) → `Base` constructor (`CB`) → `Derived` instance block (`ID`) → `Derived` constructor (`CD`).
          3. **Second `new Derived()`:** Static blocks do NOT run again; only instance initialization repeats: `IB CB ID CD`.
          * `"SB IB CB SD ID CD ..."` wrongly interleaves static and instance initialization.
          * `"SB SD IB ID CB CD ..."` wrongly runs `Derived`'s instance block before `Base`'s constructor finishes.
          * `"SB SD ... SB SD ..."` wrongly re-executes `static` blocks on the second `new`.
        hints:
          - "Remember that ALL `static` blocks (Superclass then Subclass) finish before ANY instance block or constructor runs."
          - "Does a subclass's `{}` instance block run before or after the superclass's constructor body?"
          - "How many times do `static {}` blocks execute across two `new Derived()` calls?"

      - id: qz-attribute-local-init
        block_type: quiz_question
        question_type: multi_select
        difficulty: 3
        related_block_id: th-init-blocks-and-locals
        title: "Attribute vs. Local Variable Initialization Rules"
        question: "Which of the following statements about Java initialization are TRUE?"
        options:
          - "A blank static final attribute can be initialized inside a static { ... } block."
          - "A blank final instance attribute can be initialized inside an instance { ... } block or in every constructor."
          - "A local reference variable declared as Person p; is automatically initialized to null."
          - "Assigning Person p = null; compiles cleanly, and calling p.toString() throws NullPointerException at runtime."
        correct_answer:
          - "A blank static final attribute can be initialized inside a static { ... } block."
          - "A blank final instance attribute can be initialized inside an instance { ... } block or in every constructor."
          - "Assigning Person p = null; compiles cleanly, and calling p.toString() throws NullPointerException at runtime."
        explanation: |
          * `static final` attributes cannot be initialized in a constructor, but **can** be initialized either explicitly at declaration or inside a `static { ... }` block (Slide 117).
          * `final` instance attributes can be initialized at declaration, in an instance `{ ... }` block, or in every constructor at the latest (Slide 116).
          * `Person p = null;` explicitly initializes the local variable `p`, so compilation succeeds; dereferencing `p` triggers a runtime `NullPointerException` (Slide 118).
          * **False option:** Local variables are **never** default-initialized in Java (only non-`final` attributes receive default values like `0`, `false`, or `null`). Reading an unassigned local variable is a compile-time error.
        hints:
          - "Check the Attribute Initialization Matrix from Slides 116–117 for `final` and `static final`."
          - "Does Java give default values (`0`/`null`) to local variables inside methods, or only to non-`final` class/instance attributes?"

      - id: qz-abstract-class-rules
        block_type: quiz_question
        question_type: multi_select
        difficulty: 3
        related_block_id: th-abstract-classes
        title: "Valid & Invalid Abstract Class Rules"
        question: "Which of the following statements about Java abstract classes and methods are TRUE?"
        options:
          - "An abstract class may contain zero abstract methods (e.g., purely to forbid direct instantiation)."
          - "An abstract class can define constructors, which subclasses invoke via super(...)."
          - "A static method can be declared abstract so subclasses must provide their own class-level implementation."
          - "A concrete subclass extending an abstract class must implement all inherited abstract methods, otherwise it must also be declared abstract."
        correct_answer:
          - "An abstract class may contain zero abstract methods (e.g., purely to forbid direct instantiation)."
          - "An abstract class can define constructors, which subclasses invoke via super(...)."
          - "A concrete subclass extending an abstract class must implement all inherited abstract methods, otherwise it must also be declared abstract."
        explanation: |
          * An `abstract class` does **not** require any abstract methods (Slide 120) — declaring it `abstract` alone prevents `new MyClass()`.
          * Abstract classes can have attributes, concrete methods, and constructors (Slide 119).
          * Any subclass that leaves even one inherited abstract method unimplemented must itself be `abstract` (Slide 120).
          * **False option:** A `static` method **cannot** be `abstract` (nor can a `private` method), because `static` methods belong to the class and cannot be overridden via dynamic dispatch (Slide 119).
        hints:
          - "Recall the two modifiers that are strictly illegal on an `abstract` method because they prevent overriding."
          - "Can an abstract class initialize its own private fields when a concrete subclass is instantiated?"

      - id: qz-default-method-conflict
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 4
        related_block_id: diag-default-method-resolution
        title: "Default Method Diamond Resolution"
        question: |
          Consider the following definitions:

          ```java
          class A { public void m() { System.out.println("A"); } }
          interface I { default void m() { System.out.println("I"); } }
          interface J { default void m() { System.out.println("J"); } }

          class B extends A implements I { }
          class C implements I, J { }
          ```

          Which statement accurately describes compiling `B` and `C`?
        options:
          - "B compiles and uses A::m (class beats interface); C fails to compile until it overrides m() (optionally calling I.super.m() or J.super.m())."
          - "Both B and C fail to compile due to diamond ambiguity on m()."
          - "B compiles and uses I::m; C compiles and uses I::m because I is listed first."
          - "Both B and C compile cleanly; C inherits J::m because J is listed last."
        correct_answer: "B compiles and uses A::m (class beats interface); C fails to compile until it overrides m() (optionally calling I.super.m() or J.super.m())."
        explanation: |
          Java's default method resolution rules (Slides 135–136):
          * For **`B extends A implements I`**: **Class always wins over interface** — `B` compiles cleanly and inherits `A::m` without needing to override `m()`.
          * For **`C implements I, J`**: `I` and `J` are unrelated interfaces both providing `default void m()`. Declaration order (`I, J` vs `J, I`) is **never** used as a tiebreaker! `C` fails to compile until it explicitly overrides `public void m()`, where it may delegate via `I.super.m()` or `J.super.m()`.
        hints:
          - "In `class B extends A implements I`, does the concrete superclass method or the interface `default` method take precedence?"
          - "Does Java break ties between two sibling interfaces `implements I, J` by the order they are listed?"

      - id: qz-sealed-interface-constants
        block_type: quiz_question
        question_type: multiple_choice
        difficulty: 3
        related_block_id: th-interfaces-sealed-defaults
        title: "Sealed Types & Interface Constant Evaluation"
        question: |
          Consider:

          ```java
          interface Config {
              java.util.Random R = new java.util.Random();
              int SEED = R.nextInt(100);
          }
          abstract sealed class Shape permits Circle {}
          ```

          Which statement is TRUE?
        options:
          - "Config compiles cleanly (SEED is public static final and evaluated once when Config is loaded); Circle must be declared final, sealed, or non-sealed."
          - "Config fails to compile because interface constants must be compile-time literals, not runtime method calls."
          - "Config compiles, and accessing Config.SEED twice in the same program run returns two different random numbers."
          - "Circle may omit final/sealed/non-sealed and defaults to non-sealed."
        correct_answer: "Config compiles cleanly (SEED is public static final and evaluated once when Config is loaded); Circle must be declared final, sealed, or non-sealed."
        explanation: |
          * **Interface constants (Slide 131):** Interface fields are implicitly `public static final`, and they **may** be initialized using non-constant runtime expressions like `R.nextInt(100)`. Because they are `static`, `SEED` is initialized **once** when `Config` is loaded by the JVM — so it stays constant throughout a single run, though it can differ across separate program executions.
          * **Sealed hierarchies (Slide 126):** Every permitted direct subclass of a `sealed` class **must explicitly** declare `final`, `sealed`, or `non-sealed` (there is no implicit default).
        hints:
          - "Are interface fields (`public static final`) allowed to be initialized by runtime expressions like `new Random().nextInt(10)`?"
          - "What modifier requirement does Java 17 enforce on every class listed in a `permits` clause?"

      - id: qz-enum-internals-override
        block_type: quiz_question
        question_type: code_output
        difficulty: 3
        related_block_id: code-enum-rich-operation
        title: "Predict Output: Rich Enum with Abstract Method & toString()"
        question: |
          What does the following program print?

          ```java
          enum Op {
              ADD("+") { int apply(int a, int b) { return a + b; } },
              MUL("*") { int apply(int a, int b) { return a * b; } };
              private final String sym;
              Op(String sym) { this.sym = sym; }
              abstract int apply(int a, int b);
              @Override public String toString() { return sym; }
          }
          public class Main {
              public static void main(String[] args) {
                  Op op = Op.valueOf("MUL");
                  System.out.println(op.ordinal() + ":" + op.name() + ":" + op + "=" + op.apply(3, 4));
              }
          }
          ```
        options:
          - "1:MUL:*=12"
          - "2:MUL:*=12"
          - "1:*:*=12"
          - "Compile-time error: cannot override toString() in an enum because Enum.toString() is final"
        correct_answer: "1:MUL:*=12"
        explanation: |
          * `Op.valueOf("MUL")` looks up the constant by its exact identifier `name()` (`"MUL"`), which is at 0-based `ordinal()` index **`1`** (`ADD` is `0`, `MUL` is `1`).
          * `op.name()` is `final` in `java.lang.Enum` and always returns `"MUL"`.
          * `op` in string concatenation calls the overridden `toString()` (which is **NOT** `final` in `Enum`), returning `"*"`.
          * `op.apply(3, 4)` dispatches to `MUL`'s anonymous-subclass implementation, returning `3 * 4 = 12`.
          * Putting it together: `1:MUL:*=12`.
        hints:
          - "Is `ordinal()` 0-based or 1-based?"
          - "Which method is `final` in `java.lang.Enum`: `name()` or `toString()`?"
